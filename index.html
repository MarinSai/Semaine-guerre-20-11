 información e injerencia «a gran escala», «financiados, dirigidos y supervisados por la administración presidencial rusa». Según el Consejo, la SDA ha orquestado campañas de desinformación dirigidas contra los Estados miembros, las instituciones de la Unión y el apoyo de los europeos a Ucrania, en particular durante las elecciones europeas de 2024, así como «operaciones específicas» contra Estados miembros como Alemania y Francia. También se han sancionado a veinticuatro personas que trabajaban para la SDA y que contribuyeron a las campañas denominadas «contracampaña europea» y «contracampaña ucraniana», así como a los propagandistas Vitaly Eliseev, Petr Marchenko, Yurii Podoliaka y Chay Bowes, de RT. A las personas afectadas se les han congelado los activos y se les ha prohibido la entrada en el territorio de la Unión. La SDA ya ha sido relacionada con la red de desinformación Doppelgänger."},it:{nom:"Le campagne di disinformazione della Social Design Agency prendono di mira l’Unione, la Germania e la Francia",pays:"Germania / Francia",lieu:"Germania / Francia",desc:"Il 16 novembre 2026, il Consiglio dell’Unione impone sanzioni alla Social Design Agency (SDA), società moscovita specializzata in relazioni pubbliche e tecnologie politiche che, secondo il Consiglio, conduce progetti di manipolazione dell’informazione e di ingerenza «su larga scala», «finanziati, diretti e supervisionati dall’amministrazione presidenziale russa». Secondo il Consiglio, la SDA ha orchestrato campagne di disinformazione rivolte agli Stati membri, alle istituzioni dell’Unione e al sostegno degli europei all’Ucraina, in particolare in occasione delle elezioni europee del 2024, nonché «operazioni mirate» contro Stati membri quali la Germania e la Francia. Sono state sanzionate anche ventiquattro persone che lavoravano per la SDA e che hanno contribuito alle campagne denominate «controcampagna europea» e «controcampagna ucraina», così come i propagandisti Vitaly Eliseev, Petr Marchenko, Yurii Podoliaka e Chay Bowes, di RT. Le persone interessate sono soggette al congelamento dei beni e al divieto di ingresso nel territorio dell’Unione. La SDA è già stata collegata alla rete di disinformazione Doppelgänger."}}},{id:"EVEN6376",p:8,cat:1,seuil:"Non déterminé",passe:!1,date:"2026-11-16",entree:"2026-11-17",src:"https://www.24chasa.bg/bulgaria/article/23943492",txt:{fr:{nom:"Un cargo chargé de blé chavire au large du cap Kaliakra après une frappe de drones marins",pays:"Bulgarie",lieu:"Au large du cap Kaliakra",desc:"Le 16 novembre 2026 au matin, le cargo Betul 8, battant pavillon somalien et transportant environ 3 000 tonnes de blé de Roumanie vers l'Égypte, est touché par des drones marins dans la zone économique exclusive bulgare, à environ 40 milles nautiques au sud-est du cap Kaliakra, puis chavire. Les douze membres d'équipage sont secourus et transportés à terre par hélicoptère, sans blessure grave. Selon l'un d'eux, le navire a été attaqué à deux reprises : « Je pense qu'un drone russe nous a frappés. Il est peu probable qu'il soit ukrainien, car nous venions d'Ukraine. » Aucune autorité n'a désigné de responsable. La précédente attaque dans les eaux bulgares visait le porte-conteneurs Contship Jet, près du cap Kaliakra, le 28 octobre 2026."},es:{nom:"Un carguero cargado de trigo naufraga frente al cabo Kaliakra tras un ataque de drones marinos",pays:"Bulgaria",lieu:"Frente a las costas del cabo Kaliakra",desc:"La mañana del 16 de noviembre de 2026, el carguero Betul 8, que enarbolaba pabellón somalí y transportaba unas 3 000 toneladas de trigo desde Rumanía hacia Egipto, fue alcanzado por drones marinos en la zona económica exclusiva de Bulgaria, a unas 40 millas náuticas al sureste del cabo Kaliakra, tras lo cual zozobra. Los doce tripulantes son rescatados y trasladados a tierra en helicóptero, sin lesiones graves. Según uno de ellos, el buque fue atacado en dos ocasiones: «Creo que nos ha alcanzado un dron ruso. Es poco probable que sea ucraniano, ya que veníamos de Ucrania. » Ninguna autoridad ha señalado a ningún responsable. El ataque anterior en aguas búlgaras tuvo como objetivo el portacontenedores Contship Jet, cerca del cabo Kaliakra, el 28 de octubre de 2026."},it:{nom:"Una nave da carico carica di grano si capovolge al largo di Capo Kaliakra dopo un attacco da parte di droni marini",pays:"Bulgaria",lieu:"Al largo di Capo Kaliakra",desc:"La mattina del 16 novembre 2026, la nave da carico Betul 8, battente bandiera somala e che trasportava circa 3.000 tonnellate di grano dalla Romania verso l’Egitto, viene colpita da droni marini nella zona economica esclusiva bulgara, a circa 40 miglia nautiche a sud-est di Capo Kaliakra, per poi capovolgersi. I dodici membri dell’equipaggio vengono soccorsi e trasportati a terra in elicottero, senza riportare ferite gravi. Secondo uno di loro, la nave è stata attaccata due volte: «Penso che ci abbia colpiti un drone russo. È improbabile che fosse ucraino, dato che provenivamo dall’Ucraina. » Nessuna autorità ha attribuito la responsabilità dell’attacco. Il precedente attacco nelle acque bulgare aveva preso di mira la portacontainer Contship Jet, nei pressi di Capo Kaliakra, il 28 ottobre 2026."}}},{id:"EVEN6384",p:8,cat:6,seuil:"Non déterminé",passe:!1,date:"2026-11-16",entree:"2026-11-17",src:"https://cloud.google.com/blog/topics/threat-intelligence/agentic-threat-activity-crosses-a-significant-threshold",txt:{fr:{nom:"Des pirates russophones visent des sites français avec une cyberattaque entièrement automatisée par IA",pays:"France",lieu:"France",desc:"Le 16 novembre 2026, le Google Threat Intelligence Group (GTIG) publie un rapport selon lequel des pirates ont, pour la première fois, automatisé entièrement la découverte et l'exploitation de vulnérabilités, « sans humain dans la boucle ». Le GTIG dit avoir identifié un serveur relais exposé hébergeant un ensemble d'agents d'IA, baptisé exploit_agent, qui compare le code de logiciels web avant et après la publication de correctifs, rédige des exploits et les exécute automatiquement. Des données exfiltrées de victimes et des scripts de reconnaissance interne, de force brute et d'installation de webshells y ont été retrouvés. Selon le rapport, les données des victimes présentes sur le serveur indiquent que l'opérateur visait en particulier des sites français des médias, du divertissement et de l'éducation. Des commentaires en russe figurent dans un fichier de configuration du dispositif. Le GTIG ne nomme ni groupe ni État, et aucune autorité n'a désigné de responsable."},es:{nom:"Hackers de habla rusa atacan sitios web franceses con un ciberataque totalmente automatizado mediante IA",pays:"Francia",lieu:"Francia",desc:"El 16 de noviembre de 2026, el Google Threat Intelligence Group (GTIG) publica un informe según el cual unos piratas informáticos han automatizado por primera vez por completo la detección y el aprovechamiento de vulnerabilidades, «sin intervención humana». El GTIG afirma haber identificado un servidor de retransmisión expuesto que aloja un conjunto de agentes de IA, denominado «exploit_agent», que compara el código de los programas web antes y después de la publicación de los parches, redacta exploits y los ejecuta automáticamente. En él se han encontrado datos sustraídos a las víctimas, así como scripts de reconocimiento interno, de ataque por fuerza bruta y de instalación de webshells. Según el informe, los datos de las víctimas presentes en el servidor indican que el operador tenía como objetivo, en particular, sitios web franceses de los sectores de los medios de comunicación, el entretenimiento y la educación. En un archivo de configuración del dispositivo aparecen comentarios en ruso. El GTIG no nombra ni a ningún grupo ni a ningún Estado, y ninguna autoridad ha señalado a ningún responsable."},it:{nom:"Hacker di lingua russa prendono di mira siti francesi con un attacco informatico interamente automatizzato tramite IA",pays:"Francia",lieu:"Francia",desc:"Il 16 novembre 2026, il Google Threat Intelligence Group (GTIG) pubblica un rapporto secondo cui alcuni hacker hanno, per la prima volta, automatizzato completamente l’individuazione e lo sfruttamento delle vulnerabilità, «senza alcun intervento umano». Il GTIG afferma di aver identificato un server relay esposto che ospita una serie di agenti di intelligenza artificiale, denominati «exploit_agent», che confrontano il codice dei software web prima e dopo la pubblicazione delle patch, scrivono exploit e li eseguono automaticamente. Su di esso sono stati rinvenuti dati sottratti alle vittime e script per la ricognizione interna, attacchi di forza bruta e l’installazione di webshell. Secondo il rapporto, i dati delle vittime presenti sul server indicano che l’operatore prendeva di mira in particolare siti francesi nei settori dei media, dell’intrattenimento e dell’istruzione. In un file di configurazione del dispositivo sono presenti commenti in russo. Il GTIG non nomina né gruppi né Stati, e nessuna autorità ha individuato un responsabile."}}},{id:"EVEN6426",p:8,cat:1,seuil:"Attribué",passe:!0,date:"2026-09-17",entree:"2026-11-18",src:"https://observatornews.ro/extern/nava-turceasca-lovita-de-o-drona-ruseasca-pe-bastroe-langa-romania-turcii-anunta-2-morti-si-13-raniti-666567.html",txt:{fr:{nom:"Un cargo frappé par un drone près de la frontière roumaine dérive et s'échoue sur la plage de Vadu",pays:"Roumanie",lieu:"Canal de Bystre ; Vadu",desc:"Le 17 septembre 2026, le cargo Mariam M, appartenant à une société turque et battant pavillon tanzanien, est touché par un drone alors qu'il transite par le secteur ukrainien du canal de Bystre, dans le delta du Danube, près de la frontière roumaine. Le ministère ukrainien des Transports écrit que le navire, qui se dirigeait vers un port ukrainien, « a été attaqué par un drone russe » et que « la Russie continue d'attaquer la navigation civile en mer Noire » ; il fait état d'un mort, le capitaine, et de trois membres d'équipage blessés. Selon l'Autorité navale roumaine, le navire reste ensuite ancré dans la zone ukrainienne jusqu'au 14 novembre 2026, date à laquelle son ancre se rompt ; il dérive alors, sans équipage ni cargaison, vers la zone de responsabilité roumaine. Le 16 novembre, avant qu'un navire de l'Agence roumaine de sauvetage en mer (ARSVOM) puisse le remorquer, il est poussé vers la côte par l'état de la mer et s'échoue dans la zone de Vadu, dans le județ de Constanța. L'armateur a confié le renflouement à la société de remorquage COREMAR."},es:{nom:"Un buque de carga alcanzado por un dron cerca de la frontera rumana va a la deriva y encalla en la playa de Vadu",pays:"Rumanía",lieu:"Canal de Bystre; Vadu",desc:"El 17 de septiembre de 2026, el carguero Mariam M, propiedad de una empresa turca y que enarbolaba pabellón tanzano, fue alcanzado por un dron mientras transitaba por el tramo ucraniano del canal de Bystre, en el delta del Danubio, cerca de la frontera con Rumanía. El Ministerio de Transportes de Ucrania afirma que el buque, que se dirigía a un puerto ucraniano, «fue atacado por un dron ruso» y que «Rusia sigue atacando la navegación civil en el mar Negro»; se informa de un fallecido, el capitán, y de tres tripulantes heridos. Según la Autoridad Naval rumana, el buque permaneció fondeado en la zona ucraniana hasta el 14 de noviembre de 2026, fecha en la que se rompió su ancla; a partir de entonces, a la deriva, sin tripulación ni carga, se dirigió hacia la zona de responsabilidad rumana. El 16 de noviembre, antes de que un buque de la Agencia Rumana de Salvamento Marítimo (ARSVOM) pudiera remolcarlo, el estado del mar lo empujó hacia la costa y encalló en la zona de Vadu, en el județ de Constanța. El armador encargó el reflotamiento a la empresa de remolque COREMAR."},it:{nom:"Una nave da carico colpita da un drone vicino al confine rumeno va alla deriva e si incaglia sulla spiaggia di Vadu",pays:"Romania",lieu:"Canale di Bystre; Vadu",desc:"Il 17 settembre 2026, la nave da carico Mariam M, di proprietà di una società turca e battente bandiera tanzaniana, viene colpita da un drone mentre transita nel tratto ucraino del canale di Bystre, nel delta del Danubio, vicino al confine rumeno. Il Ministero dei Trasporti ucraino riferisce che la nave, diretta verso un porto ucraino, «è stata attaccata da un drone russo» e che «la Russia continua ad attaccare la navigazione civile nel Mar Nero»; riferisce di un morto, il capitano, e di tre membri dell’equipaggio feriti. Secondo l’Autorità navale rumena, la nave è rimasta poi ancorata nella zona ucraina fino al 14 novembre 2026, data in cui la sua ancora si è spezzata; ha quindi iniziato a andare alla deriva, senza equipaggio né carico, verso la zona di competenza rumena. Il 16 novembre, prima che una nave dell’Agenzia rumena di soccorso in mare (ARSVOM) potesse rimorchiarla, la nave viene spinta verso la costa dalle condizioni del mare e si incaglia nella zona di Vadu, nel județ di Constanța. L’armatore ha affidato il recupero alla società di rimorchio COREMAR."}}},{id:"EVENM015",p:8,cat:5,seuil:"Suspecté",passe:!1,date:"2026-10-07",entree:"2026-11-18",src:"https://alethea.com/hubfs/Operation%20Doppelganger_%20Alethea%20Report%20Oct%202026.pdf",txt:{fr:{nom:"De faux sites imitant Le Parisien et Le Point visent Emmanuel Macron et des candidats à la présidentielle de 2027",pays:"France",lieu:"Paris",desc:"Dans un rapport publié en octobre 2026, la société d'analyse américaine Alethea indique que le réseau russe Doppelgänger a diffusé du 7 au 9 octobre 2026, en trois vagues, les messages de plus de 50 faux comptes sur X, relayés par plus de 1 000 comptes automatisés. Une partie renvoie vers de faux sites imitant Le Parisien et Le Point, dont les domaines avaient été enregistrés le 12 mai 2025, avec des articles sous de fausses signatures de l'AFP. Les messages destinés au public français accusent Emmanuel Macron de sacrifier les dépenses sociales à la défense et au soutien à l'Ukraine ; les faux articles titrent notamment « Macron détruit l'État social » et « Macron l'a reconnu : l'Europe a perdu l'un de ses avantages industriels », et visent aussi Gabriel Attal et Raphaël Glucksmann. La même infrastructure vise les élections de mi-mandat aux États-Unis et les élections en Israël. Alethea attribue l'opération, avec un degré de confiance élevé, à Doppelgänger, campagne que le ministère américain de la Justice impute à la Social Design Agency, agissant sous la direction de l'administration présidentielle russe. Le Conseil de l'Union a sanctionné cette agence le 16 novembre 2026."},es:{nom:"Unas páginas web falsas que imitan a Le Parisien y Le Point tienen como objetivo a Emmanuel Macron y a los candidatos a las elecciones presidenciales de 2027",pays:"Francia",lieu:"París",desc:"En un informe publicado en octubre de 2026, la empresa de análisis estadounidense Alethea señala que la red rusa Doppelgänger difundió, del 7 al 9 de octubre de 2026, en tres oleadas, los mensajes de más de 50 cuentas falsas en X, difundidos por más de 1 000 cuentas automatizadas. Una parte de ellos redirige a sitios web falsos que imitan a Le Parisien y Le Point, cuyos dominios se habían registrado el 12 de mayo de 2025, con artículos firmados falsamente por la AFP. Los mensajes, dirigidos al público francés, acusan a Emmanuel Macron de sacrificar el gasto social en favor de la defensa y el apoyo a Ucrania; los artículos falsos llevan títulos como «Macron destruye el Estado del bienestar» y «Macron lo ha reconocido: Europa ha perdido una de sus ventajas industriales», y también apuntan contra Gabriel Attal y Raphaël Glucksmann. La misma infraestructura tiene como objetivo las elecciones de mitad de mandato en Estados Unidos y las elecciones en Israel. Alethea atribuye la operación, con un alto grado de confianza, a Doppelgänger, campaña que el Ministerio de Justicia estadounidense imputa a la Social Design Agency, que actúa bajo la dirección de la administración presidencial rusa. El Consejo de la Unión impuso sanciones a esta agencia el 16 de noviembre de 2026."},it:{nom:"Siti falsi che imitano «Le Parisien» e «Le Point» prendono di mira Emmanuel Macron e i candidati alle elezioni presidenziali del 2027",pays:"Francia",lieu:"Parigi",desc:"In un rapporto pubblicato nell’ottobre 2026, la società di analisi statunitense Alethea indica che la rete russa Doppelgänger ha diffuso dal 7 al 9 ottobre 2026, in tre ondate, i messaggi di oltre 50 account falsi su X, ripubblicati da più di 1.000 account automatizzati. Una parte rimanda a siti falsi che imitano «Le Parisien» e «Le Point», i cui domini erano stati registrati il 12 maggio 2025, con articoli firmati con false firme dell’AFP. I messaggi destinati al pubblico francese accusano Emmanuel Macron di sacrificare la spesa sociale a favore della difesa e del sostegno all’Ucraina; i falsi articoli recano titoli quali «Macron distrugge lo Stato sociale» e «Macron lo ha ammesso: l’Europa ha perso uno dei suoi vantaggi industriali», e prendono di mira anche Gabriel Attal e Raphaël Glucksmann. La stessa infrastruttura prende di mira le elezioni di medio termine negli Stati Uniti e le elezioni in Israele. Alethea attribuisce l’operazione, con un elevato grado di affidabilità, a Doppelgänger, una campagna che il Dipartimento di Giustizia statunitense attribuisce alla Social Design Agency, che agisce sotto la direzione dell’amministrazione presidenziale russa. Il Consiglio dell’Unione ha sanzionato tale agenzia il 16 novembre 2026."}}},{id:"EVEN6423",p:8,cat:0,seuil:"Attribué",passe:!1,date:"2026-11-17",entree:"2026-11-18",src:"https://telex.hu/belfold/2026/11/17/magyar-peter-mara-es-holnapra-leallitjuk-a-vasuti-kozlekedest-magyarorszag-es-ukrajna-kozott",txt:{fr:{nom:"Un drone russe s'écrase à 300 mètres de la gare de Moukatchevo, en Transcarpatie",pays:"Hongrie",lieu:"Moukatchevo",desc:"Le 17 novembre 2026 au matin, des drones russes Geran-2 attaquent la Transcarpatie, région ukrainienne frontalière de la Hongrie, en trois vagues vers 10h, heure hongroise, principalement autour de Moukatchevo et d'Oujgorod, selon la ministre hongroise des Affaires étrangères, Anita Orbán, qui indique que la défense antiaérienne ukrainienne en abat plusieurs, que plusieurs impacts sont signalés et que l'évaluation des dégâts se poursuit. Un drone s'écrase dans la cour d'un site industriel de Moukatchevo ; aucune victime n'est signalée. Le Premier ministre hongrois, Péter Magyar, écrit : « Il y a peu, en Transcarpatie, un drone russe s'est écrasé à 300 mètres de la gare de Moukatchevo. Le personnel hongrois du train venu de Hongrie a été débarqué. Aujourd'hui et demain, nous suspendons la circulation ferroviaire entre la Hongrie et l'Ukraine. » Des alertes aériennes sont déclenchées autour de Moukatchevo et d'Oujgorod ; les élèves sont conduits dans des abris. L'alerte est levée sur l'ensemble de la Transcarpatie en fin de matinée."},es:{nom:"Un dron ruso se estrella a 300 metros de la estación de Mukachevo, en Transcarpatia",pays:"Hungría",lieu:"Mukachevo",desc:"La mañana del 17 de noviembre de 2026, unos drones rusos Geran-2 atacan Transcarpatia, una región ucraniana fronteriza con Hungría, en tres oleadas hacia las 10:00, hora húngara, principalmente en los alrededores de Mukachevo y Uzhhorod, según la ministra de Asuntos Exteriores húngara, Anita Orbán, quien indica que la defensa antiaérea ucraniana derriba varios de ellos, que se han registrado varios impactos y que continúa la evaluación de los daños. Un dron se estrella en el patio de un complejo industrial de Mukachevo; no se han registrado víctimas. El primer ministro húngaro, Péter Magyar, escribe: «Hace poco, en Transcarpatia, un dron ruso se ha estrellado a 300 metros de la estación de Mukachevo. Se ha hecho bajar del tren al personal húngaro que venía de Hungría. Hoy y mañana suspendemos el tráfico ferroviario entre Hungría y Ucrania. » Se han activado alertas aéreas en los alrededores de Mukachevo y Uzhhorod; se ha trasladado a los alumnos a refugios. La alerta se ha levantado en toda Transcarpatia a última hora de la mañana."},it:{nom:"Un drone russo si schianta a 300 metri dalla stazione ferroviaria di Mukachevo, in Transcarpazia",pays:"Ungheria",lieu:"Mukachevo",desc:"La mattina del 17 novembre 2026, alcuni droni russi Geran-2 attaccano la Transcarpazia, regione ucraina al confine con l’Ungheria, in tre ondate intorno alle 10, ora ungherese, principalmente nei pressi di Mukachevo e Uzhhorod, secondo quanto riferito dal ministro degli Affari esteri ungherese, Anita Orbán, la quale precisa che la difesa antiaerea ucraina ne abbatte diversi, che vengono segnalati numerosi impatti e che la valutazione dei danni è ancora in corso. Un drone si è schiantato nel cortile di un sito industriale di Mukachevo; non si segnalano vittime. Il primo ministro ungherese, Péter Magyar, scrive: «Poco fa, in Transcarpazia, un drone russo si è schiantato a 300 metri dalla stazione ferroviaria di Mukachevo. Il personale ungherese del treno proveniente dall’Ungheria è stato fatto scendere. Oggi e domani sospendiamo il traffico ferroviario tra l’Ungheria e l’Ucraina. » Sono stati diramati allarmi aerei nei dintorni di Mukachevo e Uzhgorod; gli studenti sono stati condotti nei rifugi. L’allarme è stato revocato in tutta la Transcarpazia in tarda mattinata."}}},{id:"EVEN6429",p:8,cat:1,seuil:"Non déterminé",passe:!1,date:"2026-11-17",entree:"2026-11-18",src:"https://www.vg.no/nyheter/i/KL3jp7/gasstanker-angrepet-av-drone-i-svartehavet",txt:{fr:{nom:"Un pétrolier gazier chargé de propane coule au large de Byala après une frappe de drones",pays:"Bulgarie",lieu:"Au large de Byala",desc:"Le 17 novembre 2026, le pétrolier gazier Gas Husky, battant pavillon libérien et transportant environ 3 400 tonnes de gaz de pétrole liquéfié d'Alexandrie, en Égypte, vers le port roumain de Midia, coule dans la zone économique exclusive bulgare, à environ 50 milles à l'est de Byala. Selon le ministère bulgare de la Défense, le navire disparaît des radars peu après minuit et sa balise de détresse se déclenche à 8h02. Deux avions Su-25 et un hélicoptère Cougar participent à l'opération de sauvetage ; les 19 membres d'équipage, de nationalité philippine, qui ont pu mettre à l'eau un radeau de sauvetage, sont évacués par hélicoptère vers la base de Chaika, à Varna. L'Autorité navale roumaine indique que le navire a été touché par des drones. La veille, le cargo Betul 8 avait chaviré non loin de là, au large du cap Kaliakra, après une frappe de drones marins. Le Gas Husky est le septième navire touché dans la zone économique exclusive bulgare depuis début octobre 2026."},es:{nom:"Un buque cisterna de gas cargado de propano se hunde frente a las costas de Byala tras un ataque con drones",pays:"Bulgaria",lieu:"Frente a las costas de Byala",desc:"El 17 de noviembre de 2026, el buque cisterna de gas Gas Husky, que enarbolaba pabellón liberiano y transportaba unas 3 400 toneladas de gas licuado de petróleo desde Alejandría, en Egipto, hacia el puerto rumano de Midia, se hunde en la zona económica exclusiva de Bulgaria, a unas 50 millas al este de Byala. Según el Ministerio de Defensa búlgaro, el buque desaparece de los radares poco después de medianoche y su baliza de socorro se activa a las 8:02. Dos aviones Su-25 y un helicóptero Cougar participan en la operación de rescate; los 19 tripulantes, de nacionalidad filipina, que lograron lanzar al agua una balsa salvavidas, son evacuados en helicóptero a la base de Chaika, en Varna. La Autoridad Naval rumana indica que el buque fue alcanzado por drones. El día anterior, el carguero Betul 8 había zozobrado no muy lejos de allí, frente al cabo Kaliakra, tras un ataque de drones marinos. El Gas Husky es el séptimo buque atacado en la zona económica exclusiva búlgara desde principios de octubre de 2026."},it:{nom:"Una nave cisterna per il trasporto di gas, carica di propano, affonda al largo di Byala dopo un attacco con droni",pays:"Bulgaria",lieu:"Al largo di Byala",desc:"Il 17 novembre 2026, la nave cisterna per il trasporto di gas «Gas Husky», battente bandiera liberiana e che trasportava circa 3.400 tonnellate di gas di petrolio liquefatto da Alessandria d’Egitto verso il porto rumeno di Midia, affonda nella zona economica esclusiva bulgara, a circa 50 miglia a est di Byala. Secondo il Ministero della Difesa bulgaro, la nave scompare dai radar poco dopo mezzanotte e il suo segnalatore di soccorso si attiva alle 8:02. Due aerei Su-25 e un elicottero Cougar partecipano all’operazione di soccorso; i 19 membri dell’equipaggio, di nazionalità filippina, che sono riusciti a calare in mare una zattera di salvataggio, vengono evacuati in elicottero verso la base di Chaika, a Varna. L’Autorità navale rumena riferisce che la nave è stata colpita da droni. Il giorno prima, la nave da carico Betul 8 si era capovolta non lontano da lì, al largo di Capo Kaliakra, in seguito a un attacco da parte di droni marini. La Gas Husky è la settima nave colpita nella zona economica esclusiva bulgara dall’inizio di ottobre 2026."}}},{id:"EVEN6522",p:8,cat:0,seuil:"Attribué",passe:!1,date:"2026-11-17",entree:"2026-11-18",src:"https://www.reuters.com/world/moldovan-president-says-russian-drone-flew-over-capital-2026-11-17/",txt:{fr:{nom:"Sept drones violent l'espace aérien moldave, dont un au-dessus de Chișinău",pays:"Moldavie",lieu:"Chișinău",desc:"Le 17 novembre 2026, pendant une attaque russe massive contre l'Ukraine, sept drones violent l'espace aérien moldave en deux heures et demie environ, selon le ministère moldave de la Défense. Un drone de type Shahed se dirige vers le secteur de Botanica, à Chișinău ; l'espace aérien est fermé à 16h27. Cinq drones tombent près de Cheltuitori, Pohorniceni, Pohrebeni, Cuhureștii de Jos et Băxani, sans faire de victime. La présidente Maia Sandu écrit : « Ce soir, plusieurs drones russes ont violé notre espace aérien, l'un d'eux au-dessus de Chișinău, alarmant les habitants. » Le 18 novembre 2026 au matin, le ministère des Affaires étrangères convoque l'ambassadeur désigné de Russie, Oleg Ozerov, et déclare : « Voilà à quoi ressemble la “paix” promue par le Kremlin : des drones d'attaque au-dessus de la capitale d'un État libre et souverain. La Russie ne respecte pas la République de Moldavie ni son peuple et met leur vie en danger. » Le ministère avait déjà convoqué Oleg Ozerov le 1er octobre 2026, après l'explosion d'un drone russe près de Brănești, dans le raion d'Orhei."},es:{nom:"Siete drones violan el espacio aéreo moldavo, uno de ellos sobre Chișinău",pays:"Moldavia",lieu:"Chișinău",desc:"El 17 de noviembre de 2026, durante un ataque masivo ruso contra Ucrania, siete drones violan el espacio aéreo moldavo en unas dos horas y media, según el Ministerio de Defensa moldavo. Un dron del tipo Shahed se dirige hacia el sector de Botanica, en Chișinău; el espacio aéreo se cierra a las 16:27. Cinco drones caen cerca de Cheltuitori, Pohorniceni, Pohrebeni, Cuhureștii de Jos y Băxani, sin causar víctimas. La presidenta Maia Sandu escribe: «Esta noche, varios drones rusos han violado nuestro espacio aéreo, uno de ellos sobre Chișinău, lo que ha alarmado a los habitantes. » La mañana del 18 de noviembre de 2026, el Ministerio de Asuntos Exteriores convoca al embajador designado de Rusia, Oleg Ozerov, y declara: «Así es la “paz” que promueve el Kremlin: drones de ataque sobre la capital de un Estado libre y soberano. Rusia no respeta a la República de Moldavia ni a su pueblo y pone en peligro sus vidas. » El Ministerio ya había convocado a Oleg Ozerov el 1 de octubre de 2026, tras la explosión de un dron ruso cerca de Brănești, en el raion de Orhei."},it:{nom:"Sette droni violano lo spazio aereo moldavo, di cui uno sopra Chișinău",pays:"Moldavia",lieu:"Chișinău",desc:"Il 17 novembre 2026, durante un massiccio attacco russo contro l’Ucraina, sette droni violano lo spazio aereo moldavo in circa due ore e mezza, secondo quanto riferito dal Ministero della Difesa moldavo. Un drone di tipo Shahed si dirige verso la zona di Botanica, a Chișinău; lo spazio aereo viene chiuso alle 16:27. Cinque droni cadono nei pressi di Cheltuitori, Pohorniceni, Pohrebeni, Cuhureștii de Jos e Băxani, senza causare vittime. La presidente Maia Sandu scrive: «Stasera, diversi droni russi hanno violato il nostro spazio aereo, uno dei quali sopra Chișinău, allarmando gli abitanti. » La mattina del 18 novembre 2026, il Ministero degli Affari Esteri convoca l’ambasciatore designato della Russia, Oleg Ozerov, e dichiara: «Ecco com’è la “pace” promossa dal Cremlino: droni d’attacco sopra la capitale di uno Stato libero e sovrano. La Russia non rispetta la Repubblica di Moldavia né il suo popolo e mette in pericolo le loro vite. » Il ministero aveva già convocato Oleg Ozerov il 1° ottobre 2026, in seguito all’esplosione di un drone russo nei pressi di Brănești, nel raion di Orhei."}}},{id:"EVEN6525",p:8,cat:6,seuil:"Non déterminé",passe:!1,date:"2026-11-17",entree:"2026-11-18",src:"https://www.reuters.com/business/energy/equinor-says-cyberattack-against-company-has-been-stopped-2026-11-20/",txt:{fr:{nom:"Une cyberattaque vise des systèmes informatiques du groupe énergétique norvégien Equinor",pays:"Norvège",lieu:"Stavanger",desc:"Le 17 novembre 2026 au soir, le groupe énergétique norvégien Equinor, détenu à 67 % par l'État, annonce dans un communiqué avoir détecté une cyberattaque en cours contre certains de ses systèmes informatiques et avoir mobilisé des moyens pour la neutraliser. Selon l'entreprise, rien n'indique que des données aient été volées et l'attaque n'a affecté ni ses opérations ni sa production. L'Autorité nationale de sécurité (NSM), l'Autorité norvégienne de l'industrie océanique (Havtil) et plusieurs ministères ont été avertis ; le service de sécurité de la police (PST) a également été informé. Un porte-parole de la NSM déclare que l'incident « confirme que ce risque est bien élevé » : en octobre 2026, l'autorité avait relevé son évaluation du risque de cyberattaque au niveau 4 sur une échelle de 5. Le 20 novembre, Equinor annonce que l'attaque a été stoppée, sans conséquence sur la production ni indice de vol ou d'altération de données. Aucune autorité n'a désigné de responsable."},es:{nom:"Un ciberataque afecta a los sistemas informáticos del grupo energético noruego Equinor",pays:"Noruega",lieu:"Stavanger",desc:"La noche del 17 de noviembre de 2026, el grupo energético noruego Equinor, participada en un 67 % por el Estado, anuncia en un comunicado que ha detectado un ciberataque en curso contra algunos de sus sistemas informáticos y que ha movilizado recursos para neutralizarlo. Según la empresa, no hay indicios de que se hayan sustraído datos y el ataque no ha afectado ni a sus operaciones ni a su producción. Se ha avisado a la Autoridad Nacional de Seguridad (NSM), a la Autoridad Noruega de la Industria Oceánica (Havtil) y a varios ministerios; también se ha informado al Servicio de Seguridad de la Policía (PST). Un portavoz de la NSM afirma que el incidente «confirma que este riesgo es realmente elevado»: en octubre de 2026, la autoridad había elevado su evaluación del riesgo de ciberataque al nivel 4 en una escala de 5. El 20 de noviembre, Equinor anuncia que el ataque ha sido detenido, sin consecuencias para la producción ni indicios de robo o alteración de datos. Ninguna autoridad ha señalado a ningún responsable."},it:{nom:"Un attacco informatico prende di mira i sistemi informatici del gruppo energetico norvegese Equinor",pays:"Norvegia",lieu:"Stavanger",desc:"La sera del 17 novembre 2026, il gruppo energetico norvegese Equinor, controllato al 67% dallo Stato, annuncia in un comunicato di aver rilevato un attacco informatico in corso contro alcuni dei suoi sistemi informatici e di aver mobilitato risorse per neutralizzarlo. Secondo l’azienda, nulla indica che siano stati sottratti dati e l’attacco non ha influito né sulle sue operazioni né sulla sua produzione. Sono state allertate l’Autorità nazionale per la sicurezza (NSM), l’Autorità norvegese per l’industria oceanica (Havtil) e diversi ministeri; è stato informato anche il servizio di sicurezza della polizia (PST). Un portavoce della NSM ha dichiarato che l’incidente «conferma che il rischio è effettivamente elevato»: nell’ottobre 2026, l’autorità aveva innalzato la propria valutazione del rischio di attacchi informatici al livello 4 su una scala di 5. Il 20 novembre, Equinor ha annunciato che l’attacco è stato bloccato, senza conseguenze sulla produzione né indizi di furto o alterazione dei dati. Nessuna autorità ha individuato un responsabile."}}},{id:"EVEN6691",p:8,cat:2,seuil:"Suspecté",passe:!1,date:"2026-11-03",entree:"2026-11-19",src:"https://www.rp.pl/konflikty-zbrojne/art45490041-prowokacja-z-duza-liczba-ofiar-i-zrzuceniem-winy-na-ukraine-ustalilismy-co-powstrzymalo-rosje",txt:{fr:{nom:"Une provocation à la frontière avec Kaliningrad est déjouée par les forces de sécurité polonaises",pays:"Pologne",lieu:"Près de Sępopol",desc:"Dans la nuit du 2 au 3 novembre 2026, les garde-frontières polonais signalent un mouvement suspect de personnes munies de lampes torches à la frontière avec l'oblast russe de Kaliningrad, près de Sępopol ; les personnes repérées se retirent vers l'oblast, sans franchir la frontière. Le 3 novembre, le Premier ministre, Donald Tusk, déclare : « Nous avons très rapidement mobilisé sur place les forces et les moyens nécessaires, et nous avons réussi à empêcher une provocation », et ajoute : « La tension et l'escalade de la part de la Russie peuvent durer. » Selon lui, des services polonais et alliés avaient averti d'actes de sabotage « préparés par des services hostiles » au début de novembre ; des renforts de police, de contre-terroristes et de garde-frontières avaient été envoyés. Le 18 novembre 2026, des sources de sécurité affirment que des officiers des services russes coordonnant des actions de diversion étaient apparus côté russe et qu'une attaque à nombreuses victimes devait être imputée à l'Ukraine. Le ministre Tomasz Siemoniak déclare : « Si nous avons pris certaines mesures, c'est parce que nous avons estimé qu'il y avait une menace réelle. »"},es:{nom:"Las fuerzas de seguridad polacas frustran una provocación en la frontera con Kaliningrado",pays:"Polonia",lieu:"Cerca de Sępopol",desc:"En la noche del 2 al 3 de noviembre de 2026, los guardias fronterizos polacos alertan de un movimiento sospechoso de personas provistas de linternas en la frontera con la región rusa de Kaliningrado, cerca de Sępopol; las personas avistadas se retiran hacia la región, sin cruzar la frontera. El 3 de noviembre, el primer ministro, Donald Tusk, declara: «Hemos movilizado muy rápidamente sobre el terreno las fuerzas y los medios necesarios, y hemos logrado impedir una provocación», y añade: «La tensión y la escalada por parte de Rusia pueden prolongarse. » Según él, los servicios polacos y aliados habían advertido de actos de sabotaje «preparados por servicios hostiles» a principios de noviembre; se habían enviado refuerzos de policía, unidades antiterroristas y guardias fronterizos. El 18 de noviembre de 2026, fuentes de seguridad afirman que habían aparecido en el lado ruso oficiales de los servicios rusos que coordinaban acciones de distracción y que se pretendía atribuir a Ucrania un atentado con numerosas víctimas. El ministro Tomasz Siemoniak declara: «Si hemos tomado ciertas medidas es porque hemos considerado que existía una amenaza real»."},it:{nom:"Una provocazione al confine con Kaliningrad viene sventata dalle forze di sicurezza polacche",pays:"Polonia",lieu:"Nei pressi di Sępopol",desc:"Nella notte tra il 2 e il 3 novembre 2026, le guardie di frontiera polacche segnalano un movimento sospetto di persone munite di torce elettriche al confine con l’oblast russo di Kaliningrad, nei pressi di Sępopol; le persone individuate si ritirano verso l’oblast, senza attraversare il confine. Il 3 novembre, il Primo Ministro, Donald Tusk, dichiara: «Abbiamo mobilitato molto rapidamente sul posto le forze e i mezzi necessari, e siamo riusciti a impedire una provocazione», e aggiunge: «La tensione e l’escalation da parte della Russia potrebbero protrarsi». » Secondo lui, i servizi polacchi e alleati avevano segnalato atti di sabotaggio «preparati da servizi ostili» all’inizio di novembre; erano stati inviati rinforzi di polizia, antiterrorismo e guardie di frontiera. Il 18 novembre 2026, fonti della sicurezza affermano che sul versante russo erano comparsi ufficiali dei servizi russi che coordinavano azioni di diversione e che un attacco con numerose vittime avrebbe dovuto essere attribuito all’Ucraina. Il ministro Tomasz Siemoniak dichiara: «Se abbiamo adottato determinate misure, è perché abbiamo ritenuto che vi fosse una minaccia reale»."}}},{id:"EVEN6695",p:8,cat:6,seuil:"Non déterminé",passe:!1,date:"2026-11-18",entree:"2026-11-19",src:"https://www.reuters.com/legal/litigation/bulgaria-uncovers-five-year-cyberespionage-operation-2026-11-18/",txt:{fr:{nom:"Une opération de cyberespionnage de cinq ans contre des bases de données du gouvernement bulgare est découverte",pays:"Bulgarie",lieu:"Sofia",desc:"Le 18 novembre 2026, le ministre bulgare de l'Innovation et de la Transformation numérique, Ivan Vassilev, annonce la découverte d'une opération de piratage menée depuis 2021 contre des bases de données gouvernementales : plus de 130 Go de documents, soit environ 62 millions de pages, ont été téléchargés, dont des travaux du gouvernement, des rapports et la correspondance entre ministères. L'intrusion a été détectée en août 2026 par un nouveau système national de cybersécurité ; l'enquête a associé les services de renseignement, le ministère de la Défense, la police et des partenaires internationaux, dont l'ENISA. Selon le ministre, plusieurs groupes internationaux de pirates sont soupçonnés, mais aucune preuve concluante ne les relie à un gouvernement ou à un service de renseignement étranger. Il parle du « cas de cyberespionnage le plus long et le plus vaste jamais détecté contre l'administration bulgare » et indique qu'aucune preuve ne montre que des données personnelles de citoyens ont été compromises. Les systèmes touchés ont été isolés et le parquet a été saisi pour examiner d'éventuels manquements des institutions pendant les cinq années où l'intrusion est restée inaperçue."},es:{nom:"Se descubre una operación de ciberespionaje de cinco años contra bases de datos del Gobierno búlgaro",pays:"Bulgaria",lieu:"Sofía",desc:"El 18 de noviembre de 2026, el ministro búlgaro de Innovación y Transformación Digital, Ivan Vassilev, anuncia el descubrimiento de una operación de piratería informática llevada a cabo desde 2021 contra bases de datos gubernamentales: se han descargado más de 130 GB de documentos, lo que equivale a unos 62 millones de páginas, entre los que se incluyen trabajos del Gobierno, informes y correspondencia entre ministerios. La intrusión fue detectada en agosto de 2026 por un nuevo sistema nacional de ciberseguridad; en la investigación han colaborado los servicios de inteligencia, el Ministerio de Defensa, la policía y socios internacionales, entre ellos la ENISA. Según el ministro, se sospecha de varios grupos internacionales de piratas informáticos, pero no hay pruebas concluyentes que los vinculen con ningún gobierno o servicio de inteligencia extranjero. Se refiere al «caso de ciberespionaje más prolongado y de mayor alcance jamás detectado contra la administración búlgara» e indica que no hay pruebas que demuestren que se hayan visto comprometidos los datos personales de los ciudadanos. Los sistemas afectados han sido aislados y se ha remitido el caso a la fiscalía para que examine posibles incumplimientos por parte de las instituciones durante los cinco años en los que la intrusión pasó desapercibida."},it:{nom:"Scoperta un’operazione di spionaggio informatico durata cinque anni ai danni delle banche dati del governo bulgaro",pays:"Bulgaria",lieu:"Sofia",desc:"Il 18 novembre 2026, il ministro bulgaro dell’Innovazione e della Trasformazione digitale, Ivan Vassilev, annuncia la scoperta di un’operazione di pirateria informatica condotta dal 2021 contro banche dati governative: sono stati scaricati oltre 130 GB di documenti, pari a circa 62 milioni di pagine, tra cui atti governativi, relazioni e corrispondenza tra ministeri. L’intrusione è stata rilevata nell’agosto 2026 da un nuovo sistema nazionale di sicurezza informatica; l’indagine ha coinvolto i servizi di intelligence, il Ministero della Difesa, la polizia e partner internazionali, tra cui l’ENISA. Secondo il ministro, sono sospettati diversi gruppi internazionali di hacker, ma non vi sono prove conclusive che li colleghino a un governo o a un servizio di intelligence straniero. Egli parla del «caso di spionaggio informatico più lungo e di più ampia portata mai rilevato ai danni dell’amministrazione bulgara» e precisa che non vi sono prove che indichino che i dati personali dei cittadini siano stati compromessi. I sistemi colpiti sono stati isolati e il caso è stato deferito alla procura per verificare eventuali negligenze da parte delle istituzioni nei cinque anni in cui l’intrusione è rimasta inosservata."}}},{id:"EVEN6836",p:8,cat:6,seuil:"Non déterminé",passe:!1,date:"2026-10-22",entree:"2026-11-20",src:"https://www.politico.eu/newsletter/brussels-playbook/cyberattack-hits-the-commission/",txt:{fr:{nom:"Une cyberattaque assistée par l'IA vise la Commission européenne",pays:"Belgique",lieu:"Bruxelles",desc:"Le 19 novembre 2026, le porte-parole de la Commission européenne Thomas Regnier confirme que l'institution a été visée par une « cybercampagne générée par l'IA », liée à l'« utilisation abusive d'un outil d'IA » et détectée le 22 octobre. Selon lui, plusieurs applications ont été temporairement mises hors ligne « par mesure de protection et de prévention » et la plupart ont été rétablies. Une enquête a été ouverte immédiatement et aucun élément n'atteste une violation de données touchant l'ensemble du personnel. Il ne dit pas qui la Commission soupçonne et n'a connaissance d'aucune demande de rançon. Selon Politico, qui a révélé l'attaque le 19 novembre, la perturbation a duré plus de dix jours : Sysper, la plateforme de ressources humaines, et MyPMO, le système de remboursement des frais médicaux, ont été touchés, ainsi que des services de traduction. Le Corporate Management Board, plus haute instance interne de gestion de crise de la Commission, s'est réuni en urgence. Selon un responsable européen, les pirates ont utilisé Artex, un outil d'IA accessible au public conçu pour repérer les failles informatiques."},es:{nom:"Un ciberataque asistido por IA tiene como objetivo la Comisión Europea",pays:"Bélgica",lieu:"Bruselas",desc:"El 19 de noviembre de 2026, el portavoz de la Comisión Europea, Thomas Regnier, confirma que la institución ha sido objeto de una «cibercampaña generada por IA», relacionada con el «uso indebido de una herramienta de IA» y detectada el 22 de octubre. Según él, varias aplicaciones se desconectaron temporalmente «como medida de protección y prevención» y la mayoría ya se han restablecido. Se abrió una investigación de inmediato y no hay indicios de que se haya producido una filtración de datos que afecte a todo el personal. No reveló a quién sospecha la Comisión ni tiene constancia de ninguna petición de rescate. Según Politico, que reveló el ataque el 19 de noviembre, la interrupción se prolongó durante más de diez días: Sysper, la plataforma de recursos humanos, y MyPMO, el sistema de reembolso de gastos médicos, se vieron afectados, así como los servicios de traducción. El Consejo de Gestión Corporativa, la máxima instancia interna de gestión de crisis de la Comisión, se reunió de urgencia. Según un responsable europeo, los piratas informáticos utilizaron Artex, una herramienta de inteligencia artificial de acceso público diseñada para detectar vulnerabilidades informáticas."},it:{nom:"Un attacco informatico assistito dall’intelligenza artificiale prende di mira la Commissione europea",pays:"Belgio",lieu:"Bruxelles",desc:"Il 19 novembre 2026, il portavoce della Commissione europea Thomas Regnier conferma che l’istituzione è stata oggetto di una «campagna informatica generata dall’IA», legata all’«uso improprio di uno strumento di IA» e rilevata il 22 ottobre. Secondo lui, diverse applicazioni sono state temporaneamente messe fuori linea «a titolo di misura di protezione e prevenzione» e la maggior parte è stata ripristinata. È stata avviata immediatamente un’indagine e non vi sono elementi che attestino una violazione dei dati che abbia interessato l’intero personale. Regnier non ha specificato chi sia il sospettato dalla Commissione e non è a conoscenza di alcuna richiesta di riscatto. Secondo Politico, che ha rivelato l’attacco il 19 novembre, l’interruzione è durata più di dieci giorni: sono state colpite Sysper, la piattaforma delle risorse umane, e MyPMO, il sistema di rimborso delle spese mediche, oltre ai servizi di traduzione. Il Corporate Management Board, la massima autorità interna della Commissione in materia di gestione delle crisi, si è riunito d’urgenza. Secondo un funzionario europeo, gli hacker hanno utilizzato Artex, uno strumento di intelligenza artificiale accessibile al pubblico progettato per individuare le vulnerabilità informatiche."}}},{id:"EVENM017",p:8,cat:4,seuil:"Suspecté",passe:!1,date:"2026-11-02",entree:"2026-11-20",src:"https://vsquare.org/fsb-hackers-impersonated-hungarys-ex-foreign-minister-to-target-kremlin-critics/",txt:{fr:{nom:"Des pirates liés au FSB usurpent l'identité d'un ancien ministre hongrois pour cibler des critiques du Kremlin",pays:"Hongrie",lieu:"Budapest",desc:"Le 2 novembre 2026, le journaliste d'investigation hongrois Szabolcs Panyi reçoit sur sa messagerie Proton Mail un message au nom de l'ancien ministre des Affaires étrangères Géza Jeszenszky, envoyé depuis une adresse qui n'est pas la sienne, puis un PDF piégé. András Telkes, ancien directeur général adjoint du renseignement extérieur hongrois, reçoit un envoi comparable, dont le lien mène à une fausse page de connexion. Selon l'enquête publiée par Panyi le 16 novembre, le Citizen Lab conclut qu'un acteur étatique russe est derrière ces tentatives d'hameçonnage ciblé, et le Google Threat Intelligence Group les rattache à COLD RELIC (anciennement COLDRIVER), groupe que plusieurs gouvernements occidentaux, dont les États-Unis, relient au Centre 18 du FSB. D'autres cibles se sont fait connaître, dont l'expert de la Russie András Rácz et l'ancien secrétaire d'État János Herman, qui dit avoir répondu au message reçu le 9 novembre. Le 18 novembre, Telkes estime que l'opération visait à cartographier les experts proches du nouveau gouvernement. Panyi a alerté le bureau de sécurité nationale du cabinet du Premier ministre ; aucune autorité hongroise n'a désigné de responsable."},es:{nom:"Unos piratas informáticos vinculados al FSB suplantan la identidad de un exministro húngaro para atacar a los críticos del Kremlin",pays:"Hungría",lieu:"Budapest",desc:"El 2 de noviembre de 2026, el periodista de investigación húngaro Szabolcs Panyi recibe en su correo electrónico de Proton Mail un mensaje a nombre del exministro de Asuntos Exteriores Géza Jeszenszky, enviado desde una dirección que no es la suya, seguido de un PDF con un archivo malicioso. András Telkes, exdirector general adjunto de los servicios de inteligencia exterior húngaros, recibe un mensaje similar, cuyo enlace conduce a una página de inicio de sesión falsa. Según la investigación publicada por Panyi el 16 de noviembre, el Citizen Lab concluye que detrás de estos intentos de phishing selectivo se encuentra un actor estatal ruso, y el Google Threat Intelligence Group los vincula a COLD RELIC (antes COLDRIVER), grupo que varios gobiernos occidentales, entre ellos el de Estados Unidos, vinculan con el Centro 18 del FSB. Se han dado a conocer otros objetivos, entre ellos el experto en Rusia András Rácz y el exsecretario de Estado János Herman, quien afirma haber respondido al mensaje recibido el 9 de noviembre. El 18 de noviembre, Telkes consideró que la operación tenía como objetivo identificar a los expertos cercanos al nuevo Gobierno. Panyi alertó a la oficina de seguridad nacional de la Presidencia del Gobierno; ninguna autoridad húngara ha señalado a ningún responsable."},it:{nom:"Hacker legati all’FSB si spacciano per un ex ministro ungherese per prendere di mira i critici del Cremlino",pays:"Ungheria",lieu:"Budapest",desc:"Il 2 novembre 2026, il giornalista investigativo ungherese Szabolcs Panyi riceve sulla sua casella di posta Proton Mail un messaggio a nome dell’ex ministro degli Affari esteri Géza Jeszenszky, inviato da un indirizzo che non è il suo, seguito da un PDF infetto. András Telkes, ex vicedirettore generale dei servizi segreti esteri ungheresi, riceve un messaggio simile, il cui link rimanda a una falsa pagina di accesso. Secondo l’inchiesta pubblicata da Panyi il 16 novembre, il Citizen Lab conclude che dietro questi tentativi di phishing mirato si celi un attore statale russo, mentre il Google Threat Intelligence Group li ricollega a COLD RELIC (precedentemente noto come COLDRIVER), gruppo che diversi governi occidentali, tra cui gli Stati Uniti, collegano al Centro 18 dell’FSB. Si sono fatti avanti altri bersagli, tra cui l’esperto di Russia András Rácz e l’ex segretario di Stato János Herman, il quale afferma di aver risposto al messaggio ricevuto il 9 novembre. Il 18 novembre, Telkes ha ipotizzato che l’operazione mirasse a mappare gli esperti vicini al nuovo governo. Panyi ha allertato l’ufficio di sicurezza nazionale dell’ufficio del Primo Ministro; nessuna autorità ungherese ha individuato un responsabile."}}},{id:"EVEN7006",p:8,cat:0,seuil:"Attribué",passe:!1,date:"2026-11-20",entree:"2026-11-20",src:"https://www.reuters.com/business/aerospace-defense/polish-army-investigates-report-unknown-objects-near-ukraine-border-2026-11-20/",txt:{fr:{nom:"Deux missiles et un drone russes tombent en Pologne pendant une attaque contre l'Ukraine",pays:"Pologne",lieu:"Nowy Lipowiec, Rudnik nad Sanem et Mołodycz",desc:"Dans la nuit du 19 au 20 novembre 2026, pendant l'une des plus vastes attaques russes contre l'Ukraine depuis 2022, trois objets russes pénètrent dans l'espace aérien polonais. Selon le ministre de la Défense Władysław Kosiniak-Kamysz, il s'agit d'un missile de croisière Kh-101, d'un second missile et, « très probablement », d'un drone à réaction. Des débris sont retrouvés à Nowy Lipowiec (voïvodie de Lublin), où un objet d'environ 7 mètres tombe vers 6h40, ainsi qu'à Rudnik nad Sanem et à Mołodycz (voïvodie des Basses-Carpates). Personne n'est blessé. Des chasseurs polonais et alliés décollent et la tour de contrôle de l'aéroport de Rzeszów-Jasionka est brièvement évacuée. Le ministre dénonce « une incursion d'objets de la Fédération de Russie » et juge « difficile de considérer comme un hasard » que le moment et le lieu de l'incident coïncident avec les exercices de la Coalition des volontaires à Nowa Dęba. Le Premier ministre Donald Tusk affirme que les objets sont sans aucun doute russes : « Il semble que nous ayons affaire à une provocation intentionnelle. » Le secrétaire général de l'OTAN Mark Rutte qualifie l'incident de « clairement dangereux »."},es:{nom:"Dos misiles y un dron rusos caen en Polonia durante un ataque contra Ucrania",pays:"Polonia",lieu:"Nowy Lipowiec, Rudnik nad Sanem y Mołodycz",desc:"En la noche del 19 al 20 de noviembre de 2026, durante uno de los ataques rusos más extensos contra Ucrania desde 2022, tres objetos rusos penetran en el espacio aéreo polaco. Según el ministro de Defensa, Władysław Kosiniak-Kamysz, se trata de un misil de crucero Kh-101, de un segundo misil y, «muy probablemente», de un dron a reacción. Se hallan restos en Nowy Lipowiec (voivodato de Lublin), donde un objeto de unos 7 metros cae hacia las 6:40, así como en Rudnik nad Sanem y en Mołodycz (voivodato de los Bajos Cárpatos). No hay heridos. Despegan cazas polacos y aliados y se evacúa brevemente la torre de control del aeropuerto de Rzeszów-Jasionka. El ministro denuncia «una incursión de objetos de la Federación de Rusia» y considera «difícil de considerar una coincidencia» que el momento y el lugar del incidente coincidan con las maniobras de la Coalición de Voluntarios en Nowa Dęba. El primer ministro, Donald Tusk, afirma que los objetos son sin duda rusos: «Parece que nos enfrentamos a una provocación intencionada». El secretario general de la OTAN, Mark Rutte, califica el incidente de «claramente peligroso»."},it:{nom:"Due missili e un drone russi cadono in Polonia durante un attacco contro l’Ucraina",pays:"Polonia",lieu:"Nowy Lipowiec, Rudnik nad Sanem e Mołodycz",desc:"Nella notte tra il 19 e il 20 novembre 2026, durante uno dei più vasti attacchi russi contro l’Ucraina dal 2022, tre oggetti russi penetrano nello spazio aereo polacco. Secondo il ministro della Difesa Władysław Kosiniak-Kamysz, si tratta di un missile da crociera Kh-101, di un secondo missile e, «molto probabilmente», di un drone a reazione. Vengono rinvenuti detriti a Nowy Lipowiec (voivodato di Lublino), dove un oggetto di circa 7 metri cade verso le 6:40, nonché a Rudnik nad Sanem e a Mołodycz (voivodato dei Bassi Carpazi). Nessuno è rimasto ferito. Alcuni caccia polacchi e alleati sono decollati e la torre di controllo dell’aeroporto di Rzeszów-Jasionka è stata brevemente evacuata. Il ministro denuncia «un'incursione di oggetti provenienti dalla Federazione Russa» e ritiene «difficile considerare una coincidenza» che il momento e il luogo dell’incidente coincidano con le esercitazioni della Coalizione dei Volontari a Nowa Dęba. Il primo ministro Donald Tusk afferma che gli oggetti sono senza dubbio russi: «Sembra che si tratti di una provocazione intenzionale». Il segretario generale della NATO Mark Rutte definisce l’incidente «chiaramente pericoloso»."}}}],qe={debuts:Sa,fin:La,events:Ea},Ra={fr:["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"],es:["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"],it:["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"]},ka={fr:["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."],es:["ene.","feb.","mar.","abr.","may.","jun.","jul.","ago.","sep.","oct.","nov.","dic."],it:["gen.","feb.","mar.","apr.","mag.","giu.","lug.","ago.","set.","ott.","nov.","dic."]},Qe=(e,a)=>e==="fr"&&a===1?"1er":e==="it"&&a===1?"1º":String(a),Aa={fr:{page:"Actions hostiles contre l’Europe, sept jours après sept jours",titre:"Actions hostiles visant l’Europe, par semaine",chapo:"Par période de sept jours, du samedi au vendredi, selon leur date d’entrée dans la base de données de l’Observatoire de la guerre politique en Europe. Chaque hexagone est une action, classée selon son degré d’attribution à la Russie.",moyenne:e=>`Moyenne d’octobre : ${e} par semaine`,attr:(e,a)=>`${e} des ${a} actions sont attribuées à la Russie ou soupçonnées de l’être.`,seuils:{Confirmé:"Confirmé",Attribué:"Attribué",Suspecté:"Suspecté","Non déterminé":"Non déterminé"},passe:"Fait antérieur, révélé pendant la période",cats:["Aéronef","Frappes de navires","Sabotage","Incendie","Renseignement","Ingérence","Actions non classifiables"],periode:"Du 14 au 20 novembre",compte:(e,a)=>`${e} actions recensées, contre ${a} en moyenne en octobre`,total:"Total",aide:"Cliquez sur un hexagone pour lire le détail de l’événement.",aideTactile:"Touchez un hexagone pour lire le détail de l’événement.",faits:"Faits",recense:"Recensé le",lire:"Lire la source",fermer:"Fermer",preced:"Précédent",suivant:"Suivant",source:"Source : Groupe d’études géopolitiques (Observatoire de la guerre pol
