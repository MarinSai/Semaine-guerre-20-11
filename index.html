hosos de haber provocado el incendio; se inició un procedimiento de extradición contra ellos. El 3 de noviembre, la justicia alemana anunció la detención en Reutlingen de un tercer turco, sospechoso de haber ordenado el incendio desde Alemania; quedó en prisión preventiva. Las autoridades alemanas no señalaron a Rusia en esta ocasión."},it:{nom:"Un incendio doloso ai danni di una stazione utilizzata da Starlink",pays:"Polonia",lieu:"Wola Krobowska",desc:"Il 23 settembre è scoppiato un incendio in una stazione utilizzata da Starlink. Il 12 ottobre, il ministro coordinatore dei servizi speciali, Tomasz Siemoniak, ha dichiarato: «Non abbiamo alcun dubbio sul fatto che dietro questo atto di sabotaggio ci siano i servizi segreti russi»; Donald Tusk ha denunciato «un nuovo atto di guerra ibrida». Due cittadini turchi arrestati in Germania su richiesta della Polonia sono stati sospettati di aver appiccato l’incendio; nei loro confronti è stata avviata una procedura di estradizione. Il 3 novembre, la magistratura tedesca ha annunciato l’arresto a Reutlingen di un terzo turco, sospettato di aver ordinato l’incendio dalla Germania; è stato posto in custodia cautelare. In questa occasione le autorità tedesche non hanno indicato la Russia come responsabile."}}},{id:"EVEN011",p:0,cat:0,seuil:"Attribué",passe:!1,date:"2026-09-23",entree:"2026-09-23",src:"https://kyivindependent.com/russian-mi-8-helicopter-violates-polish-airspace-near-kaliningrad-poland-says/",txt:{fr:{nom:"Violation de l'espace aérien polonais par un hélicoptère russe",pays:"Pologne",lieu:"Braniewo",desc:"Un hélicoptère militaire russe de type Mi-8 a brièvement violé l'espace aérien polonais près de la frontière nord du pays le 23 septembre, selon le commandement opérationnel des forces armées polonaises. Des chasseurs ont décollé et les forces terrestres ont été placées en alerte."},es:{nom:"Violación del espacio aéreo polaco por un helicóptero ruso",pays:"Polonia",lieu:"Braniewo",desc:"Un helicóptero militar ruso del tipo Mi-8 violó brevemente el espacio aéreo polaco cerca de la frontera norte del país el 23 de septiembre, según el mando operativo de las Fuerzas Armadas polacas. Despegaron cazas y se puso en alerta a las fuerzas terrestres."},it:{nom:"Violazione dello spazio aereo polacco da parte di un elicottero russo",pays:"Polonia",lieu:"Braniewo",desc:"Secondo il comando operativo delle forze armate polacche, il 23 settembre un elicottero militare russo del tipo Mi-8 ha violato brevemente lo spazio aereo polacco nei pressi del confine settentrionale del Paese. Sono decollati dei caccia e le forze di terra sono state messe in stato di allerta."}}},{id:"EVEN021",p:0,cat:0,seuil:"Non déterminé",passe:!1,date:"2026-09-23",entree:"2026-09-23",src:"https://www.dw.com/en/berlin-airport-drone-sighting-closed-suspended/a-79403865",txt:{fr:{nom:"L'aéroport de Berlin suspend temporairement les vols après l'observation d'un drone",pays:"Allemagne",lieu:"Berlin",desc:"Un drone a été repéré sur la piste nord de l'aéroport de Berlin-Brandebourg à 20h (18h GMT). L'espace aérien au-dessus de l'aéroport a été fermé quelques minutes plus tard et les opérations ont été suspendues pendant au moins 45 minutes. Plusieurs vols ont été déroutés vers Dresde."},es:{nom:"El aeropuerto de Berlín suspende temporalmente los vuelos tras avistarse un dron",pays:"Alemania",lieu:"Berlín",desc:"Se avistó un dron en la pista norte del aeropuerto de Berlín-Brandeburgo a las 20:00 (18:00 GMT). El espacio aéreo sobre el aeropuerto se cerró unos minutos más tarde y las operaciones se suspendieron durante al menos 45 minutos. Varios vuelos fueron desviados a Dresde."},it:{nom:"L'aeroporto di Berlino sospende temporaneamente i voli dopo l'avvistamento di un drone",pays:"Germania",lieu:"Berlino",desc:"Un drone è stato avvistato sulla pista nord dell’aeroporto di Berlino-Brandeburgo alle 20:00 (18:00 GMT). Lo spazio aereo sopra l’aeroporto è stato chiuso pochi minuti dopo e le operazioni sono state sospese per almeno 45 minuti. Diversi voli sono stati dirottati verso Dresda."}}},{id:"EVEN033",p:0,cat:0,seuil:"Suspecté",passe:!1,date:"2026-09-24",entree:"2026-09-24",src:"https://kyivindependent.com/suspected-russian-drones-crash-in-romania-moldova/",txt:{fr:{nom:"Un drone a violé l'espace aérien roumain puis s'est écrasé",pays:"Roumanie",lieu:"Solca",desc:"Un drone a violé l'espace aérien roumain pendant environ quatre minutes avant de s'écraser près de Solca, dans le comté de Suceava. La Roumanie n'a pas directement accusé la Russie, mais le ministre roumain de la Défense par intérim, Radu Miruță, a déclaré qu'il était nécessaire d'adresser une protestation à Moscou au sujet de cet incident."},es:{nom:"Un dron violó el espacio aéreo rumano y posteriormente se estrelló",pays:"Rumanía",lieu:"Solca",desc:"Un dron violó el espacio aéreo rumano durante unos cuatro minutos antes de estrellarse cerca de Solca, en el condado de Suceava. Rumanía no ha acusado directamente a Rusia, pero el ministro de Defensa en funciones, Radu Miruță, ha declarado que era necesario presentar una protesta a Moscú por este incidente."},it:{nom:"Un drone ha violato lo spazio aereo rumeno e poi si è schiantato",pays:"Romania",lieu:"Solca",desc:"Un drone ha violato lo spazio aereo rumeno per circa quattro minuti prima di schiantarsi nei pressi di Solca, nella contea di Suceava. La Romania non ha accusato direttamente la Russia, ma il ministro della Difesa rumeno ad interim, Radu Miruță, ha dichiarato che era necessario presentare una protesta a Mosca in merito a questo incidente."}}},{id:"EVEN034",p:0,cat:0,seuil:"Attribué",passe:!1,date:"2026-09-24",entree:"2026-09-24",src:"https://www.forbes.ro/?p=522569",txt:{fr:{nom:"Quatre drones violent l'espace aérien moldave le 24 septembre",pays:"Moldavie",lieu:"Raion de Florești ; Camenca ; raion de Briceni",desc:"Le 24 septembre, le ministère moldave de la Défense signale quatre violations de l'espace aérien par des drones, entre 5h21 et 6h58, pendant une attaque russe massive contre l'Ukraine ; l'espace aérien du nord du pays est temporairement fermé. La présidente Maia Sandu déclare que quatre drones russes ont violé l'espace aérien moldave et qu'« au moins un a explosé dans le nord ». Selon la police, un drone présentant « des caractéristiques spécifiques du modèle Gerbera utilisé par la Fédération de Russie » est retrouvé près de Cernița, dans le raion de Florești ; la police signale aussi une explosion possible à Camenca, sur la rive gauche du Dniestr. Le soir, une patrouille de la police aux frontières découvre dans le raion de Briceni, à environ 1,7 km de la frontière, les fragments d'un drone qui a explosé à une dizaine de mètres du sol après avoir heurté des arbres ; certaines pièces portent l'inscription « Geran-4 ». Les fragments sont envoyés en expertise ; aucun autre objet explosif n'est trouvé."},es:{nom:"Cuatro drones violan el espacio aéreo moldavo el 24 de septiembre",pays:"Moldavia",lieu:"Distrito de Florești; Camenca; distrito de Briceni",desc:"El 24 de septiembre, el Ministerio de Defensa de Moldavia informó de cuatro violaciones del espacio aéreo por parte de drones, entre las 5:21 y las 6:58, durante un ataque masivo de Rusia contra Ucrania; el espacio aéreo del norte del país quedó cerrado temporalmente. La presidenta Maia Sandu declara que cuatro drones rusos han violado el espacio aéreo moldavo y que «al menos uno ha explotado en el norte». Según la policía, se encuentra cerca de Cernița, en el raion de Florești, un dron que presenta «características específicas del modelo Gerbera utilizado por la Federación de Rusia»; la policía también informa de una posible explosión en Camenca, en la margen izquierda del Dniéster. Por la noche, una patrulla de la policía de fronteras descubre en el raion de Briceni, a unos 1,7 km de la frontera, los fragmentos de un dron que explotó a unos diez metros del suelo tras chocar contra unos árboles; algunas piezas llevan la inscripción «Geran-4». Los fragmentos se envían para su análisis; no se encuentra ningún otro objeto explosivo."},it:{nom:"Il 24 settembre quattro droni violano lo spazio aereo moldavo",pays:"Moldavia",lieu:"Distretto di Florești; Camenca; distretto di Briceni",desc:"Il 24 settembre, il Ministero della Difesa moldavo segnala quattro violazioni dello spazio aereo da parte di droni, tra le 5:21 e le 6:58, durante un massiccio attacco russo contro l’Ucraina; lo spazio aereo nel nord del Paese viene temporaneamente chiuso. La presidente Maia Sandu dichiara che quattro droni russi hanno violato lo spazio aereo moldavo e che «almeno uno è esploso nel nord». Secondo la polizia, un drone che presenta «caratteristiche specifiche del modello Gerbera utilizzato dalla Federazione Russa» viene ritrovato nei pressi di Cernița, nel raion di Florești; la polizia segnala inoltre una possibile esplosione a Camenca, sulla riva sinistra del Dniestr. In serata, una pattuglia della polizia di frontiera scopre nel raion di Briceni, a circa 1,7 km dal confine, i frammenti di un drone esploso a una decina di metri dal suolo dopo aver urtato degli alberi; alcuni pezzi recano la scritta «Geran-4». I frammenti vengono inviati per la perizia; non viene rinvenuto nessun altro oggetto esplosivo."}}},{id:"EVEN055",p:0,cat:0,seuil:"Non déterminé",passe:!1,date:"2026-09-24",entree:"2026-09-24",src:"https://www.reuters.com/business/aerospace-defense/swedish-finnish-fighter-jets-intercept-russian-military-aircraft-2026-09-25/",txt:{fr:{nom:"La Finlande et la Suède interceptent des appareils militaires russes au-dessus du golfe de Finlande",pays:"Finlande / Suède",lieu:"Golfe de Finlande",desc:"La Finlande et la Suède ont annoncé avoir dépêché des avions de chasse pour intercepter et identifier des appareils militaires russes dans l'espace aérien international au-dessus du golfe de Finlande, dans le cadre de la première opération conjointe de ce type."},es:{nom:"Finlandia y Suecia interceptan aviones militares rusos sobre el golfo de Finlandia",pays:"Finlandia / Suecia",lieu:"Golfo de Finlandia",desc:"Finlandia y Suecia han anunciado que han enviado aviones de combate para interceptar e identificar aeronaves militares rusas en el espacio aéreo internacional sobre el golfo de Finlandia, en el marco de la primera operación conjunta de este tipo."},it:{nom:"La Finlandia e la Svezia intercettano velivoli militari russi sopra il Golfo di Finlandia",pays:"Finlandia / Svezia",lieu:"Golfo di Finlandia",desc:"La Finlandia e la Svezia hanno annunciato di aver inviato aerei da caccia per intercettare e identificare velivoli militari russi nello spazio aereo internazionale sopra il Golfo di Finlandia, nell’ambito della prima operazione congiunta di questo tipo."}}},{id:"EVEN095",p:0,cat:3,seuil:"Suspecté",passe:!0,date:"2026-09-03",entree:"2026-09-25",src:"https://www.faz.net/aktuell/politik/inland/geheimdienst-gru-ermittler-sehen-moskau-auch-hinter-dem-brandanschlag-in-muenchen-accg-201261687.html#?cleverPushBounceUrl=https%3A%2F%2Fwww.faz.net%2Faktuell%2F&cleverPushNotificationId=rHekrjkfZCnfrcKo5",txt:{fr:{nom:"Des engins incendiaires jetés près des sièges des sociétés de défense Rohde & Schwarz et Helsing",pays:"Allemagne",lieu:"Munich",desc:"Le 3 septembre, des engins incendiaires ont été lancés depuis une voiture en mouvement sur un chantier situé juste à côté des sièges de Rohde & Schwarz et de Helsing. Un homme et une femme de nationalité bulgare ont été arrêtés. Le 25 septembre, la Frankfurter Allgemeine Zeitung a cité des sources sécuritaires selon lesquelles l'attentat pourrait être l'œuvre du renseignement militaire russe (GRU)."},es:{nom:"Se lanzaron artefactos incendiarios cerca de las sedes de las empresas de defensa Rohde & Schwarz y Helsing.",pays:"Alemania",lieu:"Múnich",desc:"El 3 de septiembre, se lanzaron artefactos incendiarios desde un coche en marcha contra una obra situada justo al lado de las sedes de Rohde & Schwarz y Helsing. Se detuvo a un hombre y una mujer de nacionalidad búlgara. El 25 de septiembre, el Frankfurter Allgemeine Zeitung citó fuentes de seguridad según las cuales el atentado podría ser obra de los servicios de inteligencia militar rusos (GRU)."},it:{nom:"Ordigni incendiari lanciati nei pressi delle sedi delle società di difesa Rohde & Schwarz e Helsing",pays:"Germania",lieu:"Monaco di Baviera",desc:"Il 3 settembre, alcuni ordigni incendiari sono stati lanciati da un’auto in corsa contro un cantiere situato proprio accanto alle sedi di Rohde & Schwarz e Helsing. Sono stati arrestati un uomo e una donna di nazionalità bulgara. Il 25 settembre, la Frankfurter Allgemeine Zeitung ha citato fonti dei servizi di sicurezza secondo cui l’attentato potrebbe essere opera dei servizi segreti militari russi (GRU)."}}},{id:"EVEN048",p:0,cat:2,seuil:"Attribué",passe:!0,date:"2026-09-04",entree:"2026-09-25",src:"https://www.reuters.com/world/uk/man-appears-london-court-accused-providing-russian-intelligence-with-drone-2026-09-25/",txt:{fr:{nom:"Un Britannique inculpé pour avoir renseigné le GRU sur des usines de drones",pays:"Royaume-Uni",lieu:"Swindon",desc:"Joshua Cammidge, 31 ans, a été accusé d'avoir transmis à un contact du GRU Volunteer Corps (groupe que l'accusation a décrit comme contrôlé par le renseignement militaire russe) la localisation de quatre sites de fabrication de drones à Swindon, et de s'être porté volontaire pour les saboter. Il a nié les faits ; lors de sa comparution du 25 septembre devant l'Old Bailey, la date de son procès a été fixée au 19 avril 2027 ; le procès doit se tenir à la Winchester Crown Court."},es:{nom:"Un británico acusado de haber facilitado información al GRU sobre fábricas de drones",pays:"Reino Unido",lieu:"Swindon",desc:"Joshua Cammidge, de 31 años, ha sido acusado de haber facilitado a un contacto del GRU Volunteer Corps (grupo que la acusación ha descrito como controlado por los servicios de inteligencia militares rusos) la ubicación de cuatro plantas de fabricación de drones en Swindon, y de haberse ofrecido voluntario para sabotearlas. Ha negado los hechos; durante su comparecencia del 25 de septiembre ante el Old Bailey, se fijó la fecha de su juicio para el 19 de abril de 2027; el juicio se celebrará en el Tribunal de la Corona de Winchester."},it:{nom:"Un cittadino britannico incriminato per aver fornito informazioni al GRU su fabbriche di droni",pays:"Regno Unito",lieu:"Swindon",desc:"Joshua Cammidge, 31 anni, è stato accusato di aver trasmesso a un contatto del GRU Volunteer Corps (gruppo che l’accusa ha descritto come controllato dai servizi segreti militari russi) la posizione di quattro siti di produzione di droni a Swindon e di essersi offerto volontario per sabotarli. Egli ha negato i fatti; durante la sua comparizione del 25 settembre davanti all’Old Bailey, la data del processo è stata fissata al 19 aprile 2027; il processo si terrà presso la Winchester Crown Court."}}},{id:"EVEN189",p:1,cat:0,seuil:"Non déterminé",passe:!1,date:"2026-09-28",entree:"2026-09-28",src:"https://www.kyivpost.com/post/85600",txt:{fr:{nom:"Un drone frappe près de Yahodyn, en Ukraine, et la Pologne suspend les contrôles à Dorohusk",pays:"Pologne",lieu:"Dorohusk",desc:"Un drone a frappé lundi 28 septembre à proximité du poste-frontière de Yahodyn, en face de Dorohusk, à environ deux kilomètres de la frontière polonaise. Les contrôles ont été suspendus à Dorohusk, puis le poste a été évacué. Selon le ministre de la Défense Władysław Kosiniak-Kamysz, le drone a touché le côté ukrainien du poste, l'espace aérien polonais n'a pas été violé et les avions et la défense aérienne étaient prêts à intervenir."},es:{nom:"Un dron impacta cerca de Yahodyn, en Ucrania, y Polonia suspende los controles en Dorohusk",pays:"Polonia",lieu:"Dorohusk",desc:"El lunes 28 de septiembre, un dron atacó cerca del puesto fronterizo de Yahodyn, frente a Dorohusk, a unos dos kilómetros de la frontera polaca. Se suspendieron los controles en Dorohusk y, posteriormente, se evacuó el puesto. Según el ministro de Defensa, Władysław Kosiniak-Kamysz, el dron impactó en el lado ucraniano del puesto fronterizo, no se violó el espacio aéreo polaco y los aviones y la defensa aérea estaban preparados para intervenir."},it:{nom:"Un drone colpisce nei pressi di Yahodyn, in Ucraina, e la Polonia sospende i controlli a Dorohusk",pays:"Polonia",lieu:"Dorohusk",desc:"Lunedì 28 settembre un drone ha colpito nelle vicinanze del posto di frontiera di Yahodyn, di fronte a Dorohusk, a circa due chilometri dal confine polacco. I controlli sono stati sospesi a Dorohusk, dopodiché il posto di frontiera è stato evacuato. Secondo il ministro della Difesa Władysław Kosiniak-Kamysz, il drone ha colpito il lato ucraino del valico; lo spazio aereo polacco non è stato violato e gli aerei e la difesa aerea erano pronti a intervenire."}}},{id:"EVEN216",p:1,cat:2,seuil:"Non déterminé",passe:!0,date:"2025-07-13",entree:"2026-09-29",src:"https://notesfrompoland.com/2026/09/29/belarusian-convicted-for-preparing-arson-in-poland-on-behalf-of-foreign-intelligence/",txt:{fr:{nom:"Un ressortissant biélorusse condamné pour avoir préparé un incendie criminel à Chełm",pays:"Pologne",lieu:"Chełm",desc:"Un citoyen biélorusse de 28 ans, identifié comme Vitali S., a été condamné à trois ans et six mois de prison par le tribunal régional de Lublin pour avoir préparé un acte de sabotage pour le compte d'un service de renseignement étranger. Recruté via Telegram, il avait été chargé en juillet 2025 de filmer un entrepôt à Chełm en vue d'un incendie criminel, transmettant les images à un contact non identifié contre un paiement en cryptomonnaie d'environ 1 475 zlotys. Il a été arrêté le 13 août 2025 par l'agence de sécurité intérieure polonaise (ABW). Les autorités n'ont pas précisé pour quel pays il agissait."},es:{nom:"Un ciudadano bielorruso condenado por preparar un incendio provocado en Chełm",pays:"Polonia",lieu:"Chełm",desc:"Un ciudadano bielorruso de 28 años, identificado como Vitali S., ha sido condenado a tres años y seis meses de prisión por el tribunal regional de Lublin por preparar un acto de sabotaje por cuenta de un servicio de inteligencia extranjero. Reclutado a través de Telegram, en julio de 2025 se le encargó grabar un almacén en Chełm con vistas a un incendio provocado, y transmitir las imágenes a un contacto no identificado a cambio de un pago en criptomoneda de unos 1 475 zlotys. Fue detenido el 13 de agosto de 2025 por la Agencia de Seguridad Interna de Polonia (ABW). Las autoridades no han precisado para qué país actuaba."},it:{nom:"Cittadino bielorusso condannato per aver pianificato un incendio doloso a Chełm",pays:"Polonia",lieu:"Chełm",desc:"Un cittadino bielorusso di 28 anni, identificato come Vitali S., è stato condannato a tre anni e sei mesi di reclusione dal tribunale regionale di Lublino per aver preparato un atto di sabotaggio per conto di un servizio di intelligence straniero. Reclutato tramite Telegram, nel luglio 2025 gli era stato affidato il compito di filmare un magazzino a Chełm in vista di un incendio doloso, trasmettendo le immagini a un contatto non identificato in cambio di un pagamento in criptovaluta pari a circa 1.475 zloty. È stato arrestato il 13 agosto 2025 dall’Agenzia per la sicurezza interna polacca (ABW). Le autorità non hanno specificato per quale paese agisse."}}},{id:"EVEN212",p:1,cat:3,seuil:"Attribué",passe:!0,date:"2026-08-15",entree:"2026-09-29",src:"https://www.bloomberg.com/news/articles/2026-09-29/estonia-says-russia-behind-arson-attack-on-defense-firm",txt:{fr:{nom:"Un incendie vise l'entreprise de défense Milrem Robotics",pays:"Estonie",lieu:"Tallinn",desc:"Un incendie a visé en août les locaux de Milrem Robotics, une entreprise estonienne de technologies de défense qui fournit des véhicules terrestres sans équipage aux forces ukrainiennes. Le 29 septembre, l'Estonie a formellement attribué la responsabilité de cet acte de sabotage à la Russie, le ministre des Affaires étrangères Margus Tsahkna affirmant « avec certitude » qu'il s'agissait d'un acte de sabotage « ordonné par les services spéciaux de la Fédération de Russie » ; le ministère a annoncé qu'il convoquerait l'émissaire russe le jour même. Trois suspects, détenus en Lettonie quelques jours après les faits, ont été remis à l'Estonie les 17 et 18 septembre."},es:{nom:"Un incendio atenta contra la empresa de defensa Milrem Robotics",pays:"Estonia",lieu:"Tallin",desc:"En agosto se produjo un incendio en las instalaciones de Milrem Robotics, una empresa estonia de tecnología de defensa que suministra vehículos terrestres no tripulados a las fuerzas ucranianas. El 29 de septiembre, Estonia atribuyó formalmente la responsabilidad de este acto de sabotaje a Rusia, y el ministro de Asuntos Exteriores, Margus Tsahkna, afirmó «con certeza» que se trataba de un acto de sabotaje «ordenado por los servicios especiales de la Federación de Rusia»; el Ministerio anunció que convocaría al embajador ruso ese mismo día. Tres sospechosos, detenidos en Letonia unos días después de los hechos, fueron entregados a Estonia los días 17 y 18 de septiembre."},it:{nom:"Un incendio colpisce l’azienda del settore della difesa Milrem Robotics",pays:"Estonia",lieu:"Tallinn",desc:"Nel mese di agosto un incendio ha colpito la sede di Milrem Robotics, un’azienda estone specializzata in tecnologie per la difesa che fornisce veicoli terrestri senza equipaggio alle forze ucraine. Il 29 settembre, l’Estonia ha formalmente attribuito la responsabilità di questo atto di sabotaggio alla Russia; il ministro degli Affari esteri Margus Tsahkna ha affermato «con certezza» che si trattava di un atto di sabotaggio «ordinato dai servizi segreti della Federazione Russa»; il ministero ha annunciato che avrebbe convocato l’inviato russo lo stesso giorno. Tre sospetti, arrestati in Lettonia pochi giorni dopo i fatti, sono stati consegnati all’Estonia il 17 e il 18 settembre."}}},{id:"EVEN233",p:1,cat:3,seuil:"Non déterminé",passe:!1,date:"2026-09-24",entree:"2026-09-29",src:"https://www.volksstimme.de/lokal/wolmirstedt/brand-barleben-bundeswehr-lkw-4325973",txt:{fr:{nom:"Trois véhicules des forces armées allemandes ont été incendiés à Barleben",pays:"Allemagne",lieu:"Barleben",desc:"Trois camions appartenant aux forces armées allemandes ont été incendiés à Barleben, dans le Land de Saxe-Anhalt, sur un site de l'entreprise MAN. La police a ouvert une enquête pour suspicion d'incendie criminel."},es:{nom:"Tres vehículos de las Fuerzas Armadas alemanas fueron incendiados en Barleben",pays:"Alemania",lieu:"Barleben",desc:"Tres camiones pertenecientes a las Fuerzas Armadas alemanas fueron incendiados en Barleben, en el estado federado de Sajonia-Anhalt, en unas instalaciones de la empresa MAN. La policía ha abierto una investigación por sospecha de incendio provocado."},it:{nom:"Tre veicoli delle forze armate tedesche sono stati incendiati a Barleben",pays:"Germania",lieu:"Barleben",desc:"Tre autocarri appartenenti alle forze armate tedesche sono stati incendiati a Barleben, nel Land della Sassonia-Anhalt, presso uno stabilimento dell’azienda MAN. La polizia ha avviato un’indagine per sospetto incendio doloso."}}},{id:"EVEN296",p:1,cat:0,seuil:"Non déterminé",passe:!1,date:"2026-09-29",entree:"2026-09-29",src:"https://www.digi24.ro/stiri/fragmente-de-drona-cazute-pe-un-camp-din-insula-mare-a-brailei-un-localnic-a-sunat-la-112-precizarile-mapn-3968915",txt:{fr:{nom:"Des fragments de drone ont été retrouvés sur l'île de Brăila",pays:"Roumanie",lieu:"Brăila",desc:"Un drone comportant une charge explosive s'est écrasé dans un champ sur l'île de Brăila, située à quelques dizaines de kilomètres de la frontière avec l'Ukraine. L'origine de l'engin n'a pas été déterminée."},es:{nom:"Se han hallado fragmentos de un dron en la isla de Brăila",pays:"Rumanía",lieu:"Brăila",desc:"Un dron que transportaba una carga explosiva se estrelló en un campo de la isla de Brăila, situada a unas decenas de kilómetros de la frontera con Ucrania. No se ha determinado el origen del aparato."},it:{nom:"Frammenti di un drone sono stati rinvenuti sull’isola di Brăila",pays:"Romania",lieu:"Brăila",desc:"Un drone munito di un carico esplosivo si è schiantato in un campo sull’isola di Brăila, situata a poche decine di chilometri dal confine con l’Ucraina. L’origine del velivolo non è stata determinata."}}},{id:"EVEN353",p:1,cat:2,seuil:"Non déterminé",passe:!0,date:"2025-10-01",entree:"2026-09-30",src:"https://www.expressen.se/nyheter/sverige/trio-misstanks-for-sabotage-i-jarfalla/",txt:{fr:{nom:"Trois hommes soupçonnés d'avoir saboté un mât de télécommunications à Järfälla",pays:"Suède",lieu:"Järfälla",desc:"Trois hommes ont été soupçonnés d'un sabotage de grande ampleur visant un mât de télécommunications à Järfälla en octobre 2025. Le mât a perdu son alimentation électrique, ce qui a rendu inopérants tous les opérateurs qui y étaient rattachés et dégradé la couverture mobile dans la zone. Le trio a également été soupçonné d'une tentative de sabotage à Sundbyberg fin 2025. Les trois hommes, placés en détention, ont été libérés le 29 septembre 2026 ; ils sont restés soupçonnés et ont nié les faits. Aucun lien avec la Russie n'a été rapporté pour ce dossier. La date exacte des faits n'a pas été précisée."},es:{nom:"Tres hombres sospechosos de haber saboteado un mástil de telecomunicaciones en Järfälla",pays:"Suecia",lieu:"Järfälla",desc:"Tres hombres fueron sospechosos de un sabotaje a gran escala dirigido contra una torre de telecomunicaciones en Järfälla en octubre de 2025. La torre quedó sin suministro eléctrico, lo que dejó inoperativos a todos los operadores conectados a ella y deterioró la cobertura móvil en la zona. El trío también fue sospechoso de un intento de sabotaje en Sundbyberg a finales de 2025. Los tres hombres, que fueron puestos bajo custodia, quedaron en libertad el 29 de septiembre de 2026; siguieron siendo sospechosos y negaron los hechos. No se ha informado de ningún vínculo con Rusia en relación con este caso. No se ha precisado la fecha exacta de los hechos."},it:{nom:"Tre uomini sospettati di aver sabotato un palo delle telecomunicazioni a Järfälla",pays:"Svezia",lieu:"Järfälla",desc:"Tre uomini sono stati sospettati di un sabotaggio su larga scala ai danni di un traliccio di telecomunicazioni a Järfälla nell’ottobre 2025. Il traliccio ha perso l’alimentazione elettrica, rendendo inoperativi tutti gli operatori ad esso collegati e compromettendo la copertura di rete mobile nella zona. Il trio è stato inoltre sospettato di un tentativo di sabotaggio a Sundbyberg alla fine del 2025. I tre uomini, posti in stato di detenzione, sono stati rilasciati il 29 settembre 2026; sono rimasti indagati e hanno negato i fatti. Non è stato segnalato alcun collegamento con la Russia in relazione a questo caso. La data esatta dei fatti non è stata precisata."}}},{id:"EVEN324",p:1,cat:0,seuil:"Suspecté",passe:!1,date:"2026-09-30",entree:"2026-09-30",src:"https://www.digi24.ro/stiri/drona-detectata-in-apropierea-granitei-cu-romania-doua-aeronave-f-18-ridicate-mesaj-ro-alert-pentru-nordul-judetului-tulcea-3970455",txt:{fr:{nom:"Un drone détecté à la frontière avec l'Ukraine a provoqué le lancement d'une alerte",pays:"Roumanie",lieu:"Tulcea",desc:"Un drone détecté du côté ukrainien de la frontière avec la Roumanie a provoqué le déclenchement d'une alerte et conduit au décollage de deux avions F-18 des Forces aérospatiales espagnoles."},es:{nom:"Se ha detectado un dron en la frontera con Ucrania, lo que ha provocado la activación de una alerta",pays:"Rumanía",lieu:"Tulcea",desc:"La detección de un dron en el lado ucraniano de la frontera con Rumanía provocó la activación de una alerta y dio lugar al despegue de dos aviones F-18 de las Fuerzas Aeroespaciales Españolas."},it:{nom:"Un drone individuato al confine con l’Ucraina ha provocato l’attivazione di un allarme",pays:"Romania",lieu:"Tulcea",desc:"Un drone individuato sul lato ucraino del confine con la Romania ha fatto scattare un allarme e ha portato al decollo di due aerei F-18 delle Forze aerospaziali spagnole."}}},{id:"EVEN327",p:1,cat:0,seuil:"Suspecté",passe:!1,date:"2026-09-30",entree:"2026-09-30",src:"https://www.mediafax.ro/externe/alerta-in-republica-moldova-o-drona-a-survolat-un-oras-si-a-explodat-dupa-ce-s-a-prabusit-23816711",txt:{fr:{nom:"Un drone repéré lors d'une campagne russe contre l'Ukraine a explosé près d'Hîrbovăț",pays:"Moldavie",lieu:"Hîrbovăț",desc:"Un drone repéré lors d'une des campagnes russes contre l'Ukraine a été détecté par le système de surveillance moldave, puis s'est écrasé près du village d'Hîrbovăț, dans l'est de la Moldavie."},es:{nom:"Un dron avistado durante una campaña rusa contra Ucrania ha explotado cerca de Hîrbovăț",pays:"Moldavia",lieu:"Hîrbovăț",desc:"Un dron avistado durante una de las campañas rusas contra Ucrania fue detectado por el sistema de vigilancia moldavo y, posteriormente, se estrelló cerca del pueblo de Hîrbovăț, en el este de Moldavia."},it:{nom:"Un drone avvistato durante una campagna russa contro l’Ucraina è esploso nei pressi di Hîrbovăț",pays:"Moldavia",lieu:"Hîrbovăț",desc:"Un drone avvistato durante una delle campagne russe contro l’Ucraina è stato individuato dal sistema di sorveglianza moldavo, per poi schiantarsi nei pressi del villaggio di Hîrbovăț, nella Moldavia orientale."}}},{id:"EVEN336",p:1,cat:0,seuil:"Attribué",passe:!1,date:"2026-09-30",entree:"2026-09-30",src:"https://www.jurnal.md/ro/news/9a78fefdea2a283f/o-noua-drona-a-zburat-pe-deasupra-orasului-dubasari-spatiul-aerian-din-nordul-si-centrul-republicii-moldova-inchis.html",txt:{fr:{nom:"La détection d'un drone au-dessus de Dubăsari a conduit à la fermeture de l'espace aérien",pays:"Moldavie",lieu:"Dubăsari",desc:"Un drone détecté dans l'espace aérien de la République de Moldavie, dans la région de Lunga, à Dubăsari, a conduit les autorités à ordonner la fermeture de l'espace aérien dans le nord et le centre du pays."},es:{nom:"La detección de un dron sobre Dubăsari provocó el cierre del espacio aéreo",pays:"Moldavia",lieu:"Dubăsari",desc:"La detección de un dron en el espacio aéreo de la República de Moldavia, en la región de Lunga, en Dubăsari, ha llevado a las autoridades a ordenar el cierre del espacio aéreo en el norte y el centro del país."},it:{nom:"L'individuazione di un drone sopra Dubăsari ha portato alla chiusura dello spazio aereo",pays:"Moldavia",lieu:"Dubăsari",desc:"Un drone individuato nello spazio aereo della Repubblica di Moldavia, nella regione di Lunga, a Dubăsari, ha indotto le autorità a ordinare la chiusura dello spazio aereo nel nord e nel centro del Paese."}}},{id:"EVEN342",p:1,cat:0,seuil:"Attribué",passe:!1,date:"2026-09-30",entree:"2026-09-30",src:"https://x.com/DowOperSZ/status/2105147491779846455",txt:{fr:{nom:"Les frappes russes contre l'Ukraine ont conduit la Pologne à déployer son aviation militaire",pays:"Pologne",lieu:"Est du pays",desc:"Le 30 septembre, les forces armées polonaises ont engagé leur aviation militaire dans l'espace aérien du pays en raison de frappes russes contre l'Ukraine, à titre préventif, puis ont annoncé la fin des opérations. Aucune violation de l'espace aérien polonais n'a été observée. Les aéroports de Rzeszów et de Lublin ont temporairement suspendu leurs vols."},es:{nom:"Los ataques rusos contra Ucrania han llevado a Polonia a desplegar su aviación militar",pays:"Polonia",lieu:"Este del país",desc:"El 30 de septiembre, las Fuerzas Armadas polacas desplegaron su aviación militar en el espacio aéreo del país como medida preventiva ante los ataques rusos contra Ucrania, y posteriormente anunciaron el fin de las operaciones. No se observó ninguna violación del espacio aéreo polaco. Los aeropuertos de Rzeszów y Lublin suspendieron temporalmente sus vuelos."},it:{nom:"Gli attacchi russi contro l’Ucraina hanno indotto la Polonia a dispiegare la propria aviazione militare",pays:"Polonia",lieu:"Parte orientale del Paese",desc:"Il 30 settembre, le forze armate polacche hanno dispiegato la propria aviazione militare nello spazio aereo nazionale a titolo preventivo, in risposta agli attacchi russi contro l’Ucraina, per poi annunciare la fine delle operazioni. Non è stata rilevata alcuna violazione dello spazio aereo polacco. Gli aeroporti di Rzeszów e Lublin hanno temporaneamente sospeso i voli."}}},{id:"EVEN470",p:1,cat:4,seuil:"Attribué",passe:!0,date:"2026-06-28",entree:"2026-10-01",src:"https://eng.lsm.lv/article/society/crime/01.10.2026-couple-in-latvia-suspected-of-spying-for-russia.a665602/",txt:{fr:{nom:"Un couple letton arrêté pour espionnage au profit du GRU",pays:"Lettonie",lieu:"Site non identifié",desc:"Un couple de citoyens lettons a été détenu en juin pour avoir transmis au GRU des informations classifiées sur une base aérienne, des radars et des mouvements d'avions militaires, selon le service de sécurité d'État (VDD). Ils auraient aussi soutenu des activités de sabotage potentielles sur le territoire letton."},es:{nom:"Detienen a una pareja letona por espionaje a favor del GRU",pays:"Letonia",lieu:"Sitio web no identificado",desc:"Una pareja de ciudadanos letones fue detenida en junio por haber transmitido al GRU información clasificada sobre una base aérea, radares y movimientos de aviones militares, según el Servicio de Seguridad del Estado (VDD). Al parecer, también habrían apoyado posibles actividades de sabotaje en territorio letón."},it:{nom:"Coppia lettone arrestata per spionaggio a favore del GRU",pays:"Lettonia",lieu:"Sito non identificato",desc:"Una coppia di cittadini lettoni è stata arrestata a giugno per aver trasmesso al GRU informazioni riservate su una base aerea, sui radar e sui movimenti di aerei militari, secondo quanto riferito dal servizio di sicurezza dello Stato (VDD). Avrebbero inoltre sostenuto potenziali attività di sabotaggio sul territorio lettone."}}},{id:"EVEN458",p:1,cat:0,seuil:"Attribué",passe:!1,date:"2026-10-01",entree:"2026-10-01",src:"https://www.digi24.ro/stiri/externe/moldova/o-drona-rusa-de-ultima-generatie-a-explodat-la-doar-cateva-zeci-de-km-de-chisinau-si-a-creat-cratere-de-jumatate-de-metru-3972533",txt:{fr:{nom:"Un drone russe s'est écrasé à moins de 50 kilomètres de Chișinău",pays:"Moldavie",lieu:"Ivancea",desc:"Un drone russe possédant des éléments spécifiques à un engin de type Geran a explosé après s'être écrasé près de la route Ivancea-Brănești, dans le district d'Orhei, à moins de 50 kilomètres de Chișinău. Le président du Parlement Igor Grosu a déclaré : « Nous ne pouvons et ne devons pas normaliser de tels incidents, surtout lorsqu'ils se produisent de plus en plus près de nos localités et de nos populations »."},es:{nom:"Un dron ruso se ha estrellado a menos de 50 kilómetros de Chișinău",pays:"Moldavia",lieu:"Ivancea",desc:"Un dron ruso que presentaba características específicas de un aparato del tipo Geran explotó tras estrellarse cerca de la carretera Ivancea-Brănești, en el distrito de Orhei, a menos de 50 kilómetros de Chișinău. El presidente del Parlamento, Igor Grosu, ha declarado: «No podemos ni debemos normalizar este tipo de incidentes, sobre todo cuando se producen cada vez más cerca de nuestras localidades y de nuestra población»."},it:{nom:"Un drone russo si è schiantato a meno di 50 chilometri da Chișinău",pays:"Moldavia",lieu:"Ivancea",desc:"Un drone russo, dotato di caratteristiche specifiche tipiche di un velivolo del tipo Geran, è esploso dopo essersi schiantato nei pressi della strada Ivancea-Brănești, nel distretto di Orhei, a meno di 50 chilometri da Chișinău. Il presidente del Parlamento Igor Grosu ha dichiarato: «Non possiamo e non dobbiamo normalizzare tali incidenti, soprattutto quando si verificano sempre più vicino alle nostre località e alle nostre popolazioni»."}}},{id:"EVEN517",p:1,cat:5,seuil:"Non déterminé",passe:!1,date:"2026-10-01",entree:"2026-10-01",src:"https://yle.fi/a/74-20249277",txt:{fr:{nom:"Des intrusions suspectées visent les domiciles de plusieurs députés finlandais",pays:"Finlande",lieu:"Helsinki",desc:"Une dizaine d'intrusions suspectées ont visé, sur environ un an, les domiciles de députés finlandais, sans effraction ni vol mais avec des signes de présence délibérée (portes ouvertes, lumières allumées). Le Premier ministre Petteri Orpo a jugé « tout à fait possible » qu'une puissance étrangère soit impliquée, et le président Alexander Stubb a parlé d'« attaque contre la démocratie » si cela se confirmait. Le renseignement intérieur (Supo) a rappelé que les services de pays autoritaires mènent ce type d'opérations, sans se prononcer sur l'origine de ces cas. Un analyste en sécurité, Henri Vanhanen, y a vu une méthode caractéristique de la Russie. La police a ouvert une enquête préliminaire."},es:{nom:"Se sospecha que se han producido intrusiones en los domicilios de varios diputados finlandeses",pays:"Finlandia",lieu:"Helsinki",desc:"Durante aproximadamente un año se han producido una decena de presuntas intrusiones en los domicilios de diputados finlandeses, sin que se hayan producido allanamientos ni robos, pero con indicios de una presencia deliberada (puertas abiertas, luces encendidas). El primer ministro Petteri Orpo consideró «totalmente posible» que una potencia extranjera estuviera implicada, y el presidente Alexander Stubb habló de un «ataque contra la democracia» si esto se confirmara. El servicio de inteligencia interior (Supo) ha recordado que los servicios de países autoritarios llevan a cabo este tipo de operaciones, sin pronunciarse sobre el origen de estos casos. Un analista de seguridad, Henri Vanhanen, lo ha interpretado como un método característico de Rusia. La policía ha abierto una investigación preliminar."},it:{nom:"Si sospettano intrusioni nelle abitazioni di diversi deputati finlandesi",pays:"Finlandia",lieu:"Helsinki",desc:"Nel corso di circa un anno, una decina di presunte intrusioni hanno preso di mira le abitazioni di deputati finlandesi, senza effrazioni né furti, ma con segni di una presenza deliberata (porte aperte, luci accese). Il primo ministro Petteri Orpo ha ritenuto «del tutto possibile» che sia coinvolta una potenza straniera, mentre il presidente Alexander Stubb ha parlato di «attacco alla democrazia» qualora ciò fosse confermato. I servizi di intelligence interni (Supo) hanno ricordato che i servizi di paesi autoritari conducono questo tipo di operazioni, senza pronunciarsi sull’origine di questi casi. Un analista di sicurezza, Henri Vanhanen, ha individuato in ciò un metodo caratteristico della Russia. La polizia ha avviato un’indagine preliminare."}}},{id:"EVEN624",p:1,cat:2,seuil:"Attribué",passe:!0,date:"2026-08-04",entree:"2026-10-02",src:"https://www.telegraph.co.uk/news/2026/10/02/unmasked-russian-biker-spy-leipzig-airport-drone-attack/",txt:{fr:{nom:"Un drone chargé d'explosifs retrouvé sur le tarmac de l'aéroport de Leipzig",pays:"Allemagne",lieu:"Leipzig",desc:"Dans la nuit du 4 août, un drone chargé d'explosifs a été retrouvé sur le tarmac de l'aéroport de Leipzig-Halle, près d'un Antonov ukrainien, sans avoir détoné. Début septembre, Berlin a imputé la tentative d'attentat à la Russie. Selon une enquête du Telegraph et de Welt am Sonntag, le Russe Oleg Levushkin, en contact avec un cadre du GRU, aurait planifié l'opération et chargé un agent biélorusse de l'exécuter. Le 19 octobre, le service de sûreté letton a engagé une procédure de déchéance de sa nationalité lettone ; aucune arrestation ni inculpation le concernant n'avait été rapportée à cette date. Selon le Wall Street Journal (21 octobre), qui cite des responsables européens anonymes, l'attaque aurait été « ordonnée directement » par Vladimir Poutine ; ce point n'avait pas été confirmé officiellement à cette date."},es:{nom:"Hallado un dron cargado de explosivos en la pista del aeropuerto de Leipzig",pays:"Alemania",lieu:"Leipzig",desc:"En la noche del 4 de agosto, se encontró un dron cargado de explosivos en la pista del aeropuerto de Leipzig-Halle, cerca de un Antonov ucraniano, sin que hubiera detonado. A principios de septiembre, Berlín atribuyó el intento de atentado a Rusia. Según una investigación de The Telegraph y Welt am Sonntag, el ruso Oleg Levushkin, en contacto con un alto cargo del GRU, habría planeado la operación y encargado a un agente bielorruso que la llevara a cabo. El 19 de octubre, el servicio de seguridad letón inició un procedimiento para privarle de la nacionalidad letona; hasta esa fecha no se había informado de ninguna detención ni imputación en su contra. Según el Wall Street Journal (21 de octubre), que cita a responsables europeos anónimos, el ataque habría sido «ordenado directamente» por Vladímir Putin; este punto no se había confirmado oficialmente hasta esa fecha."},it:{nom:"Un drone carico di esplosivo rinvenuto sulla pista dell’aeroporto di Lipsia",pays:"Germania",lieu:"Lipsia",desc:"Nella notte del 4 agosto, un drone carico di esplosivo è stato rinvenuto sulla pista dell’aeroporto di Lipsia-Halle, vicino a un Antonov ucraino, senza che fosse esploso. All’inizio di settembre, Berlino ha attribuito il tentato attentato alla Russia. Secondo un’inchiesta del Telegraph e del Welt am Sonntag, il russo Oleg Levushkin, in contatto con un funzionario del GRU, avrebbe pianificato l’operazione e incaricato un agente bielorusso di eseguirla. Il 19 ottobre, i servizi di sicurezza lettoni hanno avviato una procedura per la revoca della sua cittadinanza lettone; a quella data non erano stati segnalati né arresti né incriminazioni a suo carico. Secondo il Wall Street Journal (21 ottobre), che cita funzionari europei anonimi, l’attacco sarebbe stato «ordinato direttamente» da Vladimir Putin; tale informazione non era stata confermata ufficialmente a quella data."}}},{id:"EVEN608",p:1,cat:0,seuil:"Non déterminé",passe:!1,date:"2026-10-02",entree:"2026-10-02",src:"https://www.digi24.ro/stiri/actualitate/alerta-in-tulcea-un-obiect-posibil-o-drona-ar-fi-cazut-in-apropierea-granitei-precizarile-mapn-3974183",txt:{fr:{nom:"Un objet, peut-être un drone, tombe près de la frontière roumano-ukrainienne et provoque un incendie",pays:"Roumanie",lieu:"Plauru",desc:"Vers 5h, un objet, possiblement un drone, est tombé près de Plauru, dans le nord du județ de Tulcea, et a provoqué un incendie sans victime ni dégât, après de nouvelles attaques de drones contre des cibles civiles ukrainiennes proches de la frontière fluviale. Le ministère roumain de la Défense a indiqué que ses radars n'avaient détecté aucune pénétration de l'espace aérien et n'a pas confirmé la nature de l'objet."},es:{nom:"Un objeto, quizá un dron, cae cerca de la frontera entre Rumanía y Ucrania y provoca un incendio",pays:"Rumanía",lieu:"Plauru",desc:"Hacia las 5:00 h, un objeto, posiblemente un dron, cayó cerca de Plauru, en el norte del județ de Tulcea, y provocó un incendio sin víctimas ni daños, tras nuevos ataques con drones contra objetivos civiles ucranianos cercanos a la frontera fluvial. El Ministerio de Defensa rumano ha indicado que sus radares no han detectado ninguna intrusión en el espacio aéreo y no ha confirmado la naturaleza del objeto."},it:{nom:"Un oggetto, forse un drone, cade vicino al confine tra Romania e Ucraina e provoca un incendio",pays:"Romania",lieu:"Plauru",desc:"Verso le 5 del mattino, un oggetto, probabilmente un drone, è caduto nei pressi di Plauru, nella parte settentrionale della contea di Tulcea, provocando un incendio senza causare vittime né danni, dopo nuovi attacchi con droni contro obiettivi civili ucraini situati in prossimità del confine fluviale. Il Ministero della Difesa rumeno ha dichiarato che i propri radar non hanno rilevato alcuna violazione dello spazio aereo e non ha confermato la natura dell’oggetto."}}},{id:"EVEN749",p:2,cat:0,seuil:"Non déterminé",passe:!1,date:"2026-10-03",entree:"2026-10-03",src:"https://www.lrt.lt/naujienos/lietuvoje/2/3053200/naujausia-informacija-vilniaus-apskrityje-ir-ukmergeje-oro-atakos-pavojus-atsauktas",txt:{fr:{nom:"Une alerte aérienne a été déclenchée à Vilnius pour un drone possiblement venu de Biélorussie",pays:"Lituanie",lieu:"Vilnius",desc:"Le 3 octobre au matin, l'armée lituanienne a déclenché une alerte aérienne dans le comté de Vilnius et à Ukmergė pour un drone possiblement entré de Biélorussie ; des chasseurs de l'OTAN ont décollé et l'espace aérien de l'aéroport de Vilnius a été temporairement fermé. L'alerte a été levée peu après : les chasseurs n'ont repéré aucun objet, les recherches là où un signal radar avait disparu n'ont rien donné et les autorités n'ont pas exclu une volée d'oiseaux."},es:{nom:"Se ha activado una alerta aérea en Vilna por un dron que podría proceder de Bielorrusia.",pays:"Lituania",lieu:"Vilna",desc:"La mañana del 3 de octubre, el ejército lituano activó una alerta aérea en la provincia de Vilna y en Ukmergė ante la posible entrada de un dron procedente de Bielorrusia; despegaron cazas de la OTAN y se cerró temporalmente el espacio aéreo del aeropuerto de Vilna. La alerta se levantó poco después: los cazas no localizaron ningún objeto, las búsquedas en el lugar donde había desaparecido una señal de radar no dieron resultado y las autoridades no descartaron que se tratara de una bandada de pájaros."},it:{nom:"A Vilnius è stato diramato un allarme aereo per un drone proveniente, presumibilmente, dalla Bielorussia",pays:"Lituania",lieu:"Vilnius",desc:"La mattina del 3 ottobre, l’esercito lituano ha diramato un allarme aereo nella contea di Vilnius e a Ukmergė per un drone che potrebbe essere entrato dal Bielorussia; sono decollati caccia della NATO e lo spazio aereo dell’aeroporto di Vilnius è stato temporaneamente chiuso. L’allerta è stata revocata poco dopo: i caccia non hanno individuato alcun oggetto, le ricerche nell’area in cui era scomparso un segnale radar non hanno dato esito e le autorità non hanno escluso che si trattasse di uno stormo di uccelli."}}},{id:"EVEN776",p:2,cat:0,seuil:"Attribué",passe:!1,date:"2026-10-03",entree:"2026-10-03",src:"https://www.politico.eu/article/maia-sandu-slams-russia-as-attack-debris-hits-moldova-in-latest-airspace-violation/",txt:{fr:{nom:"Trois missiles et deux drones russes ont violé l'espace aérien moldave et explosé dans quatre raions",pays:"Moldavie",lieu:"Căușeni, Ștefan Vodă, Hîncești, Anenii Noi",desc:"Le 3 octobre vers 8h, en une quinzaine de minutes, trois missiles et deux drones russes ont violé l'espace aérien moldave et explosé près de localités des raions de Căușeni, Ștefan Vodă, Hîncești et Anenii Noi, selon le ministère de la Défense. Des fragments ont été retrouvés et un incendie s'est déclaré, sans victime. La présidente Maia Sandu a condamné une attaque aérienne russe, évoquant des missiles Banderol et des drones."},es:{nom:"Tres misiles y dos drones rusos violaron el espacio aéreo moldavo y explotaron en cuatro raiones",pays:"Moldavia",lieu:"Căușeni, Ștefan Vodă, Hîncești, Anenii Noi",desc:"El 3 de octubre, hacia las 8:00, en unos quince minutos, tres misiles y dos drones rusos violaron el espacio aéreo moldavo y explotaron cerca de localidades de los raiones de Căușeni, Ștefan Vodă, Hîncești y Anenii Noi, según el Ministerio de Defensa. Se han encontrado fragmentos y se ha producido un incendio, sin que haya habido víctimas. La presidenta Maia Sandu ha condenado un ataque aéreo ruso, haciendo referencia a misiles Banderol y drones."},it:{nom:"Tre missili e due droni russi hanno violato lo spazio aereo moldavo e sono esplosi in quattro raioni",pays:"Moldavia",lieu:"Căușeni, Ștefan Vodă, Hîncești, Anenii Noi",desc:"Il 3 ottobre verso le 8:00, nell’arco di una quindicina di minuti, tre missili e due droni russi hanno violato lo spazio aereo moldavo e sono esplosi nei pressi di alcune località dei raioni di Căușeni, Ștefan Vodă, Hîncești e Anenii Noi, secondo quanto riferito dal Ministero della Difesa. Sono stati rinvenuti dei frammenti e si è sviluppato un incendio, senza vittime. La presidente Maia Sandu ha condannato un attacco aereo russo, riferendosi a missili Banderol e droni."}}},{id:"EVEN905",p:2,cat:1,seuil:"Non déterminé",passe:!1,date:"2026-10-05",entree:"2026-10-05",src:"https://www.kyivpost.com/post/86161",txt:{fr:{nom:"Un cargo de maïs coule au large de la Roumanie après une frappe de drones signalée par Kiev",pays:"Roumanie",lieu:"ZEE roumaine, au large de Sfântu Gheorghe",desc:"Le Royad Mammadov, cargo sous pavillon de Saint-Kitts-et-Nevis lié à un armateur turc, a pris feu puis coulé le 5 octobre dans la zone économique exclusive roumaine, à environ 30 milles nautiques au sud de Sfântu Gheorghe, avec du maïs d'Izmaïl à destination de Ravenne. Deux marins sont morts et onze ont été secourus. Volodymyr Zelensky a dénoncé « une frappe de deux drones russes » ; les autorités roumaines n'ont pas confirmé la cause de l'incendie. Le 15 octobre, le président roumain Nicușor Dan a jugé « évident » que les attaques de la mi-octobre étaient des « tentatives de la Russie, en Roumanie et en Bulgarie, visant à déstabiliser nos sociétés », avant de reconnaître le lendemain ne pas pouvoir « dire techniquement, pour l'instant, qu'il s'agit de Russes »."},es:{nom:"Un carguero de maíz se hunde frente a las costas de Rumanía tras un ataque con drones denunciado por Kiev",pays:"Rumanía",lieu:"ZEE rumana, frente a las costas de Sfântu Gheorghe",desc:"El Royad Mammadov, un buque de carga con pabellón de San Cristóbal y Nieves vinculado a un armador turco, se incendió y se hundió el 5 de octubre en la zona económica exclusiva de Rumanía, a unas 30 millas náuticas al sur de Sfântu Gheorghe, con una carga de maíz procedente de Izmail y con destino a Rávena. Dos marineros fallecieron y once fueron rescatados. Volodymyr Zelensky denunció «un ataque de dos drones rusos»; las autoridades rumanas no han confirmado la causa del incendio. El 15 de octubre, el presidente rumano Nicușor Dan consideró «evidente» que los ataques de mediados de octubre eran «intentos de Rusia, en Rumanía y en Bulgaria, destinados a desestabilizar nuestras sociedades», antes de reconocer al día siguiente que no podía «afirmar técnicamente, por el momento, que se trate de rusos»."},it:{nom:"Una nave da carico che trasportava mais affonda al largo della Romania dopo un attacco con droni segnalato da Kiev",pays:"Romania",lieu:"ZEE rumena, al largo di Sfântu Gheorghe",desc:"La Royad Mammadov, una nave da carico battente bandiera di Saint Kitts e Nevis e collegata a un armatore turco, ha preso fuoco e poi è affondata il 5 ottobre nella zona economica esclusiva rumena, a circa 30 miglia nautiche a sud di Sfântu Gheorghe, con un carico di mais proveniente da Izmail e diretto a Ravenna. Due marinai sono morti e undici sono stati tratti in salvo. Volodymyr Zelensky ha denunciato «un attacco di due droni russi»; le autorità rumene non hanno confermato la causa dell’incendio. Il 15 ottobre, il presidente rumeno Nicușor Dan ha ritenuto «evidente» che gli attacchi di metà ottobre fossero «tentativi da parte della Russia, in Romania e in Bulgaria, volti a destabilizzare le nostre società», prima di ammettere il giorno successivo di non poter «affermare tecnicamente, per il momento, che si tratti di russi»."}}},{id:"EVEN911",p:2,cat:0,seuil:"Attribué",passe:!1,date:"2026-10-05",entree:"2026-10-05",src:"https://newsmaker.md/ro/un-proiectil-a-lovit-un-autobuz-la-palanca-un-politist-de-frontiera-a-fost-ranit-iar-punctul-de-trecere-a-fost-inchis",txt:{fr:{nom:"Un projectile a blessé un policier des frontières au poste de Palanca, en Moldavie",pays:"Moldavie",lieu:"Palanca, raion de Ștefan Vodă",desc:"Le 5 octobre vers 9h38, un projectile tombé près du point de passage de Palanca, à la frontière ukrainienne, a ricoché sur le sol et frappé un autobus à l'arrêt, endommageant l'autobus et la cabine de contrôle. Un policier des frontières a été légèrement blessé et le passage a été suspendu. La police des frontières moldave a rattaché l'incident aux frappes russes contre l'infrastructure ukrainienne ; la nature du projectile n'a pas été précisée."},es:{nom:"Un proyectil ha herido a un agente de la policía de fronteras en el puesto de Palanca, en Moldavia",pays:"Moldavia",lieu:"Palanca, raión de Ștefan Vodă",desc:"El 5 de octubre, hacia las 9:38, un proyectil que cayó cerca del paso fronterizo de Palanca, en la frontera con Ucrania, rebotó en el suelo y alcanzó un autobús parado, causando daños tanto al autobús como a la cabina de control. Un agente de la policía de fronteras resultó levemente herido y se suspendió el paso fronterizo. La policía de fronteras moldava atribuyó el incidente a los ataques rusos contra la infraestructura ucraniana; no se ha precisado la naturaleza del proyectil."},it:{nom:"Un proiettile ha ferito un agente di polizia di frontiera al posto di controllo di Palanca, in Moldavia",pays:"Moldavia",lieu:"Palanca, raion di Ștefan Vodă",desc:"Il 5 ottobre, verso le 9:38, un proiettile caduto nei pressi del valico di Palanca, al confine ucraino, è rimbalzato sul terreno e ha colpito un autobus fermo, danneggiando sia il mezzo che la cabina di guida. Un agente di polizia di frontiera è rimasto leggermente ferito e il transito è stato sospeso. La polizia di frontiera moldava ha collegato l’incidente agli attacchi russi contro le infrastrutture ucraine; la natura del proiettile non è stata precisata."}}},{id:"EVEN1146",p:2,cat:0,seuil:"Non déterminé",passe:!1,date:"2026-10-06",entree:"2026-10-06",src:"https://www.euronews.com/2026/10/06/two-spanish-f-18-jets-scrambled-in-romania-after-drone-alert-near-ukraine",txt:{fr:{nom:"Deux F-18 espagnols décollent en Roumanie après la détection de deux cibles aériennes",pays:"Roumanie",lieu:"Comté de Tulcea",desc:"Dans la nuit du 5 au 6 octobre 2026, les radars roumains ont détecté deux cibles aériennes dans l'espace aérien ukrainien, ce qui a conduit deux F-18 espagnols déployés sous commandement de l'OTAN à décoller de la base de Mihail Kogălniceanu. Un message RO-Alert a été envoyé de 2h20 à 3h14 aux habitants du nord et de l'est du comté de Tulcea. Selon le ministère roumain de la Défense, aucune pénétration de l'espace aérien national n'a été enregistrée."},es:{nom:"Dos F-18 españoles despegan en Rumanía tras la detección de dos objetivos aéreos",pays:"Rumanía",lieu:"Condado de Tulcea",desc:"En la noche del 5 al 6 de octubre de 2026, los radares rumanos detectaron dos objetivos aéreos en el espacio aéreo ucraniano, lo que llevó a dos F-18 españoles desplegados bajo el mando de la OTAN a despegar de la base de Mihail Kogălniceanu. Se envió un mensaje RO-Alert entre las 2:20 y las 3:14 a los habitantes del norte y el este del condado de Tulcea. Según el Ministerio de Defensa rumano, no se registró ninguna intrusión en el espacio aéreo nacional."},it:{nom:"Due F-18 spagnoli decollano dalla Romania dopo l’individuazione di due bersagli aerei",pays:"Romania",lieu:"Contea di Tulcea",desc:"Nella notte tra il 5 e il 6 ottobre 2026, i radar rumeni hanno rilevato due bersagli aerei nello spazio aereo ucraino, il che ha portato due F-18 spagnoli schierati sotto il comando della NATO a decollare dalla base di Mihail Kogălniceanu. Dalle 2:20 alle 3:14 è stato inviato un messaggio RO-Alert agli abitanti della parte settentrionale e orientale della contea di Tulcea. Secondo il Ministero della Difesa rumeno, non è stata registrata alcuna violazione dello spazio aereo nazionale."}}},{id:"EVEN1246",p:2,cat:2,seuil:"Suspecté",passe:!1,date:"2026-10-05",entree:"2026-10-07",src:"https://militarnyi.com/en/news/masked-group-enters-latvia-from-belarus-and-carries-out-sabotage/",txt:{fr:{nom:"Des individus masqués venus de Biélorussie sabotent la surveillance de la frontière lettone",pays:"Lettonie",lieu:"Frontière avec la Biélorussie",desc:"Le 24 septembre, la garde-frontière lettone avait signalé que des câbles avaient été sectionnés et que des armoires électriques, du matériel de vidéosurveillance et des poteaux avaient été volontairement endommagés le long de la frontière orientale, des actions ciblées selon son chef, Guntis Pujāts. Le 5 octobre au soir, des individus armés et masqués ont escorté au moins 20 migrants vers la frontière lettone en menaçant des soldats, puis sont entrés en Lettonie, ont endommagé une armoire électrique et volé deux caméras de surveillance. Deux autres armoires ont été sabotées dans les 24 heures suivantes. Le chef adjoint des gardes-frontières, Ivars Ruskulis, a estimé que les services biélorusses étaient derrière ces provocations ; le ministre de l'Intérieur Jānis Dombrava a évoqué un lien avec la Biélorussie ou la Russie ; Guntis Pujāts n'a pas exclu des criminels profitant de la complaisance de Minsk. Le 12 octobre, un groupe se faisant appeler « Black Rus » a revendiqué l'incident sur Telegram. Alexandre Loukachenko a accusé la Lettonie d'avoir mis en scène l'incident."},es:{nom:"Unos individuos enmascarados procedentes de Bielorrusia sabotean la vigilancia de la frontera letona",pays:"Letonia",lieu:"Frontera con Bielorrusia",desc:"El 24 de septiembre, la guardia fronteriza letona informó de que se habían cortado cables y de que se habían dañado deliberadamente armarios eléctricos, equipos de videovigilancia y postes a lo largo de la frontera oriental, acciones que, según su jefe, Guntis Pujāts, fueron deliberadas. La noche del 5 de octubre, unos individuos armados y enmascarados escoltaron al menos a 20 migrantes hacia la frontera letona amenazando a los soldados; a continuación, entraron en Letonia, dañaron una caja eléctrica y robaron dos cámaras de vigilancia. En las 24 horas siguientes se sabotaron otras dos cajas de distribución. El subjefe de la guardia fronteriza, Ivars Ruskulis, consideró que los servicios bielorrusos estaban detrás de estas provocaciones; el ministro del Interior, Jānis Dombrava, mencionó una conexión con Bielorrusia o Rusia; Guntis Pujāts no descartó que se tratara de delincuentes que se aprovechaban de la complacencia de Minsk. El 12 de octubre, un grupo que se autodenomina «Black Rus» reivindicó el incidente en Telegram. Alexander Lukashenko acusó a Letonia de haber montado el incidente."},it:{nom:"Individui mascherati provenienti dalla Bielorussia sabotano il sistema di sorveglianza del confine lettone",pays:"Lettonia",lieu:"Confine con la Bielorussia",desc:"Il 24 settembre, la guardia di frontiera lettone aveva segnalato che lungo il confine orientale erano stati recisi dei cavi e che armadi elettrici, apparecchiature di videosorveglianza e pali erano stati danneggiati intenzionalmente; secondo il suo capo, Guntis Pujāts, si trattava di azioni mirate. La sera del 5 ottobre, individui armati e mascherati hanno scortato almeno 20 migranti verso il confine lettone minacciando i soldati, per poi entrare in Lettonia, danneggiare un armadio elettrico e rubare due telecamere di sorveglianza. Altre due cabine sono state sabotate nelle 24 ore successive. Il vicecapo delle guardie di frontiera, Ivars Ruskulis, ha ritenuto che dietro queste provocazioni ci fossero i servizi bielorussi; il ministro dell’Interno Jānis Dombrava ha accennato a un collegamento con la Bielorussia o la Russia; Guntis Pujāts non ha escluso che alcuni criminali stiano approfittando della compiacenza di Minsk. Il 12 ottobre, un gruppo che si fa chiamare «Black Rus» ha rivendicato l’incidente su Telegram. Aleksandr Lukashenko ha accusato la Lettonia di aver inscenato l’incidente."}}},{id:"EVEN1433",p:2,cat:4,seuil:"Confirmé",passe:!0,date:"2024-04-17",entree:"2026-10-08",src:"https://notesfrompoland.com/2026/10/08/polish-man-suspected-of-helping-russian-plot-to-assassinate-zelensky-sentenced-to-5-5-years/",txt:{fr:{nom:"Un ancien soldat polonais condamné à cinq ans et demi de prison pour avoir aidé les services russes",pays:"Pologne",lieu:"Rzeszów-Jasionka",desc:"Le 8 octobre 2026, la cour d'appel de Lublin a condamné définitivement Paweł K., ancien soldat polonais de 51 ans, à cinq ans et demi de prison pour espionnage, alourdissant de deux ans la peine prononcée en première instance à Zamość. Entre décembre 2022 et mars 2024, il avait proposé ses services à des militaires russes, se déclarant prêt à rejoindre le groupe Wagner ou l'unité 29155 du GRU, et avait été chargé de recueillir des informations sur la sécurité de l'aéroport de Rzeszów-Jasionka, principal pôle logistique vers l'Ukraine. Selon le parquet, ces activités « auraient pu être utilisées par les services de renseignement russes, y compris dans le cadre de la planification d'un possible » assassinat de Volodymyr Zelensky. Arrêté le 17 avril 2024 par l'ABW, il a nié les faits."},es:{nom:"Un exsoldado polaco condenado a cinco años y medio de prisión por ayudar a los servicios rusos",pays:"Polonia",lieu:"Rzeszów-Jasionka",desc:"El 8 de octubre de 2026, el Tribunal de Apelación de Lublin condenó definitivamente a Paweł K., un exsoldado polaco de 51 años, a cinco años y medio de prisión por espionaje, lo que supuso un aumento de dos años respecto a la pena dictada en primera instancia en Zamość. Entre diciembre de 2022 y marzo de 2024, había ofrecido sus servicios a militares rusos, mostrándose dispuesto a unirse al grupo Wagner o a la unidad 29155 del GRU, y se le había encargado recabar información sobre la seguridad del aeropuerto de Rzeszów-Jasionka, principal centro logístico hacia Ucrania. Según la Fiscalía, estas actividades «podrían haber sido utilizadas por los servicios de inteligencia rusos, incluso en el marco de la planificación de un posible» asesinato de Volodymyr Zelensky. Detenido el 17 de abril de 2024 por la ABW, ha negado los hechos."},it:{nom:"Un ex soldato polacco condannato a cinque anni e mezzo di carcere per aver aiutato i servizi segreti russi",pays:"Polonia",lieu:"Rzeszów-Jasionka",desc:"L’8 ottobre 2026, la Corte d’appello di Lublino ha condannato in via definitiva Paweł K., ex soldato polacco di 51 anni, a cinque anni e mezzo di reclusione per spionaggio, aggravando di due anni la pena pronunciata in primo grado a Zamość. Tra dicembre 2022 e marzo 2024, aveva offerto i propri servizi a militari russi, dichiarandosi pronto a unirsi al gruppo Wagner o all’unità 29155 del GRU, ed era stato incaricato di raccogliere informazioni sulla sicurezza dell’aeroporto di Rzeszów-Jasionka, principale polo logistico verso l’Ucraina. Secondo la procura, tali attività «avrebbero potuto essere utilizzate dai servizi segreti russi, anche nell’ambito della pianificazione di un possibile» assassinio di Volodymyr Zelensky. Arrestato il 17 aprile 2024 dall’ABW, ha negato i fatti."}}},{id:"EVEN1420",p:2,cat:4,seuil:"Attribué",passe:!0,date:"2025-05-21",entree:"2026-10-08",src:"https://www.euronews.com/2026/10/08/royal-navy-sailor-faces-court-over-alleged-spying-for-russia",txt:{fr:{nom:"Un marin de la Royal Navy inculpé pour avoir tenté de transmettre des informations sensibles",pays:"Royaume-Uni",lieu:"Londres",desc:"Teddy Stanley Greenidge Young, 24 ans, marin spécialiste du renseignement de la Royal Navy, a comparu le 8 octobre pour deux chefs d'accusation, dont des actes préparatoires à une infraction au National Security Act. Selon le parquet (CPS), il a consulté et conservé des documents sensibles de défense et de renseignement entre novembre 2024 et mai 2025, et se serait livré à des actes préparatoires à leur transmission à « une puissance étrangère ». ITV et AP ont rapporté qu'il aurait utilisé le dark web pour tenter de contacter les autorités russes. Arrêté en mai 2025 puis libéré sous caution, il a été de nouveau interpellé le 6 octobre. Le 23 octobre, lors d'une audience préliminaire à l'Old Bailey, il n'a pas plaidé ; trois nouveaux chefs d'accusation portent le total à cinq, dont une faute dans l'exercice d'une fonction publique. Le procureur Kelly Brocklehurst affirme que Young avait l'intention de partager tout ou partie des renseignements avec une puissance étrangère et déclare : « Le site auquel il semble s'être particulièrement intéressé est celui du service de renseignement extérieur de la Russie, le SVR. » Le procès a été provisoirement fixé à octobre 2027."},es:{nom:"Un marinero de la Royal Navy acusado de intentar transmitir información sensible",pays:"Reino Unido",lieu:"Londres",desc:"Teddy Stanley Greenidge Young, de 24 años, marinero especialista en inteligencia de la Royal Navy, compareció el 8 de octubre por dos cargos, entre ellos actos preparatorios para infringir la Ley de Seguridad Nacional. Según la Fiscalía (CPS), consultó y conservó documentos sensibles de defensa e inteligencia entre noviembre de 2024 y mayo de 2025, y habría llevado a cabo actos preparatorios para su transmisión a «una potencia extranjera». ITV y AP informaron de que habría utilizado la dark web para intentar ponerse en contacto con las autoridades rusas. Detenido en mayo de 2025 y posteriormente puesto en libertad bajo fianza, fue detenido de nuevo el 6 de octubre. El 23 de octubre, durante una vista preliminar en el Old Bailey, no se declaró culpable; tres nuevos cargos elevan el total a cinco, entre ellos un delito en el ejercicio de un cargo público. La fiscal Kelly Brocklehurst afirma que Young tenía la intención de compartir toda o parte de la información con una potencia extranjera y declara: «El sitio web por el que parece haber mostrado especial interés es el del servicio de inteligencia exterior de Rusia, el SVR. » El juicio se ha fijado provisionalmente para octubre de 2027."},it:{nom:"Un marinaio della Royal Navy incriminato per aver tentato di trasmettere informazioni sensibili",pays:"Regno Unito",lieu:"Londra",desc:"Teddy Stanley Greenidge Young, 24 anni, marinaio specializzato in intelligence della Royal Navy, è comparso in tribunale l’8 ottobre per due capi d’accusa, tra cui atti preparatori a una violazione del National Security Act. Secondo la Procura (CPS), tra novembre 2024 e maggio 2025 avrebbe consultato e conservato documenti sensibili relativi alla difesa e all’intelligence, e si sarebbe reso responsabile di atti preparatori alla loro trasmissione a «una potenza straniera». ITV e AP hanno riferito che avrebbe utilizzato il dark web per tentare di contattare le autorità russe. Arrestato nel maggio 2025 e poi rilasciato su cauzione, è stato nuovamente arrestato il 6 ottobre. Il 23 ottobre, durante un’udienza preliminare all’Old Bailey, non ha presentato alcuna dichiarazione; tre nuovi capi d’accusa portano il totale a cinque, tra cui un reato nell’esercizio di una funzione pubblica. Il procuratore Kelly Brocklehurst sostiene che Young avesse intenzione di condividere tutte o parte delle informazioni con una potenza straniera e afferma: «Il sito a cui sembra aver mostrato particolare interesse è quello del servizio di intelligence estero russo, l’SVR. » Il processo è stato provvisoriamente fissato per ottobre 2027."}}},{id:"EVEN1384",p:2,cat:1,seuil:"Non déterminé",passe:!1,date:"2026-10-06",entree:"2026-10-08",src:"https://www.bairdmaritime.com/amp/story/security/incidents/acts-of-war/suspected-russian-drone-strike-sinks-merchant-ship-off-bulgaria-crew-missing",txt:{fr:{nom:"Un cargo coule après une frappe de drones dans la ZEE bulgare, dix à douze marins disparus",pays:"Bulgarie",lieu:"ZEE bulgare, à environ 70 milles nautiques à l'est de Byala",desc:"Dans la nuit du 5 au 6 octobre, vers 3h, l'Alfa Watan, cargo sous pavillon togolais, a été frappé par des drones aériens et navals dans la zone économique exclusive bulgare, à environ 70 milles nautiques à l'est de Byala, et a coulé en quelques minutes. Les recherches pour retrouver les dix à douze membres d'équipage, en majorité syriens, ont été interrompues. Le Premier ministre Rumen Radev a dénoncé une « violation grossière » du droit international sans désigner de responsable ; le président ukrainien Volodymyr Zelensky a accusé la Russie."},es:{nom:"Un buque de carga se hunde tras un ataque con drones en la ZEE búlgara; entre diez y doce marineros desaparecidos",pays:"Bulgaria",lieu:"ZEE búlgara, a unas 70 millas náuticas al este de Byala",desc:"En la noche del 5 al 6 de octubre, hacia las 3 de la madrugada, el Alfa Watan, un carguero con pabellón togolés, fue atacado por drones aéreos y navales en la zona económica exclusiva de Bulgaria, a unas 70 millas náuticas al este de Byala, y se hundió en cuestión de minutos. Se han interrumpido las labores de búsqueda para localizar a los entre diez y doce tripulantes, en su mayoría sirios. El primer ministro Rumen Radev ha denunciado una «grave violación» del derecho internacional sin señalar a ningún responsable; el presidente ucraniano Volodymyr Zelensky ha acusado a Rusia."},it:{nom:"Una nave da carico affonda dopo un attacco con droni nella ZEE bulgara, da dieci a dodici marinai dispersi",pays:"Bulgaria",lieu:"ZEE bulgara, a circa 70 miglia nautiche a est di Byala",desc:"Nella notte tra il 5 e il 6 ottobre, verso le 3 del mattino, l’Alfa Watan, nave da carico battente bandiera del Togo, è stata colpita da droni aerei e navali nella zona economica esclusiva bulgara, a circa 70 miglia nautiche a est di Byala, ed è affondata in pochi minuti. Le ricerche per ritrovare i dieci-dodici membri dell’equipaggio, per lo più siriani, sono state interrotte. Il primo ministro Rumen Radev ha denunciato una «grave violazione» del diritto internazionale senza indicare alcun responsabile; il presidente ucraino Volodymyr Zelensky ha accusato la Russia."}}},{id:"EVEN1517",p:2,cat:1,seuil:"Non déterminé",passe:!1,date:"2026-10-06",entree:"2026-10-09",src:"https://container-news.com/drones-strike-two-merchant-ships-in-bulgarias-black-sea-eez-one-sinks/",txt:{fr:{nom:"Un cargo chargé de céréales est incendié par des drones dans la ZEE bulgare",pays:"Bulgarie",lieu:"ZEE bulgare, à environ 70 milles nautiques à l'est de Byala",desc:"Dans la nuit du 5 au 6 octobre, l'Able, cargo sous pavillon des Palaos chargé de céréales, a pris feu après avoir été frappé par des drones dans la zone économique exclusive bulgare. Ses 18 membres d'équipage ont été évacués par le ferry bulgare Dioscuria, dont deux blessés. Abandonné, le navire, dont la salle des machines était inondée, a quitté la ZEE bulgare le 12 octobre. Les militaires bulgares n'ont retrouvé aucun débris de drone à bord."},es:{nom:"Un buque de carga cargado de cereales es incendiado por drones en la ZEE búlgara",pays:"Bulgaria",lieu:"ZEE búlgara, a unas 70 millas náuticas al este de Byala",desc:"En la noche del 5 al 6 de octubre, el Able, un carguero con pabellón de Palau cargado de cereales, se incendió tras ser alcanzado por drones en la zona económica exclusiva de Bulgaria. Sus 18 tripulantes fueron evacuados por el transbordador búlgaro Dioscuria, entre ellos dos heridos. El buque, abandonado y con la sala de máquinas inundada, abandonó la ZEE búlgara el 12 de octubre. Las fuerzas armadas búlgaras no encontraron restos de drones a bordo."},it:{nom:"Una nave da carico carica di cereali viene incendiata da droni nella ZEE bulgara",pays:"Bulgaria",lieu:"ZEE bulgara, a circa 70 miglia nautiche a est di Byala",desc:"Nella notte tra il 5 e il 6 ottobre, l’Able, una nave da carico battente bandiera delle Isole Palau e carica di cereali, ha preso fuoco dopo essere stata colpita da droni nella zona economica esclusiva bulgara. I suoi 18 membri dell’equipaggio sono stati evacuati dal traghetto bulgaro «Dioscuria», tra cui due feriti. Abbandonata, la nave, la cui sala macchine era allagata, ha lasciato la ZEE bulgara il 12 ottobre. Le forze armate bulgare non hanno rinvenuto alcun frammento di drone a bordo."}}},{id:"EVEN1572",p:3,cat:2,seuil:"Non déterminé",passe:!1,date:"2026-10-10",entree:"2026-10-10",src:"https://www.rodi.nl/denhaag/112-nieuws/121913/ook-zondag-geen-treinen-tussen-delft-en-rotterdam-35-kabels-beschadigd-door-brandstichting",txt:{fr:{nom:"Un incendie criminel sur un pont ferroviaire paralyse le trafic entre Rotterdam et Delft",pays:"Pays-Bas",lieu:"Rotterdam-Delfshaven",desc:"Dans la nuit du 9 au 10 octobre, des inconnus ont découpé la porte d'un local technique situé sous un pont ferroviaire à Rotterdam-Delfshaven et y ont mis le feu, endommageant 35 câbles alimentant la caténaire et le système de sécurité des trains. Le trafic entre Rotterdam et Delft a été interrompu pendant tout le week-end. ProRail a confirmé un acte délibéré sans en connaître le mobile ; la police, qui a exploité des images de caméras, a examiné plusieurs hypothèses dont le sabotage. Aucun lien avec un acteur étranger n'a été évoqué par les autorités."},es:{nom:"Un incendio provocado en un puente ferroviario paraliza el tráfico entre Róterdam y Delft",pays:"Países Bajos",lieu:"Róterdam-Delfshaven",desc:"En la noche del 9 al 10 de octubre, unos desconocidos cortaron la puerta de una sala técnica situada bajo un puente ferroviario en Róterdam-Delfshaven y le prendieron fuego, dañando 35 cables que alimentan la catenaria y el sistema de seguridad de los trenes. El tráfico entre Róterdam y Delft quedó interrumpido durante todo el fin de semana. ProRail confirmó que se trataba de un acto deliberado, aunque desconocía el motivo; la policía, que analizó las imágenes de las cámaras de seguridad, barajó varias hipótesis, entre ellas el sabotaje. Las autoridades no han mencionado ningún vínculo con un agente extranjero."},it:{nom:"Un incendio doloso su un ponte ferroviario paralizza il traffico tra Rotterdam e Delft",pays:"Paesi Bassi",lieu:"Rotterdam-Delfshaven",desc:"Nella notte tra il 9 e il 10 ottobre, alcuni sconosciuti hanno squarciato la porta di un locale tecnico situato sotto un ponte ferroviario a Rotterdam-Delfshaven e vi hanno appiccato il fuoco, danneggiando 35 cavi che alimentano la catenaria e il sistema di sicurezza dei treni. Il traffico tra Rotterdam e Delft è rimasto interrotto per tutto il fine settimana. ProRail ha confermato che si è trattato di un atto deliberato, pur senza conoscerne il movente; la polizia, che ha analizzato le immagini delle telecamere, ha preso in esame diverse ipotesi, tra cui quella del sabotaggio. Le autorità non hanno menzionato alcun collegamento con soggetti stranieri."}}},{id:"EVEN1689",p:3,cat:2,seuil:"Non déterminé",passe:!0,date:"2026-09-21",entree:"2026-10-11",src:"https://clubz.bg/180403",txt:{fr:{nom:"Une explosion d'origine indéterminée dans un wagon vide endommage le dépôt Nadejda, à Sofia",pays:"Bulgarie",lieu:"Sofia",desc:"Le 21 septembre vers 10h38, une explosion s'est produite dans l'armoire électrique extérieure d'un wagon de voyageurs vide, en attente de réparation, dans le hall de maintenance du dépôt Nadejda de la compagnie ferroviaire BDJ, à Sofia ; environ 300 m² de vitrages ont été soufflés, sans blessé. Révélé le 11 octobre, l'incident a fait l'objet d'une procédure du parquet de district de Sofia contre X. Selon BDJ, la conception de l'équipement ne laisse pas supposer une telle explosion en fonctionnement normal ; la compagnie a suspendu tous les wagons de la même série. Les enquêteurs n'ont pas déterminé s'il s'agissait d'un accident technique ou d'un acte délibéré, et aucun lien avec un acteur étranger n'a été évoqué."},es:{nom:"Una explosión de origen desconocido en un vagón vacío causa daños en la estación de Nadejda, en Sofía",pays:"Bulgaria",lieu:"Sofía",desc:"El 21 de septiembre, hacia las 10:38, se produjo una explosión en el armario eléctrico exterior de un vagón de pasajeros vacío, a la espera de reparación, en la nave de mantenimiento de la estación de Nadejda de la compañía ferroviaria BDJ, en Sofía; quedaron destrozados unos 300 m² de cristales, sin que se produjeran heridos. El incidente, dado a conocer el 11 de octubre, fue objeto de un procedimiento de la Fiscalía del Distrito de Sofía contra desconocidos. Según BDJ, el diseño del equipo no permite suponer que se produzca una explosión de este tipo en condiciones normales de funcionamiento; la empresa ha retirado de servicio todos los vagones de la misma serie. Los investigadores no han determinado si se trató de un accidente técnico o de un acto deliberado, y no se ha mencionado ninguna relación con un agente extranjero."},it:{nom:"Un'esplosione di origine sconosciuta in un vagone vuoto danneggia il deposito Nadejda, a Sofia",pays:"Bulgaria",lieu:"Sofia",desc:"Il 21 settembre, verso le ore 10:38, si è verificata un’esplosione nel quadro elettrico esterno di un vagone passeggeri vuoto, in attesa di riparazione, nell’area di manutenzione del deposito Nadejda della compagnia ferroviaria BDJ, a Sofia; circa 300 m² di vetrate sono stati fatti saltare in aria, senza causare feriti. Reso noto l’11 ottobre, l’incidente è stato oggetto di un procedimento della Procura distrettuale di Sofia contro ignoti. Secondo la BDJ, la progettazione dell’apparecchiatura non lascia supporre una simile esplosione durante il normale funzionamento; la compagnia ha sospeso l’utilizzo di tutti i vagoni della stessa serie. Gli investigatori non hanno stabilito se si sia trattato di un incidente tecnico o di un atto deliberato, e non è stato menzionato alcun collegamento con soggetti stranieri."}}},{id:"EVEN1642",p:3,cat:0,seuil:"Suspecté",passe:!1,date:"2026-10-10",entree:"2026-10-11",src:"http://www.jurnal.md/ro/news/51831d6e299ca893/o-noua-drona-a-patruns-pe-teritoriul-r-moldova-noaptea-trecuta-a-explodat-in-preajma-satului-geamana-raionul-aneni",txt:{fr:{nom:"Un drone kamikaze s'écrase dans une forêt près de Geamăna, en Moldavie",pays:"Moldavie",lieu:"Geamăna, raion d'Anenii Noi",desc:"Le 10 octobre vers 22h20, un drone volant à basse altitude au-dessus du raion d'Anenii Noi a percuté un arbre et aurait explosé dans une forêt en périphérie du village de Geamăna, à une centaine de mètres d'une route. Les démineurs de la police ont désactivé sa charge militaire ; il n'y a eu aucune victime. Les autorités n'ont pas précisé le modèle de l'engin."},es:{nom:"Un dron kamikaze se estrella en un bosque cerca de Geamăna, en Moldavia",pays:"Moldavia",lieu:"Geamăna, distrito de Anenii Noi",desc:"El 10 de octubre, hacia las 22:20, un dron que volaba a baja altura sobre el raión de Anenii Noi chocó contra un árbol y, al parecer, explotó en un bosque a las afueras de la localidad de Geamăna, a unos cien metros de una carretera. Los artificieros de la policía desactivaron su carga explosiva; no hubo víctimas. Las autoridades no han especificado el modelo del aparato."},it:{nom:"Un drone kamikaze si schianta in una foresta vicino a Geamăna, in Moldavia",pays:"Moldavia",lieu:"Geamăna, distretto di Anenii Noi",desc:"Il 10 ottobre verso le 22:20, un drone che volava a bassa quota sopra il raion di Anenii Noi si è schiantato contro un albero e sarebbe esploso in un bosco alla periferia del villaggio di Geamăna, a un centinaio di metri da una strada. Gli artificieri della polizia hanno disinnescato il suo carico esplosivo; non si sono registrate vittime. Le autorità non hanno specificato il modello del velivolo."}}},{id:"EVEN1794",p:3,cat:3,seuil:"Attribué",passe:!0,date:"2024-04-14",entree:"2026-10-12",src:"https://notesfrompoland.com/2026/10/12/four-go-on-trial-in-warsaw-over-arson-attacks-carried-out-on-russian-orders/",txt:{fr:{nom:"Procès à Varsovie de quatre hommes accusés d'appartenir à un groupe d'incendiaires",pays:"Pologne",lieu:"Varsovie",desc:"Le 12 octobre s'est ouvert à huis clos, devant le tribunal régional de Varsovie-Praga, le procès de trois Ukrainiens et d'un Biélorusse accusés d'appartenir à un groupe qui, selon le parquet, a agi en avril et mai 2024 pour le compte du renseignement russe et était chargé de commettre des sabotages et des infractions de nature terroriste. Ils sont notamment accusés d'avoir incendié un magasin OBI à Varsovie, d'avoir participé à l'incendie d'un IKEA à Vilnius et d'avoir pris part à une agression à Wólka Kosowska ; le groupe aurait aussi préparé l'incendie d'un IKEA à Riga. Deux des accusés encourent au moins dix ans de prison."},es:{nom:"Juicio en Varsovia contra cuatro hombres acusados de pertenecer a un grupo de pirómanos",pays:"Polonia",lieu:"Varsovia",desc:"El 12 de octubre se inició a puerta cerrada, ante el tribunal regional de Varsovia-Praga, el juicio contra tres ucranianos y un bielorruso acusados de pertenece
