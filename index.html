r a un grupo que, según la fiscalía, actuó en abril y mayo de 2024 por cuenta de los servicios de inteligencia rusos y se encargaba de cometer sabotajes y delitos de carácter terrorista. Se les acusa, entre otras cosas, de haber incendiado una tienda OBI en Varsovia, de haber participado en el incendio de un IKEA en Vilna y de haber intervenido en una agresión en Wólka Kosowska; al parecer, el grupo también habría preparado el incendio de un IKEA en Riga. Dos de los acusados se enfrentan a una pena de al menos diez años de prisión."},it:{nom:"Processo a Varsavia contro quattro uomini accusati di appartenere a un gruppo di piromani",pays:"Polonia",lieu:"Varsavia",desc:"Il 12 ottobre si è aperto a porte chiuse, dinanzi al tribunale regionale di Varsavia-Praga, il processo a tre ucraini e un bielorusso accusati di appartenere a un gruppo che, secondo la procura, ha agito nell’aprile e nel maggio 2024 per conto dei servizi segreti russi ed era incaricato di compiere sabotaggi e reati di natura terroristica. Sono accusati in particolare di aver appiccato un incendio in un negozio OBI a Varsavia, di aver partecipato all’incendio di un IKEA a Vilnius e di aver preso parte a un’aggressione a Wólka Kosowska; il gruppo avrebbe inoltre preparato l’incendio di un IKEA a Riga. Due degli imputati rischiano almeno dieci anni di reclusione."}}},{id:"EVEN1914",p:3,cat:1,seuil:"Non déterminé",passe:!1,date:"2026-10-13",entree:"2026-10-13",src:"https://keyt.com/news/national-world/cnn-world/2026/10/13/several-sailors-missing-after-drone-strike-sinks-merchant-vessel-near-bulgarian-waters/",txt:{fr:{nom:"Un cargo opéré par une société ukrainienne frappé par trois drones au large de Byala",pays:"Bulgarie",lieu:"Au large de Byala",desc:"Dans la nuit du 12 au 13 octobre, le Chelsea 3, cargo sous pavillon maltais opéré par une société ukrainienne, a été touché par trois drones à environ 18 milles nautiques à l'est de Byala. Ses 15 membres d'équipage ont été évacués vers Varna, plusieurs légèrement blessés. La Bulgarie a convoqué l'ambassadrice de Russie, qui n'a pas exclu une provocation d'un tiers. Le Premier ministre Rumen Radev a jugé absurde que l'Ukraine détruise ses propres navires et estimé que ces frappes servent les intérêts de la Russie, tout en reconnaissant ne pas avoir de preuves claires sur les responsables. Le 20 octobre, le ministre des Transports, Georgi Peev, a annoncé que des restes de drone, trouvés à bord, seront analysés par des services bulgares."},es:{nom:"Un buque de carga operado por una empresa ucraniana fue alcanzado por tres drones frente a las costas de Byala",pays:"Bulgaria",lieu:"Frente a las costas de Byala",desc:"En la noche del 12 al 13 de octubre, el Chelsea 3, un carguero con pabellón maltés operado por una empresa ucraniana, fue alcanzado por tres drones a unas 18 millas náuticas al este de Byala. Sus 15 tripulantes fueron evacuados a Varna; varios resultaron levemente heridos. Bulgaria convocó a la embajadora de Rusia, quien no descartó que se tratara de una provocación de un tercero. El primer ministro, Rumen Radev, calificó de absurdo que Ucrania destruyera sus propios buques y consideró que estos ataques benefician a los intereses de Rusia, aunque reconoció no disponer de pruebas claras sobre los responsables. El 20 de octubre, el ministro de Transportes, Georgi Peev, anunció que los restos de un dron, hallados a bordo, serán analizados por los servicios búlgaros."},it:{nom:"Una nave da carico gestita da una società ucraina è stata colpita da tre droni al largo di Byala",pays:"Bulgaria",lieu:"Al largo di Byala",desc:"Nella notte tra il 12 e il 13 ottobre, la Chelsea 3, una nave da carico battente bandiera maltese gestita da una società ucraina, è stata colpita da tre droni a circa 18 miglia nautiche a est di Byala. I suoi 15 membri dell’equipaggio sono stati evacuati a Varna; diversi di loro hanno riportato ferite lievi. La Bulgaria ha convocato l’ambasciatrice russa, la quale non ha escluso che si tratti di una provocazione da parte di terzi. Il primo ministro Rumen Radev ha definito assurdo che l’Ucraina distrugga le proprie navi e ha ritenuto che questi attacchi servano gli interessi della Russia, pur riconoscendo di non disporre di prove chiare sui responsabili. Il 20 ottobre, il ministro dei Trasporti, Georgi Peev, ha annunciato che i resti di un drone, rinvenuti a bordo, saranno analizzati dai servizi bulgari."}}},{id:"EVEN1921",p:3,cat:1,seuil:"Non déterminé",passe:!1,date:"2026-10-13",entree:"2026-10-13",src:"https://www.arabnews.pk/middle-east/14-syrians-aboard-hs-dignity-sunk-in-drone-attack-off-bulgaria-3004081",txt:{fr:{nom:"Un cargo coule après une frappe de drones au large de Krapets, onze marins disparus",pays:"Bulgarie",lieu:"Au large de Krapets",desc:"Dans la nuit du 12 au 13 octobre, le HS Dignity, cargo sous pavillon de Guinée-Bissau, a coulé à environ 15 milles nautiques à l'est de Krapets, près de la frontière roumaine, après avoir été frappé, selon le syndicat des marins syriens, par un drone aérien et deux drones navals. Cinq des seize membres d'équipage, en majorité syriens, ont été secourus et onze ont été portés disparus. La Bulgarie a convoqué l'ambassadrice de Russie. Le Premier ministre Rumen Radev a jugé absurde que l'Ukraine détruise ses propres navires et estimé que ces frappes servent les intérêts de la Russie, tout en reconnaissant ne pas disposer de preuves claires sur les responsables."},es:{nom:"Un buque de carga se hunde tras un ataque con drones frente a las costas de Krapets; once marineros desaparecidos",pays:"Bulgaria",lieu:"Frente a las costas de Krapets",desc:"En la noche del 12 al 13 de octubre, el HS Dignity, un carguero con pabellón de Guinea-Bissau, se hundió a unas 15 millas náuticas al este de Krapets, cerca de la frontera rumana, tras haber sido alcanzado, según el sindicato de marineros sirios, por un dron aéreo y dos drones navales. Cinco de los dieciséis tripulantes, en su mayoría sirios, fueron rescatados y once quedaron en paradero desconocido. Bulgaria ha convocado a la embajadora de Rusia. El primer ministro, Rumen Radev, ha calificado de absurdo que Ucrania destruya sus propios buques y ha considerado que estos ataques benefician a los intereses de Rusia, aunque ha reconocido que no dispone de pruebas claras sobre los responsables."},it:{nom:"Una nave da carico affonda dopo un attacco con droni al largo di Krapets, undici marinai dispersi",pays:"Bulgaria",lieu:"Al largo di Krapets",desc:"Nella notte tra il 12 e il 13 ottobre, la HS Dignity, una nave da carico battente bandiera della Guinea-Bissau, è affondata a circa 15 miglia nautiche a est di Krapets, vicino al confine rumeno, dopo essere stata colpita, secondo il sindacato dei marittimi siriani, da un drone aereo e da due droni navali. Cinque dei sedici membri dell’equipaggio, per lo più siriani, sono stati tratti in salvo, mentre undici risultano dispersi. La Bulgaria ha convocato l’ambasciatrice russa. Il primo ministro Rumen Radev ha definito assurdo che l’Ucraina distrugga le proprie navi e ha ritenuto che questi attacchi servano gli interessi della Russia, pur riconoscendo di non disporre di prove chiare sui responsabili."}}},{id:"EVEN1952",p:3,cat:0,seuil:"Non déterminé",passe:!1,date:"2026-10-13",entree:"2026-10-13",src:"https://www.stuttgarter-zeitung.de/politik/notfall-am-flughafen-nuernberg-erst-eine-drohne-dann-ein-notfallcode-was-steckt-hinter-der-sperrung-79565146.html",txt:{fr:{nom:"L'aéroport de Nuremberg suspend ses vols après le signalement d'un possible drone",pays:"Allemagne",lieu:"Nuremberg",desc:"Le 13 octobre au matin, trois pilotes ont signalé indépendamment un possible drone lors du décollage ou de l'atterrissage à l'aéroport de Nuremberg, qui a suspendu ses opérations. Les recherches menées avec un hélicoptère de la police n'ont pas permis de retrouver l'engin ; six vols ont été retardés et deux appareils déroutés vers Cologne et Prague. Aucun lien avec un acteur étranger n'a été évoqué."},es:{nom:"El aeropuerto de Núremberg suspende sus vuelos tras el aviso de un posible dron",pays:"Alemania",lieu:"Núremberg",desc:"La mañana del 13 de octubre, tres pilotos señalaron de forma independiente la presencia de un posible dron durante el despegue o el aterrizaje en el aeropuerto de Núremberg, que suspendió sus operaciones. Las búsquedas realizadas con un helicóptero de la policía no permitieron localizar el aparato; seis vuelos sufrieron retrasos y dos aviones fueron desviados a Colonia y Praga. No se ha mencionado ninguna relación con un agente extranjero."},it:{nom:"L'aeroporto di Norimberga sospende i voli dopo la segnalazione di un possibile drone",pays:"Germania",lieu:"Norimberga",desc:"La mattina del 13 ottobre, tre piloti hanno segnalato indipendentemente l’avvistamento di un possibile drone durante il decollo o l’atterraggio all’aeroporto di Norimberga, che ha sospeso le operazioni. Le ricerche condotte con un elicottero della polizia non hanno permesso di individuare il velivolo; sei voli hanno subito ritardi e due aerei sono stati dirottati verso Colonia e Praga. Non è stato menzionato alcun collegamento con attori stranieri."}}},{id:"EVEN2224",p:3,cat:3,seuil:"Non déterminé",passe:!1,date:"2026-10-09",entree:"2026-10-14",src:"https://meduza.io/en/news/2026/10/14/masked-intruders-set-fire-to-11-starlink-antennas-in-bulgaria",txt:{fr:{nom:"Des antennes d'un site Starlink incendiées près de Sofia",pays:"Bulgarie",lieu:"Sud de Sofia",desc:"Le 9 octobre, deux individus masqués auraient incendié des antennes d'une installation Starlink à une vingtaine de kilomètres de Sofia (8 antennes touchées selon l'accusation bulgare, 11 sur 17 selon la télévision publique BNT). Selon le mandat d'arrêt bulgare, les suspects, deux Allemands de 19 ans, seraient entrés en Bulgarie depuis la Serbie en touristes. Arrêtés à Duisburg le 23 octobre, ils ont été placés en détention par le tribunal régional supérieur de Düsseldorf en vue d'une extradition, dont il devait examiner plus tard la recevabilité ; leurs avocats voulaient contester le mandat. Ils encourent de trois à douze ans de prison. Aucun commanditaire n'a été désigné par les autorités bulgares."},es:{nom:"Se incendian las antenas de una estación de Starlink cerca de Sofía",pays:"Bulgaria",lieu:"Al sur de Sofía",desc:"El 9 de octubre, dos individuos enmascarados habrían incendiado las antenas de una instalación de Starlink a unos veinte kilómetros de Sofía (ocho antenas afectadas según la acusación búlgara, once de diecisiete según la televisión pública BNT). Según la orden de detención búlgara, los sospechosos, dos alemanes de 19 años, habrían entrado en Bulgaria desde Serbia como turistas. Detenidos en Duisburgo el 23 de octubre, el Tribunal Regional Superior de Düsseldorf les impuso prisión preventiva a la espera de su extradición, cuya admisibilidad debía examinar posteriormente; sus abogados pretendían impugnar la orden de detención. Se enfrentan a penas de entre tres y doce años de prisión. Las autoridades búlgaras no han señalado a ningún instigador."},it:{nom:"Alcune antenne di un sito Starlink sono state incendiate nei pressi di Sofia",pays:"Bulgaria",lieu:"A sud di Sofia",desc:"Il 9 ottobre, due individui mascherati avrebbero appiccato il fuoco alle antenne di un impianto Starlink a una ventina di chilometri da Sofia (8 antenne colpite secondo l’accusa bulgara, 11 su 17 secondo l’emittente televisiva pubblica BNT). Secondo il mandato di arresto bulgaro, i sospetti, due tedeschi di 19 anni, sarebbero entrati in Bulgaria dalla Serbia come turisti. Arrestati a Duisburg il 23 ottobre, sono stati posti in custodia cautelare dal Tribunale regionale superiore di Düsseldorf in vista di un’estradizione, la cui ammissibilità avrebbe dovuto essere esaminata in un secondo momento; i loro avvocati intendevano contestare il mandato. Rischiano da tre a dodici anni di reclusione. Le autorità bulgare non hanno indicato alcun mandante."}}},{id:"EVEN2200",p:3,cat:0,seuil:"Non déterminé",passe:!1,date:"2026-10-14",entree:"2026-10-14",src:"https://www.digi24.ro/stiri/actualitate/radarele-mapn-au-detectat-inca-o-drona-care-a-intrat-in-spatiul-aerian-national-aparatul-a-fost-doborat-de-ucraineni-3991583",txt:{fr:{nom:"Un drone survole l'espace aérien roumain à l'est de Sulina avant d'être abattu par l'Ukraine",pays:"Roumanie",lieu:"À l'est de Sulina",desc:"Le 14 octobre au matin, une cible aérienne détectée à l'est de Sulina, au-dessus de la mer Noire, « a évolué pour un court moment dans l'espace aérien national », selon le ministère roumain de la Défense, avant de pénétrer dans l'espace aérien ukrainien, « où elle a été abattue par la défense antiaérienne de l'Ukraine ». Deux F-16 roumains ont décollé de la base de Borcea et un message RO-Alert a été envoyé à 10h19 aux habitants de l'est et du nord du comté de Tulcea ; l'alerte a été levée à 11h22. Le même matin, trois drones avaient été suivis près de Vylkove, en Ukraine, sans pénétrer en Roumanie."},es:{nom:"Un dron sobrevuela el espacio aéreo rumano al este de Sulina antes de ser derribado por Ucrania",pays:"Rumanía",lieu:"Al este de Sulina",desc:"La mañana del 14 de octubre, un objetivo aéreo detectado al este de Sulina, sobre el mar Negro, «se desplazó durante un breve periodo de tiempo por el espacio aéreo nacional», según el Ministerio de Defensa rumano, antes de penetrar en el espacio aéreo ucraniano, «donde fue derribado por la defensa antiaérea de Ucrania». Dos F-16 rumanos despegaron de la base de Borcea y se envió un mensaje RO-Alert a las 10:19 h a los habitantes del este y el norte del condado de Tulcea; la alerta se levantó a las 11:22 h. Esa misma mañana se había detectado a tres drones cerca de Vylkove, en Ucrania, sin que llegaran a entrar en Rumanía."},it:{nom:"Un drone sorvola lo spazio aereo rumeno a est di Sulina prima di essere abbattuto dall’Ucraina",pays:"Romania",lieu:"A est di Sulina",desc:"La mattina del 14 ottobre, un bersaglio aereo individuato a est di Sulina, sopra il Mar Nero, «ha volato per un breve periodo nello spazio aereo nazionale», secondo il Ministero della Difesa rumeno, prima di penetrare nello spazio aereo ucraino, «dove è stato abbattuto dalla difesa antiaerea dell’Ucraina». Due F-16 rumeni sono decollati dalla base di Borcea e alle 10:19 è stato inviato un messaggio RO-Alert agli abitanti della parte orientale e settentrionale della contea di Tulcea; l’allerta è stata revocata alle 11:22. La stessa mattina, tre droni erano stati avvistati nei pressi di Vylkove, in Ucraina, senza però entrare in territorio rumeno."}}},{id:"EVEN2286",p:3,cat:0,seuil:"Non déterminé",passe:!1,date:"2026-10-14",entree:"2026-10-14",src:"https://www.24chasa.bg/mezhdunarodni/article/23735729",txt:{fr:{nom:"Plusieurs cibles aériennes entrent dans l'espace aérien roumain près de Sulina le soir du 14 octobre",pays:"Roumanie",lieu:"Au nord-est de Sulina",desc:"Le 14 octobre, une cible aérienne détectée à l'est de l'île aux Serpents est entrée à 17h38 dans l'espace aérien roumain, à environ 22 km au nord-est de Sulina, au-dessus des eaux territoriales, avant d'en ressortir à 17h46. Une alerte a été envoyée aux habitants du nord et de l'est du comté de Tulcea et deux F-16 roumains ont décollé de Borcea. À 20h04, deux nouvelles cibles sont entrées dans l'espace aérien roumain : le contact radar avec l'une a été perdu au-dessus de la mer, l'autre est repartie vers l'Ukraine et a été détruite par la défense antiaérienne ukrainienne près de Reni ; deux F-18 espagnols ont décollé de Mihail Kogălniceanu. Les alertes ont pris fin à 19h03 puis à 21h14."},es:{nom:"Varios objetivos aéreos penetran en el espacio aéreo rumano cerca de Sulina la noche del 14 de octubre",pays:"Rumanía",lieu:"Al noreste de Sulina",desc:"El 14 de octubre, un objetivo aéreo detectado al este de la Isla de las Serpientes entró a las 17:38 en el espacio aéreo rumano, a unos 22 km al noreste de Sulina, sobre aguas territoriales, antes de salir de él a las 17:46. Se envió una alerta a los habitantes del norte y el este del condado de Tulcea y dos F-16 rumanos despegaron de Borcea. A las 20:04, dos nuevos objetivos entraron en el espacio aéreo rumano: se perdió el contacto por radar con uno de ellos sobre el mar, mientras que el otro se dirigió de nuevo hacia Ucrania y fue derribado por la defensa antiaérea ucraniana cerca de Reni; dos F-18 españoles despegaron de Mihail Kogălniceanu. Las alertas finalizaron a las 19:03 y, posteriormente, a las 21:14."},it:{nom:"Diversi bersagli aerei entrano nello spazio aereo rumeno nei pressi di Sulina la sera del 14 ottobre",pays:"Romania",lieu:"A nord-est di Sulina",desc:"Il 14 ottobre, un bersaglio aereo individuato a est dell’Isola dei Serpenti è entrato alle 17:38 nello spazio aereo rumeno, a circa 22 km a nord-est di Sulina, sopra le acque territoriali, per poi uscirne alle 17:46. È stato diramato un allarme agli abitanti della parte settentrionale e orientale della contea di Tulcea e due F-16 rumeni sono decollati da Borcea. Alle ore 20:04, due nuovi bersagli sono entrati nello spazio aereo rumeno: il contatto radar con uno di essi è stato perso sopra il mare, l’altro è ripartito verso l’Ucraina ed è stato abbattuto dalla difesa antiaerea ucraina nei pressi di Reni; due F-18 spagnoli sono decollati da Mihail Kogălniceanu. Gli allarmi sono terminati alle 19:03 e poi alle 21:14."}}},{id:"EVEN2305",p:3,cat:1,seuil:"Non déterminé",passe:!1,date:"2026-10-14",entree:"2026-10-14",src:"https://www.devdiscourse.com/article/international/3992579-commercial-ship-catches-fire-in-romanian-waters-in-latest-black-sea-incident",txt:{fr:{nom:"Un pétrolier-chimiquier prend feu dans les eaux territoriales roumaines près de Sulina",pays:"Roumanie",lieu:"Mer territoriale roumaine, au large de Sulina",desc:"Le 14 octobre au soir, le Yara J, pétrolier-chimiquier sous pavillon des Comores, à l'ancre et sur lest dans la mer territoriale roumaine, à environ 9 milles nautiques à l'est de Câșla Vădanei, a signalé un incendie à bord, éteint selon les représentants du navire ; l'équipage est indemne. Le ministre de la Défense par intérim Radu Miruță a indiqué qu'aucun drone n'avait été vu sur les radars. Le 15 octobre, le président Nicușor Dan a affirmé que des navires avaient été frappés par des drones et jugé « évident » qu'il s'agissait de « tentatives de la Russie, en Roumanie et en Bulgarie, visant à déstabiliser nos sociétés », avant de reconnaître le lendemain ne pas pouvoir « dire techniquement, pour l'instant, qu'il s'agit de Russes »."},es:{nom:"Un petrolero-quimiquero se incendia en aguas territoriales rumanas cerca de Sulina",pays:"Rumanía",lieu:"Aguas territoriales rumanas, frente a Sulina",desc:"La noche del 14 de octubre, el Yara J, un petrolero-químico con pabellón de las Comoras, fondeado y con lastre en aguas territoriales rumanas, a unas 9 millas náuticas al este de Câșla Vădanei, informó de un incendio a bordo, que, según los representantes del buque, fue extinguido; la tripulación se encuentra ilesa. El ministro de Defensa en funciones, Radu Miruță, indicó que no se había avistado ningún dron en los radares. El 15 de octubre, el presidente Nicușor Dan afirmó que algunos buques habían sido atacados por drones y consideró «evidente» que se trataba de «intentos de Rusia, en Rumanía y en Bulgaria, destinados a desestabilizar nuestras sociedades», antes de reconocer al día siguiente que no podía «afirmar técnicamente, por el momento, que se trate de rusos»."},it:{nom:"Una petroliera-chimichiera prende fuoco nelle acque territoriali rumene vicino a Sulina",pays:"Romania",lieu:"Acque territoriali rumene, al largo di Sulina",desc:"La sera del 14 ottobre, la Yara J, petroliera-chimichiera battente bandiera delle Comore, all’ancora e a vuoto nelle acque territoriali rumene, a circa 9 miglia nautiche a est di Câșla Vădanei, ha segnalato un incendio a bordo, spento secondo quanto riferito dai rappresentanti della nave; l’equipaggio è illeso. Il ministro della Difesa ad interim Radu Miruță ha dichiarato che nessun drone era stato avvistato sui radar. Il 15 ottobre, il presidente Nicușor Dan ha affermato che alcune navi erano state colpite da droni e ha ritenuto «evidente» che si trattasse di «tentativi da parte della Russia, in Romania e in Bulgaria, volti a destabilizzare le nostre società», prima di ammettere il giorno successivo di non poter «affermare tecnicamente, per il momento, che si tratti di russi»."}}},{id:"EVEN2426",p:3,cat:2,seuil:"Suspecté",passe:!1,date:"2026-10-04",entree:"2026-10-15",src:"https://www.kyivpost.com/post/87936",txt:{fr:{nom:"Un recruteur offre jusqu'à 30 000 dollars et une décoration biélorusse pour un incendie à Gliwice",pays:"Pologne",lieu:"Gliwice",desc:"Selon une enquête du média russophone Vot Tak (TVP), dont des journalistes ont répondu sous couverture à une annonce sur un chat Telegram biélorusse, un recruteur utilisant un numéro russe cherchait des exécutants pour incendier l'usine Flytronic de Gliwice, qui produit des drones et des munitions rôdeuses utilisés par l'Ukraine. Il promettait 20 000 à 30 000 dollars et une décoration en Biélorussie. Le projet n'a pas été exécuté. Le 22 octobre, le parquet de Gliwice a ouvert une enquête pour tentative de recrutement en vue d'un sabotage au profit d'un service de renseignement étranger, confiée ensuite à l'ABW ; aucune arrestation n'a été annoncée. Vot Tak a recensé au moins 160 annonces similaires en un mois, surtout pour la Bulgarie, la Roumanie, la Pologne et la Slovaquie."},es:{nom:"Un reclutador ofrece hasta 30 000 dólares y una condecoración bielorrusa por provocar un incendio en Gliwice",pays:"Polonia",lieu:"Gliwice",desc:"Según una investigación del medio de comunicación en ruso Vot Tak (TVP), cuyos periodistas respondieron de forma encubierta a un anuncio publicado en un chat de Telegram bielorruso, un reclutador que utilizaba un número ruso buscaba personas que llevaran a cabo el incendio de la fábrica Flytronic de Gliwice, que produce drones y munición vagante utilizada por Ucrania. Prometía entre 20 000 y 30 000 dólares y una condecoración en Bielorrusia. El plan no se llevó a cabo. El 22 de octubre, la fiscalía de Gliwice abrió una investigación por intento de reclutamiento con fines de sabotaje en beneficio de un servicio de inteligencia extranjero, que posteriormente se encomendó a la ABW; no se ha anunciado ninguna detención. Vot Tak ha registrado al menos 160 anuncios similares en un mes, sobre todo para Bulgaria, Rumanía, Polonia y Eslovaquia."},it:{nom:"Un reclutatore offre fino a 30.000 dollari e un'onorificenza bielorussa per un incendio a Gliwice",pays:"Polonia",lieu:"Gliwice",desc:"Secondo un’inchiesta del media russofono Vot Tak (TVP), i cui giornalisti hanno risposto sotto copertura a un annuncio pubblicato su una chat di Telegram bielorussa, un reclutatore che utilizzava un numero russo cercava esecutori per appiccare un incendio allo stabilimento Flytronic di Gliwice, che produce droni e munizioni vaganti utilizzate dall’Ucraina. Prometteva da 20.000 a 30.000 dollari e un’onorificenza in Bielorussia. Il piano non è stato portato a termine. Il 22 ottobre, la procura di Gliwice ha avviato un’indagine per tentato reclutamento ai fini di sabotaggio a favore di un servizio di intelligence straniero, successivamente affidata all’ABW; non è stato annunciato alcun arresto. Vot Tak ha censito almeno 160 annunci simili in un mese, soprattutto per la Bulgaria, la Romania, la Polonia e la Slovacchia."}}},{id:"EVEN2322",p:3,cat:0,seuil:"Non déterminé",passe:!1,date:"2026-10-15",entree:"2026-10-15",src:"https://adevarul.ro/stiri-interne/evenimente/o-drona-a-intrat-in-spatiul-aerian-al-romaniei-in-2564100.html",txt:{fr:{nom:"Un drone détecté pendant une minute dans l'espace aérien roumain au sud-est de Sulina",pays:"Roumanie",lieu:"Au sud-est de Sulina",desc:"Dans la nuit du 14 au 15 octobre, à 1h34, un drone a été détecté pendant environ une minute dans l'espace aérien roumain, au-dessus des eaux territoriales au sud-est de Sulina, avant de disparaître des radars. Dans la même nuit, deux F-16 roumains ont été mobilisés après la détection d'autres cibles à environ 77 km à l'est de l'île aux Serpents ; un message RO-Alert a été envoyé aux habitants du nord et de l'est du comté de Tulcea à 4h57 et l'alerte a été levée à 5h46."},es:{nom:"Se detectó un dron durante un minuto en el espacio aéreo rumano, al sureste de Sulina",pays:"Rumanía",lieu:"Al sureste de Sulina",desc:"En la noche del 14 al 15 de octubre, a la 1:34, se detectó un dron durante aproximadamente un minuto en el espacio aéreo rumano, sobre las aguas territoriales al sureste de Sulina, antes de desaparecer de los radares. Esa misma noche, se movilizaron dos F-16 rumanos tras la detección de otros objetivos a unos 77 km al este de la Isla de las Serpientes; se envió un mensaje RO-Alert a los habitantes del norte y el este del condado de Tulcea a las 4:57 y la alerta se levantó a las 5:46."},it:{nom:"Un drone è stato rilevato per un minuto nello spazio aereo rumeno a sud-est di Sulina",pays:"Romania",lieu:"A sud-est di Sulina",desc:"Nella notte tra il 14 e il 15 ottobre, all’1:34, un drone è stato individuato per circa un minuto nello spazio aereo rumeno, sopra le acque territoriali a sud-est di Sulina, prima di scomparire dai radar. Nella stessa notte, due F-16 rumeni sono stati mobilitati in seguito al rilevamento di altri bersagli a circa 77 km a est dell’Isola dei Serpenti; alle 4:57 è stato inviato un messaggio RO-Alert agli abitanti della parte settentrionale e orientale della contea di Tulcea e l’allerta è stata revocata alle 5:46."}}},{id:"EVEN2328",p:3,cat:0,seuil:"Suspecté",passe:!1,date:"2026-10-15",entree:"2026-10-15",src:"https://tv8.md/2026/10/15/cerul-moldovei-incalcat-din-nou-in-toiul-noptii-o-drona-a-survolat-spatiul-aerian-timp-de-8-minute/310818",txt:{fr:{nom:"Un drone survole huit minutes le sud-est de la Moldavie lors des frappes russes sur l'Ukraine",pays:"Moldavie",lieu:"Purcari, raion de Ștefan Vodă",desc:"Dans la nuit du 14 au 15 octobre, pendant des frappes massives russes contre l'Ukraine, un drone venu de Hradenytsi (oblast d'Odessa) est entré à 1h43 dans l'espace aérien moldave en direction du village de Purcari, dans le raion de Ștefan Vodă, avant d'en ressortir à 1h51 vers Starokozache, en Ukraine, selon le ministère moldave de la Défense. Le type d'engin n'a pas été précisé."},es:{nom:"Un dron sobrevuela durante ocho minutos el sureste de Moldavia durante los ataques rusos contra Ucrania",pays:"Moldavia",lieu:"Purcari, raión de Ștefan Vodă",desc:"En la noche del 14 al 15 de octubre, durante los ataques masivos rusos contra Ucrania, un dron procedente de Hradenytsi (óblast de Odesa) entró a la 1:43 en el espacio aéreo moldavo en dirección al pueblo de Purcari, en el raion de Ștefan Vodă, antes de salir de él a la 1:51 h en dirección a Starokozache, en Ucrania, según el Ministerio de Defensa moldavo. No se ha especificado el tipo de aparato."},it:{nom:"Un drone sorvola per otto minuti il sud-est della Moldavia durante gli attacchi russi contro l’Ucraina",pays:"Moldavia",lieu:"Purcari, distretto di Ștefan Vodă",desc:"Nella notte tra il 14 e il 15 ottobre, durante i massicci attacchi russi contro l’Ucraina, un drone proveniente da Hradenytsi (oblast di Odessa) è entrato alle 01:43 nello spazio aereo moldavo in direzione del villaggio di Purcari, nel raion di Ștefan Vodă, per poi uscirne alle 1:51 in direzione di Starokozache, in Ucraina, secondo quanto riferito dal Ministero della Difesa moldavo. Il tipo di velivolo non è stato specificato."}}},{id:"EVEN2341",p:3,cat:1,seuil:"Non déterminé",passe:!1,date:"2026-10-15",entree:"2026-10-15",src:"https://www.insurancejournal.com/news/international/2026/10/16/889159.htm",txt:{fr:{nom:"Un chimiquier frappé par des drones au large de Sulina, sept marins disparus",pays:"Roumanie",lieu:"Au large de Sulina, à la limite des eaux territoriales roumaines",desc:"Le 15 octobre au matin, le Wine Trader, chimiquier sous pavillon de Saint-Marin venant de Tunisie, a pris feu à environ 13 à 14 milles nautiques de Sulina. Selon les autorités navales roumaines, sept des douze membres d'équipage ont été portés disparus ; les recherches n'avaient pas abouti le 19 octobre. Le président Nicușor Dan a affirmé que le navire avait été frappé par des drones et jugé « évident » qu'il s'agissait de « tentatives de la Russie, en Roumanie et en Bulgarie, visant à déstabiliser nos sociétés », avant de reconnaître le lendemain ne pas pouvoir « dire techniquement, pour l'instant, qu'il s'agit de Russes ». Le syndicat roumain des marins SLN, sur la base d'informations préliminaires, a avancé que les drones seraient des Geran russes. Le 7 novembre, le parquet de Varna annonce la découverte de restes humains très endommagés à bord, après le transfert du navire en Bulgarie ; une source policière bulgare a indiqué qu'il s'agirait très probablement de six personnes ; des analyses ADN ont été ordonnées."},es:{nom:"Un buque quimiquero atacado por drones frente a las costas de Sulina; siete marineros desaparecidos",pays:"Rumanía",lieu:"Frente a las costas de Sulina, en el límite de las aguas territoriales rumanas",desc:"La mañana del 15 de octubre, el Wine Trader, un buque químico con pabellón de San Marino procedente de Túnez, se incendió a unas 13 o 14 millas náuticas de Sulina. Según las autoridades navales rumanas, siete de los doce tripulantes figuraban como desaparecidos; las búsquedas no habían dado resultado el 19 de octubre. El presidente Nicușor Dan afirmó que el buque había sido atacado por drones y consideró «evidente» que se trataba de «intentos de Rusia, en Rumanía y en Bulgaria, destinados a desestabilizar nuestras sociedades», antes de reconocer al día siguiente que no podía «afirmar técnicamente, por el momento, que se trate de rusos». El sindicato rumano de marineros SLN, basándose en información preliminar, sugirió que los drones serían del modelo ruso Geran. El 7 de noviembre, la fiscalía de Varna anunció el hallazgo de restos humanos muy dañados a bordo, tras el traslado del buque a Bulgaria; una fuente policial búlgara indicó que, muy probablemente, se trataría de seis personas; se han ordenado análisis de ADN."},it:{nom:"Una nave cisterna colpita da droni al largo di Sulina, sette marinai dispersi",pays:"Romania",lieu:"Al largo di Sulina, al confine con le acque territoriali rumene",desc:"La mattina del 15 ottobre, la Wine Trader, una nave cisterna battente bandiera sammarinese proveniente dalla Tunisia, ha preso fuoco a circa 13-14 miglia nautiche da Sulina. Secondo le autorità navali rumene, sette dei dodici membri dell’equipaggio risultavano dispersi; le ricerche non avevano dato esito positivo al 19 ottobre. Il presidente Nicușor Dan ha affermato che la nave era stata colpita da droni e ha ritenuto «evidente» che si trattasse di «tentativi da parte della Russia, in Romania e in Bulgaria, volti a destabilizzare le nostre società», prima di ammettere il giorno successivo di non poter «affermare tecnicamente, per il momento, che si tratti di russi». Il sindacato rumeno dei marittimi SLN, sulla base di informazioni preliminari, ha ipotizzato che i droni fossero dei Geran russi. Il 7 novembre, la procura di Varna ha annunciato il ritrovamento di resti umani gravemente danneggiati a bordo, dopo il trasferimento della nave in Bulgaria; una fonte della polizia bulgara ha indicato che si tratterebbe molto probabilmente di sei persone; sono state disposte analisi del DNA."}}},{id:"EVEN2811",p:4,cat:3,seuil:"Suspecté",passe:!0,date:"2026-08-22",entree:"2026-10-20",src:"https://enrsi.stvr.sk/articles/news/458439/sis-officers-foil-alleged-arson-attack-in-eastern-slovakia",txt:{fr:{nom:"Un Letton extradé d'Allemagne est placé en détention en Slovaquie pour un projet d'incendie",pays:"Slovaquie",lieu:"Haniska, région de Prešov",desc:"Le 16 octobre, le tribunal de district de Prešov a placé en détention un Letton arrêté en Allemagne et remis à la Slovaquie le 15 octobre sur mandat d'arrêt européen, inculpé de « mise en danger générale » pour un projet d'incendie contre une usine de drones à Haniska, déjoué par la police le 22 août ; deux autres inculpés, un Letton et un Ukrainien, étaient déjà détenus. Le 26 septembre, la FAZ, citant des sources de sécurité, a rapporté que les enquêteurs allemands rattachaient ce projet à un groupe lié au GRU opérant depuis la Slovaquie ; les autorités slovaques n'ont pas nommé la Russie."},es:{nom:"Un letón extraditado desde Alemania queda detenido en Eslovaquia por un intento de incendio",pays:"Eslovaquia",lieu:"Haniska, región de Prešov",desc:"El 16 de octubre, el tribunal de distrito de Prešov dictó prisión preventiva para un letón detenido en Alemania y entregado a Eslovaquia el 15 de octubre en virtud de una orden de detención europea, acusado de «poner en peligro la seguridad pública» por un plan para incendiar una fábrica de drones en Haniska, frustrado por la policía el 22 de agosto; otros dos acusados, un letón y un ucraniano, ya se encontraban detenidos. El 26 de septiembre, el FAZ, citando fuentes de seguridad, informó de que los investigadores alemanes relacionaban este plan con un grupo vinculado al GRU que operaba desde Eslovaquia; las autoridades eslovacas no mencionaron a Rusia."},it:{nom:"Un lettone estradato dalla Germania è stato posto in stato di detenzione in Slovacchia per un tentativo di incendio",pays:"Slovacchia",lieu:"Haniska, regione di Prešov",desc:"Il 16 ottobre, il tribunale distrettuale di Prešov ha disposto la custodia cautelare nei confronti di un cittadino lettone arrestato in Germania e consegnato alla Slovacchia il 15 ottobre in base a un mandato d’arresto europeo, accusato di «pericolo pubblico» per un piano di incendio contro uno stabilimento di droni a Haniska, sventato dalla polizia il 22 agosto; altri due imputati, un lettone e un ucraino, erano già in custodia. Il 26 settembre, la FAZ, citando fonti della sicurezza, ha riferito che gli investigatori tedeschi collegavano questo piano a un gruppo legato al GRU operante dalla Slovacchia; le autorità slovacche non hanno menzionato la Russia."}}},{id:"EVEN2562",p:4,cat:0,seuil:"Suspecté",passe:!1,date:"2026-10-16",entree:"2026-10-20",src:"https://ipn.md/en/four-drones-illegally-entered-moldovas-airspace-one-of-them-flew-over-the-country-twice/",txt:{fr:{nom:"Un drone s'écrase et explose à Dondușeni après des violations de l'espace aérien moldave",pays:"Moldavie",lieu:"Raion de Dondușeni, nord du pays",desc:"Dans la nuit du 15 au 16 octobre, quatre drones sont entrés à cinq reprises dans l'espace aérien moldave, entre 23h02 et 6h09, selon le ministère de la Défense, pendant les frappes massives russes contre l'Ukraine. Le 16 octobre, un drone s'est écrasé et a explosé dans un champ entre Codrenii Noi et Scăieni (Dondușeni) : la police y a trouvé un cratère, un moteur, un réservoir et des fragments, sans victime. Le ministère des Affaires étrangères a dénoncé « une violation grave de la souveraineté et de l'intégrité territoriale » ; ni le modèle ni l'origine de l'appareil n'ont été précisés."},es:{nom:"Un dron se estrella y explota en Dondușeni tras varias violaciones del espacio aéreo moldavo",pays:"Moldavia",lieu:"Raión de Dondușeni, al norte del país",desc:"En la noche del 15 al 16 de octubre, cuatro drones penetraron en cinco ocasiones en el espacio aéreo moldavo, entre las 23:02 y las 6:09, según el Ministerio de Defensa, durante los ataques masivos rusos contra Ucrania. El 16 de octubre, un dron se estrelló y explotó en un campo entre Codrenii Noi y Scăieni (Dondușeni): la policía encontró allí un cráter, un motor, un depósito y fragmentos, sin que se registraran víctimas. El Ministerio de Asuntos Exteriores denunció «una grave violación de la soberanía y la integridad territorial»; no se han precisado ni el modelo ni el origen del aparato."},it:{nom:"Un drone si schianta ed esplode a Dondușeni dopo aver violato lo spazio aereo moldavo",pays:"Moldavia",lieu:"Distretto di Dondușeni, nel nord del Paese",desc:"Nella notte tra il 15 e il 16 ottobre, quattro droni hanno violato per cinque volte lo spazio aereo moldavo, tra le 23:02 e le 6:09, secondo quanto riferito dal Ministero della Difesa, durante i massicci attacchi russi contro l’Ucraina. Il 16 ottobre, un drone si è schiantato ed è esploso in un campo tra Codrenii Noi e Scăieni (Dondușeni): la polizia ha rinvenuto sul posto un cratere, un motore, un serbatoio e alcuni frammenti; non si registrano vittime. Il Ministero degli Affari Esteri ha denunciato «una grave violazione della sovranità e dell’integrità territoriale»; non sono stati specificati né il modello né l’origine del velivolo."}}},{id:"EVEN2608",p:4,cat:0,seuil:"Non déterminé",passe:!1,date:"2026-10-17",entree:"2026-10-20",src:"https://www.realitatea.net/stiri/social/ro-alert-in-tulcea-avioane-f-18-ridicate-de-la-sol-dupa-detectarea-unei-tinte-aeriene-in-ucraina-aproape-de-romania-yxijtr",txt:{fr:{nom:"Deux F-18 espagnols décollent en Roumanie après la détection d'une cible aérienne près de Plauru",pays:"Roumanie",lieu:"Plauru, nord du comté de Tulcea",desc:"Dans la nuit du 16 au 17 octobre, un radar a détecté une cible aérienne au-dessus du territoire ukrainien se dirigeant vers la frontière roumaine, au nord de Plauru, ce qui a fait décoller deux F-18 espagnols de la base de Mihail Kogălniceanu. Un message RO-Alert a été envoyé à 1h54 aux habitants du nord du comté et l'alerte a été levée à 2h30. Le ministère de la Défense a indiqué qu'« aucune pénétration dans l'espace aérien national » n'avait été signalée."},es:{nom:"Dos F-18 españoles despegan en Rumanía tras la detección de un objetivo aéreo cerca de Plauru",pays:"Rumanía",lieu:"Plauru, al norte del condado de Tulcea",desc:"En la noche del 16 al 17 de octubre, un radar detectó un objetivo aéreo sobre territorio ucraniano que se dirigía hacia la frontera rumana, al norte de Plauru, lo que provocó el despegue de dos F-18 españoles desde la base de Mihail Kogălniceanu. A las 1:54 se envió un mensaje RO-Alert a los habitantes del norte del condado y la alerta se levantó a las 2:30. El Ministerio de Defensa indicó que «no se había señalado ninguna intrusión en el espacio aéreo nacional»."},it:{nom:"Due F-18 spagnoli decollano dalla Romania dopo l’individuazione di un bersaglio aereo nei pressi di Plauru",pays:"Romania",lieu:"Plauru, a nord della contea di Tulcea",desc:"Nella notte tra il 16 e il 17 ottobre, un radar ha rilevato un bersaglio aereo sopra il territorio ucraino diretto verso il confine rumeno, a nord di Plauru, il che ha provocato il decollo di due F-18 spagnoli dalla base di Mihail Kogălniceanu. Alle 1:54 è stato inviato un messaggio RO-Alert agli abitanti della parte settentrionale della contea e l’allerta è stata revocata alle 2:30. Il Ministero della Difesa ha precisato che non era stata segnalata «alcuna violazione dello spazio aereo nazionale»."}}},{id:"EVEN2619",p:4,cat:0,seuil:"Suspecté",passe:!1,date:"2026-10-17",entree:"2026-10-20",src:"https://agerpres.ro/social/2026/10/17/mapn-tintele-neutralizate-in-spatiul-aerian-national-erau-drone-de-atac-din-familia-geran--1604129",txt:{fr:{nom:"Deux F-16 roumains abattent deux drones Geran entrés dans les eaux territoriales près de Sulina",pays:"Roumanie",lieu:"Eaux territoriales, à l'est et au sud-est de Sulina, comté de Tulcea",desc:"Le 17 octobre, deux F-16 décollés de la base de Borcea ont abattu à 18h01 puis à 18h05, au sud-est puis à l'est de Sulina, deux drones d'attaque à réaction de la famille Geran, restés deux et cinq minutes dans l'espace aérien national selon le ministère de la Défense. Le ministre par intérim Radu Miruță a déclaré que leur vitesse de 450 km/h « nous fait penser qu'il s'agissait de drones Geran-4, de provenance russe » et que c'était la première fois que l'armée roumaine abattait de tels drones. Le ministère n'a pas désigné officiellement leur origine."},es:{nom:"Dos F-16 rumanos derriban dos drones Geran que habían entrado en aguas territoriales cerca de Sulina",pays:"Rumanía",lieu:"Aguas territoriales, al este y al sureste de Sulina, condado de Tulcea",desc:"El 17 de octubre, dos F-16 que despegaron de la base de Borcea derribaron, a las 18:01 y a las 18:05, al sureste y luego al este de Sulina, dos drones de ataque a reacción de la familia Geran, que permanecieron dos y cinco minutos en el espacio aéreo nacional, según el Ministerio de Defensa. El ministro en funciones, Radu Miruță, declaró que su velocidad de 450 km/h «nos hace pensar que se trataba de drones Geran-4, de procedencia rusa» y que era la primera vez que el ejército rumano derribaba drones de este tipo. El ministerio no ha especificado oficialmente su origen."},it:{nom:"Due F-16 rumeni abbattono due droni Geran entrati nelle acque territoriali nei pressi di Sulina",pays:"Romania",lieu:"Acque territoriali, a est e a sud-est di Sulina, contea di Tulcea",desc:"Il 17 ottobre, due F-16 decollati dalla base di Borcea hanno abbattuto alle 18:01 e poi alle 18:05, a sud-est e poi a est di Sulina, due droni d’attacco a reazione della famiglia Geran, rimasti rispettivamente due e cinque minuti nello spazio aereo nazionale secondo il Ministero della Difesa. Il ministro ad interim Radu Miruță ha dichiarato che la loro velocità di 450 km/h «ci fa pensare che si trattasse di droni Geran-4, di provenienza russa» e che fosse la prima volta che l’esercito rumeno abbattesse droni di questo tipo. Il ministero non ha indicato ufficialmente la loro provenienza."}}},{id:"EVEN2679",p:4,cat:3,seuil:"Suspecté",passe:!1,date:"2026-10-18",entree:"2026-10-20",src:"https://www.lrt.lt/en/news-in-english/19/3086054/attempted-arson-at-lithuanian-firm-storing-starlink-equipment-pm-blames-russia",txt:{fr:{nom:"Une tentative d'incendie contre un site lié à Starlink à Vilnius ; deux Allemands identifiés",pays:"Lituanie",lieu:"Vilnius",desc:"Dans la nuit du 17 au 18 octobre, des inconnus ont tenté d'incendier, avec des liquides inflammables, des antennes Starlink et une unité de contrôle dans une entreprise de la périphérie de Vilnius ; l'incendie a été rapidement éteint, avec des dégâts mineurs. Le chef du Centre national de gestion des crises a rattaché l'attaque à des incendies similaires en Pologne et en Bulgarie, qui « s'inscrivent dans des tentatives russes de perturber Starlink » ; le Premier ministre Mindaugas Sinkevičius a jugé « probable » que « la partie russe » soit le commanditaire. Le 29 octobre, la police criminelle a identifié deux Allemands, arrêtés en Allemagne et soupçonnés de terrorisme par le parquet de Vilnius. Aucun commanditaire n'a été désigné par la justice."},es:{nom:"Intento de incendio en una instalación relacionada con Starlink en Vilna; identificados dos alemanes",pays:"Lituania",lieu:"Vilna",desc:"En la noche del 17 al 18 de octubre, unos desconocidos intentaron incendiar, con líquidos inflamables, unas antenas de Starlink y una unidad de control en una empresa de las afueras de Vilna; el incendio se extinguió rápidamente y los daños fueron menores. El jefe del Centro Nacional de Gestión de Crisis relacionó el ataque con incendios similares en Polonia y Bulgaria, que «forman parte de los intentos rusos de perturbar el funcionamiento de Starlink»; el primer ministro Mindaugas Sinkevičius consideró «probable» que «la parte rusa» fuera la responsable. El 29 de octubre, la policía judicial identificó a dos alemanes, detenidos en Alemania y sospechosos de terrorismo por la fiscalía de Vilna. La justicia no ha señalado a ningún instigador."},it:{nom:"Tentativo di incendio contro una struttura collegata a Starlink a Vilnius; identificati due cittadini tedeschi",pays:"Lituania",lieu:"Vilnius",desc:"Nella notte tra il 17 e il 18 ottobre, alcuni sconosciuti hanno tentato di appiccare il fuoco, utilizzando liquidi infiammabili, alle antenne Starlink e a un’unità di controllo in un’azienda alla periferia di Vilnius; l’incendio è stato rapidamente domato, con danni di lieve entità. Il capo del Centro nazionale di gestione delle crisi ha collegato l’attacco a incendi simili avvenuti in Polonia e in Bulgaria, che «rientrano nei tentativi russi di ostacolare Starlink»; il primo ministro Mindaugas Sinkevičius ha ritenuto «probabile» che «la parte russa» ne sia il mandante. Il 29 ottobre, la polizia criminale ha identificato due cittadini tedeschi, arrestati in Germania e sospettati di terrorismo dalla procura di Vilnius. Nessun mandante è stato individuato dalla magistratura."}}},{id:"EVEN3047",p:4,cat:4,seuil:"Suspecté",passe:!1,date:"2026-10-19",entree:"2026-10-21",src:"https://www.dagensps.se/foretag/tva-ukrainare-misstankta-for-spionage-mot-danskt-dronarforetag/",txt:{fr:{nom:"Deux hommes arrêtés au Danemark pour avoir photographié le fabricant d'antidrones MyDefence",pays:"Danemark",lieu:"Nørresundby, Aalborg, Jutland-Nord",desc:"Le 19 octobre, la police du Jutland-Nord a arrêté deux Ukrainiens de 18 et 21 ans, soupçonnés d'espionnage pour avoir photographié les locaux de MyDefence, fabricant de systèmes antidrones, et envoyé les images à un utilisateur Telegram ; ils ont nié les faits. L'audience du 20 octobre à Aalborg s'est tenue à huis clos ; le tribunal n'a pas ordonné de détention provisoire mais a autorisé la police à les garder trois jours de plus. Selon Brussels Signal, les procureurs ont indiqué croire qu'un service de renseignement russe était impliqué, sans préciser lequel ; selon l'agence suédoise TT, les photos étaient destinées à un service russe. « C'est une affaire que nous prenons très au sérieux », a déclaré Sune Myrup, de la police du Jutland-Nord, qui enquêtait avec le PET."},es:{nom:"Detienen en Dinamarca a dos hombres por fotografiar a la empresa fabricante de sistemas antidrones MyDefence",pays:"Dinamarca",lieu:"Nørresundby, Aalborg, Jutlandia del Norte",desc:"El 19 de octubre, la policía de Jutlandia del Norte detuvo a dos ucranianos de 18 y 21 años, sospechosos de espionaje por haber fotografiado las instalaciones de MyDefence, fabricante de sistemas antidrones, y haber enviado las imágenes a un usuario de Telegram; ambos negaron los hechos. La vista del 20 de octubre en Aalborg se celebró a puerta cerrada; el tribunal no ordenó la prisión preventiva, pero autorizó a la policía a retenerlos tres días más. Según Brussels Signal, los fiscales indicaron que creían que estaba implicado un servicio de inteligencia ruso, sin precisar cuál; según la agencia sueca TT, las fotos estaban destinadas a un servicio ruso. «Es un asunto que nos tomamos muy en serio», declaró Sune Myrup, de la policía de Jutlandia del Norte, que investigaba junto con el PET."},it:{nom:"Due uomini arrestati in Danimarca per aver fotografato il produttore di antidroni MyDefence",pays:"Danimarca",lieu:"Nørresundby, Aalborg, Jutland settentrionale",desc:"Il 19 ottobre, la polizia dello Jutland settentrionale ha arrestato due ucraini di 18 e 21 anni, sospettati di spionaggio per aver fotografato i locali di MyDefence, produttore di sistemi antidroni, e aver inviato le immagini a un utente di Telegram; i due hanno negato i fatti. L’udienza del 20 ottobre ad Aalborg si è svolta a porte chiuse; il tribunale non ha disposto la custodia cautelare, ma ha autorizzato la polizia a trattenerli per altri tre giorni. Secondo Brussels Signal, i pubblici ministeri hanno dichiarato di ritenere che fosse coinvolto un servizio di intelligence russo, senza specificare quale; secondo l’agenzia svedese TT, le foto erano destinate a un servizio russo. «È un caso che prendiamo molto sul serio», ha dichiarato Sune Myrup, della polizia dello Jutland settentrionale, che stava indagando insieme al PET."}}},{id:"EVEN3141",p:4,cat:0,seuil:"Non déterminé",passe:!1,date:"2026-10-21",entree:"2026-10-21",src:"https://www.digi24.ro/stiri/actualitate/drona-prabusita-in-judetul-buzau-un-localnic-a-sunat-la-112-iar-specialistii-mapn-si-sri-fac-verificari-4002091",txt:{fr:{nom:"Des débris de drone sont découverts dans un champ de la commune de Robeasca, dans le comté de Buzău",pays:"Roumanie",lieu:"Robeasca, Moșești, comté de Buzău",desc:"Le 21 octobre, un habitant a signalé au 112 des débris de drone dans un champ près du village de Moșești, selon la maire Domnica Vlad ; le préfet Leonard Dimian a évoqué le fuselage et une partie du moteur, dispersés sur une centaine de mètres, et des spécialistes du ministère de la Défense et du SRI ont été dépêchés. Le type, la charge et l'origine de l'engin n'ont pas été établis. La date de chute n'a pas été déterminée : selon Spotmedia, le ministère de la Défense a estimé que les fragments pourraient provenir d'un incident plus ancien. Aucun élément explosif n'a été trouvé et l'engin ne semblait pas avoir été abattu par l'OTAN, selon le préfet."},es:{nom:"Se han hallado restos de un dron en un campo del municipio de Robeasca, en el condado de Buzău.",pays:"Rumanía",lieu:"Robeasca, Moșești, condado de Buzău",desc:"El 21 de octubre, un vecino alertó al 112 de la presencia de restos de un dron en un campo cercano al pueblo de Moșești, según la alcaldesa Domnica Vlad; el prefecto Leonard Dimian mencionó el fuselaje y una parte del motor, dispersos a lo largo de unos cien metros, y se envió a especialistas del Ministerio de Defensa y del SRI. No se han determinado el tipo, la carga ni el origen del aparato. Tampoco se ha determinado la fecha de la caída: según Spotmedia, el Ministerio de Defensa ha estimado que los fragmentos podrían proceder de un incidente anterior. No se han encontrado elementos explosivos y, según el prefecto, el aparato no parece haber sido derribado por la OTAN."},it:{nom:"Resti di un drone sono stati rinvenuti in un campo nel comune di Robeasca, nella contea di Buzău",pays:"Romania",lieu:"Robeasca, Moșești, contea di Buzău",desc:"Il 21 ottobre, secondo quanto riferito dalla sindaca Domnica Vlad, un residente ha segnalato al 112 la presenza di detriti di un drone in un campo vicino al villaggio di Moșești; il prefetto Leonard Dimian ha parlato della fusoliera e di una parte del motore, dispersi su un raggio di un centinaio di metri, e sono stati inviati sul posto esperti del Ministero della Difesa e dell’SRI. Il tipo, il carico e l’origine del velivolo non sono stati accertati. Non è stata determinata la data della caduta: secondo Spotmedia, il Ministero della Difesa ha ipotizzato che i frammenti potessero provenire da un incidente avvenuto in precedenza. Non è stato rinvenuto alcun materiale esplosivo e, secondo il prefetto, il velivolo non sembra essere stato abbattuto dalla NATO."}}},{id:"EVEN3214",p:4,cat:5,seuil:"Suspecté",passe:!1,date:"2026-10-17",entree:"2026-10-22",src:"https://alliance4europe.eu/report/eu-unrest-report-how-frances-october-2026-protests-were-manipulated-then-retold-abroad",txt:{fr:{nom:"Des réseaux russes exploitent les émeutes en France, selon Alliance4Europe et un rapport européen",pays:"France",lieu:"Paris",desc:"Selon la mise à jour du 6 novembre de son rapport, l'ONG Alliance4Europe juge « très probable » qu'un réseau de comptes ayant publié 639 messages coordonnés du 2 septembre au 14 octobre, puis environ 300 en 12 vagues du 21 octobre au 4 novembre, relève de l'opération russe Doppelgänger. Selon une évaluation interne du service diplomatique de l'Union, révélée par Reuters le 9 novembre, un réseau russe clandestin, « Operation Overload », a diffusé des vidéos usurpant des médias occidentaux pour viser le public français, afin de « dépeindre la direction française comme faible et de plus en plus autoritaire » ; le document n'a trouvé aucune preuve que Moscou ou d'autres acteurs aient provoqué ou aggravé les manifestations et a parlé d'« exploitation opportuniste ». Selon le ministère français des Affaires étrangères, les dix publications les plus vues sur X issues de « sphères prorusses » ont totalisé 2,8 millions de vues du 16 au 18 octobre. Reuters n'a pu vérifier aucun des deux rapports. Selon InformNapalm, des courriels obtenus par des hacktivistes ukrainiens montreraient un officier du GRU donnant à un agent en France des consignes sur les revendications des manifestants (11 et 15 octobre) ; leur authenticité n'est pas vérifiée."},es:{nom:"Las redes rusas se aprovechan de los disturbios en Francia, según Alliance4Europe y un informe europeo",pays:"Francia",lieu:"París",desc:"Según la actualización del 6 de noviembre de su informe, la ONG Alliance4Europe considera «muy probable» que una red de cuentas que publicó 639 mensajes coordinados entre el 2 de septiembre y el 14 de octubre, y posteriormente unos 300 en 12 oleadas entre el 21 de octubre y el 4 de noviembre, forme parte de la operación rusa «Doppelgänger». Según una evaluación interna del servicio diplomático de la Unión, revelada por Reuters el 9 de noviembre, una red clandestina rusa, «Operation Overload», difundió vídeos suplantando a medios de comunicación occidentales dirigidos al público francés, con el fin de «presentar al Gobierno francés como débil y cada vez más autoritario »; el documento no encontró pruebas de que Moscú u otros actores hubieran provocado o agravado las manifestaciones y habló de «aprovechamiento oportunista». Según el Ministerio de Asuntos Exteriores francés, las diez publicaciones más vistas en X procedentes de «ámbitos prorrusos» sumaron un total de 2,8 millones de visualizaciones entre el 16 y el 18 de octubre. Reuters no ha podido verificar ninguno de los dos informes. Según InformNapalm, unos correos electrónicos obtenidos por hacktivistas ucranianos mostrarían a un oficial del GRU dando instrucciones a un agente en Francia sobre las reivindicaciones de los manifestantes (11 y 15 de octubre); su autenticidad no ha sido verificada."},it:{nom:"Secondo Alliance4Europe e un rapporto europeo, alcune reti russe stanno sfruttando le rivolte in Francia",pays:"Francia",lieu:"Parigi",desc:"Secondo l’aggiornamento del 6 novembre del proprio rapporto, l’ONG Alliance4Europe ritiene «molto probabile» che una rete di account, che ha pubblicato 639 messaggi coordinati dal 2 settembre al 14 ottobre e poi circa 300 in 12 ondate dal 21 ottobre al 4 novembre, faccia parte dell’operazione russa Doppelgänger. Secondo una valutazione interna del servizio diplomatico dell’Unione, resa nota da Reuters il 9 novembre, una rete clandestina russa, denominata «Operation Overload», ha diffuso video che si spacciavano per quelli dei media occidentali per rivolgersi al pubblico francese, al fine di «dipingere la leadership francese come debole e sempre più autoritaria »; il documento non ha trovato alcuna prova che Mosca o altri attori abbiano provocato o aggravato le manifestazioni e ha parlato di «sfruttamento opportunistico». Secondo il ministero degli Affari esteri francese, i dieci post più visti su X provenienti da «ambienti filorussi» hanno totalizzato 2,8 milioni di visualizzazioni dal 16 al 18 ottobre. Reuters non ha potuto verificare nessuno dei due rapporti. Secondo InformNapalm, alcune e-mail ottenute da hacktivisti ucraini mostrerebbero un ufficiale del GRU che fornisce a un agente in Francia istruzioni sulle rivendicazioni dei manifestanti (11 e 15 ottobre); la loro autenticità non è stata verificata."}}},{id:"EVEN3280",p:4,cat:4,seuil:"Attribué",passe:!1,date:"2026-10-22",entree:"2026-10-22",src:"https://kyivindependent.com/germany-arrests-ukrainian-national-suspected-of-spying-for-russia/",txt:{fr:{nom:"Un Ukrainien arrêté en Allemagne, soupçonné d'avoir espionné l'industrie de défense européenne",pays:"Allemagne",lieu:"Oder-Spree, Brandebourg",desc:"Selon le parquet fédéral allemand, « Vadym Y. », de nationalité ukrainienne, a été arrêté le 22 octobre dans le district d'Oder-Spree. Il aurait collecté, pour un service de renseignement russe non nommé, des informations militaires sur la production de blindés, de munitions et d'explosifs et sur le flanc oriental de l'OTAN, notamment auprès de personnes de l'industrie de défense européenne ; une partie de ces informations était publique. Il serait en contact avec ce service, par un intermédiaire, depuis juillet 2025 au moins. Soupçonné d'activité d'agent de renseignement, il a été placé en détention provisoire (annoncée le 23 octobre) ; l'enquête reposait sur des informations du BfV. Le 22 octobre, Friedrich Merz a déclaré que l'espionnage des services russes en Allemagne restait à un niveau constamment élevé."},es:{nom:"Detienen en Alemania a un ucraniano, sospechoso de haber espiado a la industria de defensa europea",pays:"Alemania",lieu:"Oder-Spree, Brandeburgo",desc:"Según la Fiscalía Federal alemana, «Vadym Y.», de nacionalidad ucraniana, fue detenido el 22 de octubre en el distrito de Oder-Spree. Al parecer, habría recopilado, para un servicio de inteligencia ruso no identificado, información militar sobre la producción de vehículos blindados, municiones y explosivos, así como sobre el flanco oriental de la OTAN, en particular a través de personas del sector de la defensa europeo; parte de esta información era de dominio público. Al parecer, llevaba en contacto con dicho servicio, a través de un intermediario, al menos desde julio de 2025. Sospechoso de ejercer como agente de inteligencia, fue puesto en prisión preventiva (anunciada el 23 de octubre); la investigación se basó en información facilitada por la BfV. El 22 de octubre, Friedrich Merz declaró que el espionaje de los servicios rusos en Alemania se mantenía en un nivel constantemente elevado."},it:{nom:"Arrestato in Germania un ucraino, sospettato di aver spiato l’industria della difesa europea",pays:"Germania",lieu:"Oder-Spree, Brandeburgo",desc:"Secondo la Procura federale tedesca, «Vadym Y.», di nazionalità ucraina, è stato arrestato il 22 ottobre nel distretto di Oder-Spree. Avrebbe raccolto, per conto di un servizio di intelligence russo non identificato, informazioni militari sulla produzione di veicoli corazzati, munizioni ed esplosivi e sul fianco orientale della NATO, in particolare da persone operanti nell’industria della difesa europea; parte di queste informazioni era di dominio pubblico. Sarebbe in contatto con tale servizio, tramite un intermediario, almeno dal luglio 2025. Sospettato di attività di spionaggio, è stato posto in custodia cautelare (annunciata il 23 ottobre); l’indagine si basava su informazioni fornite dal BfV. Il 22 ottobre, Friedrich Merz ha dichiarato che lo spionaggio dei servizi russi in Germania rimane a un livello costantemente elevato."}}},{id:"EVEN3514",p:5,cat:0,seuil:"Non déterminé",passe:!1,date:"2026-10-18",entree:"2026-10-26",src:"https://eng.lsm.lv/article/society/defence/24.10.2026-crashed-drone-found-in-aluksne-district.a668940/",txt:{fr:{nom:"Un drone s'est écrasé à Liepna ; la carcasse retrouvée à Alūksne est d'origine indéterminée",pays:"Lettonie",lieu:"Liepna, district d'Alūksne",desc:"Le 18 octobre, l'armée lettone a reçu des signalements d'un bruit « de type explosion » dans la commune de Liepna et relevé la trace possible d'un objet non identifié dans l'espace aérien ; les recherches ont été abandonnées après deux jours. Le 24 octobre, un drone a été retrouvé dans la commune ; la police d'État a confirmé qu'il s'agissait d'un aéronef sans pilote. Les forces armées ont ouvert une enquête sur son origine et les circonstances et ont lancé une revue interne ; aucune autorité ne l'a attribué à un pays. La date de la chute (18 octobre) a été estimée par les forces armées."},es:{nom:"Un dron se ha estrellado en Liepna; los restos hallados en Alūksne son de origen indeterminado",pays:"Letonia",lieu:"Liepna, distrito de Alūksne",desc:"El 18 de octubre, el ejército letón recibió avisos de un ruido «similar a una explosión» en el municipio de Liepna y detectó el posible rastro de un objeto no identificado en el espacio aéreo; las búsquedas se suspendieron al cabo de dos días. El 24 de octubre se encontró un dron en el municipio; la policía estatal confirmó que se trataba de una aeronave no tripulada. Las Fuerzas Armadas han abierto una investigación sobre su origen y las circunstancias y han iniciado una revisión interna; ninguna autoridad lo ha atribuido a ningún país. La fecha de la caída (18 de octubre) ha sido estimada por las Fuerzas Armadas."},it:{nom:"Un drone si è schiantato a Liepna; il relitto ritrovato ad Alūksne è di origine indeterminata",pays:"Lettonia",lieu:"Liepna, distretto di Alūksne",desc:"Il 18 ottobre, l’esercito lettone ha ricevuto segnalazioni di un rumore «simile a un’esplosione» nel comune di Liepna e ha rilevato la possibile traccia di un oggetto non identificato nello spazio aereo; le ricerche sono state interrotte dopo due giorni. Il 24 ottobre, nel comune è stato rinvenuto un drone; la polizia di Stato ha confermato che si trattava di un velivolo senza pilota. Le forze armate hanno avviato un’indagine sulla sua provenienza e sulle circostanze e hanno avviato una revisione interna; nessuna autorità lo ha attribuito a un Paese specifico. La data della caduta (18 ottobre) è stata stimata dalle forze armate."}}},{id:"EVEN3369",p:5,cat:4,seuil:"Non déterminé",passe:!1,date:"2026-10-23",entree:"2026-10-26",src:"https://www.cp24.com/news/world/2026/10/23/austria-expels-4-russian-diplomats-linked-to-espionage-official-says/",txt:{fr:{nom:"Quatre diplomates russes sont expulsés d'Autriche pour des activités incompatibles avec leur statut",pays:"Autriche",lieu:"Vienne",desc:"Le 23 octobre, le ministère autrichien des Affaires étrangères a déclaré persona non grata quatre diplomates russes, auxquels il a reproché des activités incompatibles avec leur statut diplomatique (formule rapportée par l'AP) ; trois travaillaient à l'ambassade de Russie à Vienne et un à la mission russe auprès de l'OSCE. Le ministère a invoqué des conclusions des autorités de sécurité autrichiennes sans donner d'autre détail ; un responsable autrichien, cité sous couvert d'anonymat par l'AP, a évoqué des faits liés à l'espionnage. Le ministère leur a demandé de quitter le pays « dans les prochains jours ». Le vice-ministre russe des Affaires étrangères Dmitri Lioubinski a déclaré à TASS qu'une réaction était inévitable ; l'ambassade de Russie à Vienne a tenu le même propos."},es:{nom:"Cuatro diplomáticos rusos son expulsados de Austria por actividades incompatibles con su condición diplomática",pays:"Austria",lieu:"Viena",desc:"El 23 de octubre, el Ministerio de Asuntos Exteriores austriaco declaró persona non grata a cuatro diplomáticos rusos, a quienes acusó de actividades incompatibles con su estatuto diplomático (formulación recogida por la AP); tres de ellos trabajaban en la embajada de Rusia en Viena y uno en la misión rusa ante la OSCE. El ministerio se basó en las conclusiones de las autoridades de seguridad austriacas sin dar más detalles; un responsable austriaco, citado bajo condición de anonimato por la AP, aludió a hechos relacionados con el espionaje. El ministerio les pidió que abandonaran el país «en los próximos días». El viceministro ruso de Asuntos Exteriores, Dmitri Liubinski, declaró a TASS que una reacción era inevitable; la embajada de Rusia en Viena se expresó en el mismo sentido."},it:{nom:"Quattro diplomatici russi sono stati espulsi dall’Austria per attività incompatibili con il loro status",pays:"Austria",lieu:"Vienna",desc:"Il 23 ottobre, il Ministero degli Affari Esteri austriaco ha dichiarato persona non grata quattro diplomatici russi, ai quali ha contestato attività incompatibili con il loro status diplomatico (formulazione riportata dall’AP); tre lavoravano presso l’ambasciata russa a Vienna e uno presso la missione russa presso l’OSCE. Il ministero ha fatto riferimento alle conclusioni delle autorità di sicurezza austriache senza fornire ulteriori dettagli; un funzionario austriaco, citato in forma anonima dall’AP, ha accennato a fatti legati allo spionaggio. Il ministero ha chiesto loro di lasciare il Paese «nei prossimi giorni». Il viceministro degli Affari esteri russo Dmitri Lioubinski ha dichiarato alla TASS che una reazione era inevitabile; l’ambasciata russa a Vienna ha ribadito lo stesso concetto."}}},{id:"EVEN3375",p:5,cat:1,seuil:"Non déterminé",passe:!1,date:"2026-10-23",entree:"2026-10-26",src:"https://www.aljazeera.com/news/2026/10/23/romania-blames-russia-after-drone-sinks-ship-in-the-black-sea",txt:{fr:{nom:"Un cargo frappé par un drone coule près de Constanța : un marin mort et trois disparus",pays:"Roumanie",lieu:"Mer Noire, à environ 13 milles nautiques à l'est de Constanța",desc:"Le 23 octobre au matin, le Khoryv, cargo sous pavillon des Comores faisant route vers Sulina avec 13 membres d'équipage, a été touché par un drone, selon le président roumain Nicușor Dan, à environ 13 milles nautiques de Constanța, juste au-delà des eaux territoriales. Le navire a chaviré puis coulé. Un marin est mort, neuf ont été secourus et trois ont été portés disparus ; les recherches ont été suspendues le 24 octobre au soir faute de visibilité. Nicușor Dan a vu dans l'attaque une conséquence de l'agression russe contre l'Ukraine et un épisode de l'escalade de la Russie, mais n'a pas qualifié le drone de russe ; le Premier ministre Luca Niculescu a parlé d'une violation flagrante du droit international. Aucune analyse technique du drone ni réaction russe n'avait été rapportée au 26 octobre."},es:{nom:"Un buque de carga, alcanzado por un dron, se hunde cerca de Constanza: un marinero muerto y tres desaparecidos",pays:"Rumanía",lieu:"Mar Negro, a unas 13 millas náuticas al este de Constanza",desc:"La mañana del 23 de octubre, el Khoryv, un carguero con pabellón de las Comoras que se dirigía a Sulina con 13 tripulantes a bordo, fue alcanzado por un dron, según el presidente rumano Nicușor Dan, a unas 13 millas náuticas de Constanza, justo más allá de las aguas territoriales. El buque volcó y posteriormente se hundió. Un marinero falleció, nueve fueron rescatados y tres quedaron en paradero desconocido; las labores de búsqueda se suspendieron la noche del 24 de octubre debido a la falta de visibilidad. Nicușor Dan consideró que el ataque era una consecuencia de la agresión rusa contra Ucrania y un episodio de la escalada de Rusia, pero no calificó el dron de ruso; el primer ministro Luca Niculescu habló de una violación flagrante del derecho internacional. A fecha de 26 de octubre no se había informado de ningún análisis técnico del dron ni de ninguna reacción por parte de Rusia."},it:{nom:"Una nave da carico colpita da un drone affonda nei pressi di Costanza: un marinaio morto e tre dispersi",pays:"Romania",lieu:"Mare Nero, a circa 13 miglia nautiche a est di Costanza",desc:"La mattina del 23 ottobre, la Khoryv, una nave da carico battente bandiera delle Comore diretta a Sulina con 13 membri dell’equipaggio, è stata colpita da un drone, secondo quanto riferito dal presidente rumeno Nicușor Dan, a circa 13 miglia nautiche da Costanza, appena oltre le acque territoriali. La nave si è capovolta e poi è affondata. Un marinaio è morto, nove sono stati tratti in salvo e tre risultano dispersi; le ricerche sono state sospese la sera del 24 ottobre a causa della scarsa visibilità. Nicușor Dan ha visto nell’attacco una conseguenza dell’aggressione russa contro l’Ucraina e un episodio dell’escalation da parte della Russia, ma non ha definito il drone come russo; il primo ministro Luca Niculescu ha parlato di una flagrante violazione del diritto internazionale. Al 26 ottobre non erano state riportate né analisi tecniche del drone né reazioni da parte della Russia."}}},{id:"EVEN3416",p:5,cat:0,seuil:"Attribué",passe:!1,date:"2026-10-23",entree:"2026-10-26",src:"https://euromaidanpress.com/2026/10/23/moldova-expels-russian-diplomat-after-geran-drone-crashes/",txt:{fr:{nom:"Un drone Geran s'écrase en Moldavie ; Chișinău expulse un employé de l'ambassade de Russie",pays:"Moldavie",lieu:"Chiștelnița, raion de Telenești",desc:"Le 23 octobre, un drone s'est écrasé à moins de 100 mètres d'une habitation à Chiștelnița (raion de Telenești), près d'une installation énergétique, sans faire de victime ; le ministère moldave de la Défense l'avait détecté à son entrée depuis la région ukrainienne de Vinnytsia. La présidente Maia Sandu a déclaré qu'un drone d'attaque russe de type Geran avait violé l'espace aérien moldave et qu'un employé de l'ambassade de Russie avait été déclaré persona non grata ; son identité n'a pas été rendue publique. Le 24 octobre, la porte-parole du ministère russe des Affaires étrangères, Maria Zakharova, a dénoncé une décision « sans fondement », aucune preuve de l'origine russe n'ayant été présentée, et promis une « réponse adéquate et ferme »."},es:{nom:"Un dron Geran se estrella en Moldavia; Chișinău expulsa a un empleado de la embajada de Rusia",pays:"Moldavia",lieu:"Chiștelnița, distrito de Telenești",desc:"El 23 de octubre, un dron se estrelló a menos de 100 metros de una vivienda en Chiștelnița (distrito de Telenești), cerca de una instalación energética, sin causar víctimas; el Ministerio de Defensa moldavo lo había detectado al entrar desde la región ucraniana de Vinnytsia. La presidenta Maia Sandu declaró que un dron de ataque ruso del tipo Geran había violado el espacio aéreo moldavo y que un empleado de la embajada de Rusia había sido declarado persona non grata; su identidad no se ha hecho pública. El 24 de octubre, la portavoz del Ministerio de Asuntos Exteriores ruso, Maria Zakharova, denunció una decisión «infundada», ya que no se había presentado ninguna prueba del origen ruso, y prometió una «respuesta adecuada y firme»."},it:{nom:"Un drone Geran si schianta in Moldavia; Chișinău espelle un dipendente dell’ambasciata russa",pays:"Moldavia",lieu:"Chiștelnița, distretto di Telenești",desc:"Il 23 ottobre, un drone si è schiantato a meno di 100 metri da un'abitazione a Chiștelnița (raion di Telenești), nei pressi di un impianto energetico, senza causare vittime; il Ministero della Difesa moldavo lo aveva individuato mentre entrava nel territorio nazionale dalla regione ucraina di Vinnytsia. La presidente Maia Sandu ha dichiarato che un drone d’attacco russo del tipo Geran aveva violato lo spazio aereo moldavo e che un dipendente dell’ambasciata russa era stato dichiarato persona non grata; la sua identità non è stata resa pubblica. Il 24 ottobre, la portavoce del Ministero degli Affari Esteri russo, Maria Zakharova, ha denunciato una decisione «infondata», poiché non era stata presentata alcuna prova dell’origine russa, e ha promesso una «risposta adeguata e ferma»."}}},{id:"EVEN3844",p:5,cat:2,seuil:"Suspecté",passe:!1,date:"2026-10-07",entree:"2026-10-29",src:"https://www.nordbayern.de/schlagzeilen/sabotageplan-in-nurnberg-zwei-mutmassliche-agenten-in-untersuchungshaft-1.15332611",txt:{fr:{nom:"Deux Biélorusses détenus en Allemagne pour un projet d'incendie sont aussi visés par la Roumanie",pays:"Allemagne",lieu:"Région de Nuremberg, Bavière",desc:"Le 28 octobre, le parquet général de Munich a annoncé que deux Biélorusses de 39 et 50 ans étaient en détention provisoire depuis le 7 octobre. Ils sont soupçonnés d'avoir planifié, avec des accélérants, l'incendie d'un bâtiment ou d'une infrastructure critique de la région de Nuremberg, pour le compte d'un gouvernement ou d'une organisation étrangers et contre rémunération ; le parquet n'a pas nommé le pays commanditaire. La Roumanie, qui a demandé leur extradition, les visait aussi dans une procédure. Le 26 octobre, le SRI roumain a annoncé avoir identifié un réseau de sabotage coordonné depuis la Russie, impliqué dans l'incendie du 14 septembre à Brașov, sans citer les deux hommes. Selon Der Spiegel, ils agissaient pour la Russie."},es:{nom:"Dos bielorrusos detenidos en Alemania por un intento de incendio también son objeto de investigación por parte de Rumanía",pays:"Alemania",lieu:"Región de Núremberg, Baviera",desc:"El 28 de octubre, la Fiscalía General de Múnich anunció que dos bielorrusos de 39 y 50 años se encontraban en prisión preventiva desde el 7 de octubre. Se les sospecha de haber planeado, utilizando acelerantes, el incendio de un edificio o una infraestructura crítica de la región de Núremberg, por encargo de un gobierno u organización extranjeros y a cambio de una remuneración; la fiscalía no ha revelado el nombre del país que lo encargó. Rumanía, que solicitó su extradición, también los tenía en el punto de mira en un procedimiento judicial. El 26 de octubre, el SRI rumano anunció que había identificado una red de sabotaje coordinada desde Rusia, implicada en el incendio del 14 de septiembre en Brașov, sin mencionar a los dos hombres. Según Der Spiegel, actuaban para Rusia."},it:{nom:"Due bielorussi detenuti in Germania per un tentativo di incendio sono ricercati anche dalla Romania",pays:"Germania",lieu:"Regione di Norimberga, Baviera",desc:"Il 28 ottobre, la Procura generale di Monaco di Baviera ha annunciato che due cittadini bielorussi di 39 e 50 anni si trovavano in custodia cautelare dal 7 ottobre. Sono sospettati di aver pianificato, utilizzando acceleranti, l’incendio di un edificio o di un’infrastruttura critica nella regione di Norimberga, per conto di un governo o di un’organizzazione straniera e a titolo oneroso; la procura non ha indicato il Paese mandante. Anche la Romania, che ne ha chiesto l’estradizione, li aveva messi sotto accusa in un procedimento. Il 26 ottobre, l’SRI rumeno ha annunciato di aver identificato una rete di sabotaggio coordinata dalla Russia, coinvolta nell’incendio del 14 settembre a Brașov, senza citare i due uomini. Secondo Der Spiegel, agivano per conto della Russia."}}},{id:"EVEN3866",p:5,cat:0,seuil:"Non déterminé",passe:!1,date:"2026-10-21",entree:"2026-10-29",src:"https://www.mediapool.bg/bulgaria/nameren-e-ruski-boen-dron-geran-na-plazha-krai-arapya/",txt:{fr:{nom:"Des restes d'un drone portant l'inscription « Geran » retrouvés sur une plage d'Arapya, en Bulgarie",pays:"Bulgarie",lieu:"Arapya, près de Tsarevo, oblast de Bourgas",desc:"Des restes d'un drone portant l'inscription « Геран » (Geran) ont été retrouvés sur une plage d'Arapya, au nord de Tsarevo, sur la côte bulgare de la mer Noire ; la découverte a été rendue publique le 28 octobre par des photos publiées sur Facebook, où Mediapool n'a relevé aucune manipulation. Selon le ministère bulgare de la Défense, une équipe de la Base navale de Bourgas a saisi les restes le 21 octobre sur la plage Popski, à Tsarevo ; l'origine de l'engin « devait être confirmée ». Aucune autorité n'a désigné la Russie ni établi de lien avec la frappe du 28 octobre contre le Contship Jet. La date de la chute n'a pas été déterminée."},es:{nom:"Se han hallado restos de un dron con la inscripción «Geran» en una playa de Arapya, en Bulgaria.",pays:"Bulgaria",lieu:"Arapya, cerca de Tsarevo, óblast de Burgas",desc:"Se han hallado restos de un dron con la inscripción «Геран» (Geran) en una playa de Arapya, al norte de Tsarevo, en la costa búlgara del mar Negro; el hallazgo se hizo público el 28 de octubre mediante unas fotos publicadas en Facebook, en las que Mediapool no detectó ningún tipo de manipulación. Según el Ministerio de Defensa búlgaro, un equipo de la Base Naval de Burgas se hizo cargo de los restos el 21 de octubre en la playa de Popski, en Tsarevo; el origen del artefacto «aún debía confirmarse». Ninguna autoridad ha señalado a Rusia ni ha establecido ningún vínculo con el ataque del 28 de octubre contra el Contship Jet. No se ha determinado la fecha de la caída."},it:{nom:"Resti di un drone recante la scritta «Geran» rinvenuti su una spiaggia di Arapya, in Bulgaria",pays:"Bulgaria",lieu:"Arapya, vicino a Tsarevo, oblast di Burgas",desc:"I resti di un drone recante la scritta «Геран» (Geran) sono stati rinvenuti su una spiaggia di Arapya, a nord di Tsarevo, sulla costa bulgara del Mar Nero; la scoperta è stata resa pubblica il 28 ottobre tramite foto pubblicate su Facebook, nelle quali Mediapool non ha rilevato alcuna manipolazione. Secondo il Ministero della Difesa bulgaro, una squadra della base navale di Burgas ha recuperato i resti il 21 ottobre sulla spiaggia di Popski, a Tsarevo; l’origine del velivolo «doveva essere confermata». Nessuna autorità ha indicato la Russia né ha stabilito un collegamento con l’attacco del 28 ottobre contro la Contship Jet. La data della caduta non è stata determinata."}}},{id:"EVEN3846",p:5,cat:2,seuil:"Non déterminé",passe:!1,date:"2026-10-22",entree:"2026-10-29",src:"https://hotnews.ro/atac-cibernetic-fara-precedent-in-republica-moldova-demisie-in-guvern-expert-ipoteza-pe-care-o-luam-in-calcul-este-federatia-rusa-2388905",txt:{fr:{nom:"Une cyberattaque contre des services moldaves expose les données d'environ 450 000 personnes",pays:"Moldavie",lieu:"Chișinău",desc:"Entre le 19 et le 23 octobre, des services publics numériques moldaves ont subi une cyberattaque : quelque 11 millions de requêtes ont visé près d'un million d'identifiants personnels. Le 6 novembre, la présidente Maia Sandu a confirmé une estimation révisée à la baisse : les données d'environ 450 000 personnes (750 000 d'abord) étaient exposées (état civil, santé, données financières) ; aucune donnée de carte bancaire ni modification des registres n'a été détectée. Maia Sandu a expliqué la faille par un défaut structurel de contrôle d'accès et a écarté un sabotage interne. Le 28 octobre, le Premier ministre Vasile Tofan a évoqué des « indices d'une campagne plus large impliquant des acteurs étatiques étrangers », sans nommer la Russie. Au 6 novembre, aucune attribution officielle n'avait été faite."},es:{nom:"Un ciberataque contra los servicios moldavos deja al descubierto los datos de unas 450 000 personas",pays:"Moldavia",lieu:"Chișinău",desc:"Entre el 19 y el 23 de octubre, los servicios públicos digitales de Moldavia sufrieron un ciberataque: se registraron unos 11 millones de solicitudes dirigidas a cerca de un millón de identificadores personales. El 6 de noviembre, la presidenta Maia Sandu confirmó una estimación revisada a la baja: los datos de unas 450 000 personas (750 000 en un primer momento) quedaron expuestos (datos del registro civil, sanitarios y financieros); no se detectaron datos de tarjetas bancarias ni modificaciones en los registros. Maia Sandu atribuyó la brecha a un fallo estructural en el control de acceso y descartó un sabotaje interno. El 28 de octubre, el primer ministro Vasile Tofan se refirió a «indicios de una campaña más amplia en la que estarían implicados actores estatales extranjeros», sin mencionar a Rusia. A fecha de 6 de noviembre, no se había atribuido oficialmente la autoría a nadie."},it:{nom:"Un attacco informatico contro i servizi moldavi espone i dati di circa 450.000 persone",pays:"Moldavia",lieu:"Chișinău",desc:"Tra il 19 e il 23 ottobre, i servizi pubblici digitali moldavi hanno subito un attacco informatico: circa 11 milioni di richieste hanno preso di mira quasi un milione di credenziali personali. Il 6 novembre, la presidente Maia Sandu ha confermato una stima rivista al ribasso: i dati di circa 450.000 persone (inizialmente 750.000) erano stati esposti (stato civile, salute, dati finanziari); non sono stati rilevati dati relativi alle carte di credito né modifiche ai registri. Maia Sandu ha attribuito la falla a un difetto strutturale nel controllo degli accessi e ha escluso un sabotaggio interno. Il 28 ottobre, il primo ministro Vasile Tofan ha parlato di «indizi di una campagna più ampia che coinvolge attori statali stranieri», senza nominare la Russia. Al 6 novembre, non era stata fatta alcuna attribuzione ufficiale."}}},{id:"EVEN3823",p:5,cat:1,seuil:"Suspecté",passe:!1,date:"2026-10-28",entree:"2026-10-29",src:"https://bntnews.bg/news/nova-ataka-v-cherno-more-konteinerovoz-e-atakuvan-s-dronove-krai-kaliakra-1419306news.html",txt:{fr:{nom:"Un porte-conteneurs frappé par des drones marins coule dans la ZEE bulgare",pays:"Bulgarie",lieu:"ZEE bulgare, à environ 21 milles nautiques au sud-est de Shabla",desc:"Le 28 octobre, le Contship Jet, porte-conteneurs sous pavillon libérien parti de Haïfa pour Constanța, a été touché dans la ZEE bulgare par des drones marins (trois, se
