lon le ministre de la Défense Dimitar Stoyanov), à environ 21 milles au sud-est de Shabla. Les 18 membres d'équipage ont été évacués sains et saufs ; le navire a coulé. Les ministres bulgare, roumain et turc de la Défense ont condamné les attaques sans nommer d'auteur. Selon la société Ambrey, le drone était « probablement une variante du modèle russe Murena-300S, ou un dérivé » ; aucune autorité n'a désigné de responsable. Moscou a nié toute implication. Une enquête a été ouverte."},es:{nom:"Un buque portacontenedores, alcanzado por drones marinos, se hunde en la ZEE búlgara",pays:"Bulgaria",lieu:"ZEE búlgara, a unas 21 millas náuticas al sureste de Shabla",desc:"El 28 de octubre, el Contship Jet, un buque portacontenedores con pabellón liberiano que había zarpado de Haifa con destino a Constanza, fue alcanzado en la ZEE búlgara por drones marinos (tres, según el ministro de Defensa, Dimitar Stoyanov), a unas 21 millas al sureste de Shabla. Los 18 tripulantes fueron evacuados sanos y salvos; el buque se hundió. Los ministros de Defensa de Bulgaria, Rumanía y Turquía condenaron los ataques sin señalar a ningún responsable. Según la empresa Ambrey, el dron era «probablemente una variante del modelo ruso Murena-300S, o un derivado»; ninguna autoridad ha señalado a ningún responsable. Moscú ha negado cualquier implicación. Se ha abierto una investigación."},it:{nom:"Una nave portacontainer colpita da droni marini affonda nella ZEE bulgara",pays:"Bulgaria",lieu:"ZEE bulgara, a circa 21 miglia nautiche a sud-est di Shabla",desc:"Il 28 ottobre, la Contship Jet, una nave portacontainer battente bandiera liberiana partita da Haifa alla volta di Costanza, è stata colpita nella ZEE bulgara da droni marini (tre, secondo il ministro della Difesa Dimitar Stoyanov), a circa 21 miglia a sud-est di Shabla. I 18 membri dell’equipaggio sono stati evacuati incolumi; la nave è affondata. I ministri della Difesa bulgaro, rumeno e turco hanno condannato gli attacchi senza nominare alcun responsabile. Secondo la società Ambrey, il drone era «probabilmente una variante del modello russo Murena-300S, o un suo derivato»; nessuna autorità ha indicato i responsabili. Mosca ha negato qualsiasi coinvolgimento. È stata avviata un’indagine."}}},{id:"EVEN4138",p:6,cat:4,seuil:"Non déterminé",passe:!1,date:"2026-10-30",entree:"2026-11-02",src:"https://www.tvp.info/96212062/dolnoslaskie-trzy-miesiace-aresztu-dla-rosjanina-podejrzanego-o-szpiegostwo",txt:{fr:{nom:"Un Russe de 55 ans est arrêté en Pologne pour avoir photographié des infrastructures ferroviaires",pays:"Pologne",lieu:"Świdnica, Basse-Silésie",desc:"La police de Basse-Silésie a annoncé le 30 octobre l'arrestation à Świdnica d'un Russe de 55 ans, repéré près d'un passage à niveau puis d'un viaduc ferroviaire alors qu'il photographiait des trains et des infrastructures. Il a été mis en examen pour activité pour le compte d'un service de renseignement étranger contre la Pologne et placé en détention provisoire pour trois mois. Selon la police, il détenait des centaines de milliers de fichiers, dont des photos d'infrastructures ferroviaires et de transport, y compris critiques, en Pologne et à l'étranger, et quatre passeports russes. Le ministre Tomasz Siemoniak a rappelé que des sabotages étaient commandités par les services russes depuis plus de trois ans, sans désigner de service pour cet homme. La date de l'arrestation n'a pas été précisée."},es:{nom:"Detienen en Polonia a un ruso de 55 años por fotografiar infraestructuras ferroviarias",pays:"Polonia",lieu:"Świdnica, Baja Silesia",desc:"La policía de Baja Silesia anunció el 30 de octubre la detención en Świdnica de un ruso de 55 años, avistado cerca de un paso a nivel y, posteriormente, de un viaducto ferroviario mientras fotografiaba trenes e infraestructuras. Se le ha imputado por actuar en nombre de un servicio de inteligencia extranjero contra Polonia y se le ha impuesto prisión preventiva durante tres meses. Según la policía, poseía cientos de miles de archivos, entre ellos fotografías de infraestructuras ferroviarias y de transporte —incluidas las de importancia estratégica— en Polonia y en el extranjero, así como cuatro pasaportes rusos. El ministro Tomasz Siemoniak recordó que los servicios rusos llevaban más de tres años ordenando actos de sabotaje, sin señalar a ningún servicio concreto en relación con este hombre. No se ha precisado la fecha de la detención."},it:{nom:"Un russo di 55 anni è stato arrestato in Polonia per aver fotografato infrastrutture ferroviarie",pays:"Polonia",lieu:"Świdnica, Bassa Slesia",desc:"Il 30 ottobre la polizia della Bassa Slesia ha annunciato l’arresto a Świdnica di un cittadino russo di 55 anni, individuato nei pressi di un passaggio a livello e successivamente di un viadotto ferroviario mentre fotografava treni e infrastrutture. È stato indagato per attività a favore di un servizio di intelligence straniero contro la Polonia e posto in custodia cautelare per tre mesi. Secondo la polizia, era in possesso di centinaia di migliaia di file, tra cui foto di infrastrutture ferroviarie e di trasporto, anche strategiche, in Polonia e all’estero, oltre a quattro passaporti russi. Il ministro Tomasz Siemoniak ha ricordato che da oltre tre anni i servizi russi commissionano atti di sabotaggio, senza tuttavia specificare quale servizio fosse coinvolto nel caso di quest’uomo. La data dell’arresto non è stata precisata."}}},{id:"EVEN4309",p:6,cat:0,seuil:"Non déterminé",passe:!1,date:"2026-10-31",entree:"2026-11-02",src:"https://www.pravda.com.ua/eng/news/2026/10/31/8060663/",txt:{fr:{nom:"Deux drones entrent dans l'espace aérien moldave depuis l'Ukraine pendant une attaque russe massive",pays:"Moldavie",lieu:"Rîbnița, Telenești, Călărași ; Soroca, Dondușeni et Edineț",desc:"Le 31 octobre, le ministère moldave de la Défense a signalé deux violations de l'espace aérien par des drones venus d'Ukraine, pendant une attaque russe massive. Le premier, détecté à 16h24 depuis la région d'Odessa, est entré vers Plopi (Transnistrie) puis a disparu des radars à 16h54 près de Călărași ; l'espace aérien du nord et du centre a été restreint. Le second, entré à 17h50 depuis la région de Vinnytsia, a survolé Soroca, Dondușeni et Edineț avant de repartir à 18h12. Aucun n'a été signalé comme abattu ou tombé, et les autorités n'en ont pas désigné l'exploitant. L'Institute for the Study of War a jugé ces drones « probablement russes » (évaluation d'analystes), en notant que ni Chișinău ni Bucarest n'ont mis en cause la Russie."},es:{nom:"Dos drones entran en el espacio aéreo moldavo desde Ucrania durante un ataque masivo ruso",pays:"Moldavia",lieu:"Rîbnița, Telenești, Călărași; Soroca, Dondușeni y Edineț",desc:"El 31 de octubre, el Ministerio de Defensa moldavo informó de dos violaciones del espacio aéreo por parte de drones procedentes de Ucrania, durante un ataque masivo ruso. El primero, detectado a las 16:24 desde la región de Odesa, entró por Plopi (Transnistria) y luego desapareció de los radares a las 16:54 cerca de Călărași; se restringió el espacio aéreo del norte y del centro. El segundo, que entró a las 17:50 procedente de la región de Vinnytsia, sobrevoló Soroca, Dondușeni y Edineț antes de retirarse a las 18:12. No se ha informado de que ninguno haya sido derribado o haya caído, y las autoridades no han identificado al operador. El Instituto para el Estudio de la Guerra ha calificado estos drones como «probablemente rusos» (según la valoración de los analistas), señalando que ni Chișinău ni Bucarest han culpado a Rusia."},it:{nom:"Due droni entrano nello spazio aereo moldavo dall’Ucraina durante un massiccio attacco russo",pays:"Moldavia",lieu:"Rîbnița, Telenești, Călărași; Soroca, Dondușeni ed Edineț",desc:"Il 31 ottobre, il Ministero della Difesa moldavo ha segnalato due violazioni dello spazio aereo da parte di droni provenienti dall’Ucraina, durante un massiccio attacco russo. Il primo, individuato alle 16:24 dalla regione di Odessa, è entrato nei pressi di Plopi (Transnistria) per poi scomparire dai radar alle 16:54 vicino a Călărași; lo spazio aereo settentrionale e centrale è stato sottoposto a restrizioni. Il secondo, entrato alle 17:50 dalla regione di Vinnytsia, ha sorvolato Soroca, Dondușeni ed Edineț prima di allontanarsi alle 18:12. Nessuno dei due è stato segnalato come abbattuto o precipitato, e le autorità non ne hanno identificato il gestore. L’Institute for the Study of War ha giudicato questi droni «probabilmente russi» (valutazione degli analisti), sottolineando che né Chișinău né Bucarest hanno accusato la Russia."}}},{id:"EVEN4314",p:6,cat:0,seuil:"Non déterminé",passe:!1,date:"2026-10-31",entree:"2026-11-02",src:"https://agerpres.ro/social/2026/10/31/mesaj-ro-alert-in-iasi-si-neamt-despre-posibila-incursiune-de-drona-dupa-ce-a-fost-detectata-de-rada--1608742",txt:{fr:{nom:"Deux drones entrent dans l'espace aérien roumain près de la Moldavie ; alertes dans six județe",pays:"Roumanie",lieu:"Iași, Neamț, Vaslui, Bacău, Botoșani, Suceava",desc:"Le 31 octobre en fin d'après-midi, des alertes RO-Alert ont été envoyées dans six județe du nord-est (Iași, Neamț, Vaslui, Bacău, Botoșani, Suceava) après la détection d'une cible aérienne à 10 km de la frontière moldave. Le ministre Radu Oprea a indiqué que deux drones avaient pénétré sans autorisation dans l'espace aérien roumain. Des F-16 et un hélicoptère ont décollé et l'espace aérien d'Iași a été fermé temporairement. Selon le ministère, l'un des drones est reparti et le second a été vu pour la dernière fois entre Vaslui et Bacău ; aucune chute n'a été signalée et les alertes ont pris fin à 19h19. Les autorités n'ont pas désigné l'auteur ; l'Institute for the Study of War les a jugés « probablement russes »."},es:{nom:"Dos drones penetran en el espacio aéreo rumano cerca de Moldavia; se activan las alertas en seis județe",pays:"Rumanía",lieu:"Iași, Neamț, Vaslui, Bacău, Botoșani, Suceava",desc:"El 31 de octubre, a última hora de la tarde, se enviaron alertas RO-Alert en seis județe del noreste (Iași, Neamț, Vaslui, Bacău, Botoșani, Suceava) tras la detección de un objetivo aéreo a 10 km de la frontera con Moldavia. El ministro Radu Oprea indicó que dos drones habían penetrado sin autorización en el espacio aéreo rumano. Despegaron varios F-16 y un helicóptero, y se cerró temporalmente el espacio aéreo de Iași. Según el ministerio, uno de los drones se retiró y el segundo fue avistado por última vez entre Vaslui y Bacău; no se ha informado de ninguna caída y las alertas finalizaron a las 19:19. Las autoridades no han identificado al responsable; el Instituto para el Estudio de la Guerra los ha calificado de «probablemente rusos»."},it:{nom:"Due droni entrano nello spazio aereo rumeno vicino alla Moldavia; allerta in sei județe",pays:"Romania",lieu:"Iași, Neamț, Vaslui, Bacău, Botoșani, Suceava",desc:"Nel tardo pomeriggio del 31 ottobre sono stati inviati allarmi RO-Alert in sei județe del nord-est (Iași, Neamț, Vaslui, Bacău, Botoșani, Suceava) in seguito al rilevamento di un bersaglio aereo a 10 km dal confine moldavo. Il ministro Radu Oprea ha dichiarato che due droni avevano penetrato senza autorizzazione lo spazio aereo rumeno. Sono decollati alcuni F-16 e un elicottero e lo spazio aereo di Iași è stato temporaneamente chiuso. Secondo il ministero, uno dei droni si è allontanato e il secondo è stato avvistato per l’ultima volta tra Vaslui e Bacău; non sono state segnalate cadute e gli allarmi sono cessati alle 19:19. Le autorità non hanno identificato il responsabile; l’Institute for the Study of War li ha giudicati «probabilmente russi»."}}},{id:"EVEN4394",p:6,cat:0,seuil:"Suspecté",passe:!1,date:"2026-11-01",entree:"2026-11-02",src:"https://eng.lsm.lv/article/society/defence/01.11.2026-air-alert-in-ludza-and-kraslava-municipalities-of-latvia-is-over.a669214/",txt:{fr:{nom:"Un drone signalé dans l'espace aérien letton, alerte à Ludza et Krāslava ; il repart vers la Russie",pays:"Lettonie",lieu:"Ludza et Krāslava, Latgale",desc:"Le 1er novembre à 18h57, l'armée lettone (NBS) a déclaré une alerte aérienne pour les municipalités de Ludza et de Krāslava. L'appareil a quitté l'espace aérien letton à 19h16 en franchissant la frontière russe ; le drone intercepteur BLAZE, déployé, s'est autodétruit à 19h19, provoquant le bruit d'explosion entendu par les habitants. Le 3 novembre, après analyse de ses capteurs et consultation de partenaires ukrainiens, le NBS a conclu que l'appareil était le plus probablement un drone russe de type Geran ; il n'a pas pu dire s'il portait des explosifs. Dans la nuit du 2 au 3 novembre, une nouvelle alerte a été déclarée à Balvi et Ludza pour un drone ressemblant, selon le NBS, à ceux des forces ukrainiennes, d'origine non confirmée."},es:{nom:"Se ha detectado un dron en el espacio aéreo letón; alerta en Ludza y Krāslava; se dirige de nuevo hacia Rusia",pays:"Letonia",lieu:"Ludza y Krāslava, Latgale",desc:"El 1 de noviembre a las 18:57, el ejército letón (NBS) declaró una alerta aérea para los municipios de Ludza y Krāslava. La aeronave abandonó el espacio aéreo letón a las 19:16 al cruzar la frontera rusa; el dron interceptor BLAZE, que había sido desplegado, se autodestruyó a las 19:19, provocando el ruido de explosión que oyeron los habitantes. El 3 de noviembre, tras analizar sus sensores y consultar con sus socios ucranianos, el NBS concluyó que lo más probable era que el aparato fuera un dron ruso del tipo Geran; no pudo determinar si transportaba explosivos. Durante la noche del 2 al 3 de noviembre, se declaró una nueva alerta en Balvi y Ludza por un dron que, según el NBS, se asemejaba a los de las fuerzas ucranianas, de origen no confirmado."},it:{nom:"Segnalato un drone nello spazio aereo lettone, allerta a Ludza e Krāslava; il drone riparte verso la Russia",pays:"Lettonia",lieu:"Ludza e Krāslava, Latgale",desc:"Il 1° novembre alle ore 18:57, l’esercito lettone (NBS) ha dichiarato un allarme aereo per i comuni di Ludza e Krāslava. Il velivolo ha lasciato lo spazio aereo lettone alle 19:16 attraversando il confine russo; il drone intercettore BLAZE, messo in campo, si è autodistrutto alle 19:19, provocando il rumore di un’esplosione udito dagli abitanti. Il 3 novembre, dopo aver analizzato i dati dei propri sensori e consultato i partner ucraini, l’NBS ha concluso che il velivolo era molto probabilmente un drone russo di tipo Geran; non è stato possibile stabilire se trasportasse esplosivi. Nella notte tra il 2 e il 3 novembre è stato diramato un nuovo allarme a Balvi e Ludza per un drone che, secondo l’NBS, assomigliava a quelli delle forze ucraine, di origine non confermata."}}},{id:"EVEN3879",p:6,cat:3,seuil:"Attribué",passe:!0,date:"2026-09-14",entree:"2026-11-05",src:"https://www.sri.ro/articole/comunicat-de-presa-26-10-2026.html",txt:{fr:{nom:"Un incendie sur une plateforme industrielle de Brașov, près d'une filiale de Romarm",pays:"Roumanie",lieu:"Brașov",desc:"Le 14 septembre 2026, un incendie a touché la plateforme industrielle Carfil, à Brașov, près de CARFIL SA, filiale de la société d'État Romarm ; le site abritait, selon Der Spiegel, une entreprise de défense. Le 26 octobre, le SRI a annoncé avoir identifié un réseau de sabotage coordonné depuis la Russie, impliqué dans cet incendie, avec plusieurs ressortissants d'États ex-soviétiques résidant dans l'Union ; les suspects n'ont pas été nommés. La Roumanie a demandé l'extradition de deux Biélorusses détenus en Allemagne et d'un Ukrainien détenu en Pologne. Le 27 octobre, Bucarest a convoqué l'ambassadeur de Russie, soulignant la responsabilité russe ; l'ambassade a rejeté des « insinuations calomnieuses »."},es:{nom:"Incendio en una plataforma industrial de Brașov, cerca de una filial de Romarm",pays:"Rumanía",lieu:"Brașov",desc:"El 14 de septiembre de 2026, un incendio afectó a la plataforma industrial Carfil, en Brașov, cerca de CARFIL SA, filial de la empresa estatal Romarm; según Der Spiegel, el recinto albergaba una empresa de defensa. El 26 de octubre, el SRI anunció que había identificado una red de sabotaje coordinada desde Rusia, implicada en dicho incendio, en la que participaban varios ciudadanos de antiguos Estados soviéticos residentes en la Unión; no se revelaron los nombres de los sospechosos. Rumanía solicitó la extradición de dos bielorrusos detenidos en Alemania y de un ucraniano detenido en Polonia. El 27 de octubre, Bucarest convocó al embajador de Rusia, subrayando la responsabilidad rusa; la embajada rechazó las «insinuaciones calumniosas»."},it:{nom:"Un incendio in una piattaforma industriale a Brașov, vicino a una filiale di Romarm",pays:"Romania",lieu:"Brașov",desc:"Il 14 settembre 2026, un incendio ha colpito la piattaforma industriale Carfil, a Brașov, nei pressi della CARFIL SA, filiale della società statale Romarm; secondo Der Spiegel, il sito ospitava un’azienda del settore della difesa. Il 26 ottobre, l’SRI ha annunciato di aver identificato una rete di sabotaggio coordinata dalla Russia, coinvolta in tale incendio, con diversi cittadini di Stati ex-sovietici residenti nell’Unione; i sospetti non sono stati nominati. La Romania ha richiesto l’estradizione di due bielorussi detenuti in Germania e di un ucraino detenuto in Polonia. Il 27 ottobre, Bucarest ha convocato l’ambasciatore russo, sottolineando la responsabilità della Russia; l’ambasciata ha respinto le «insinuazioni calunniose»."}}},{id:"EVEN4726",p:6,cat:0,seuil:"Non déterminé",passe:!1,date:"2026-11-04",entree:"2026-11-05",src:"https://www.digi24.ro/stiri/externe/moldova/o-noua-drona-a-intrat-in-republica-moldova-record-de-incursiuni-intr-o-singura-luna-4021045",txt:{fr:{nom:"Un drone entre en Moldavie depuis la région d'Odessa pendant une attaque russe massive, puis ressort",pays:"Moldavie",lieu:"Camenca, Transnistrie ; Vărăncău, raion de Soroca",desc:"Le 4 novembre à 4h23, selon le ministère moldave de la Défense, un drone est entré en territoire moldave depuis la région d'Odessa en direction de Camenca, sur la rive gauche du Dniestr, puis est ressorti à 4h25 près de Vărăncău vers la région de Vinnytsia. L'incident a eu lieu pendant une attaque russe massive contre l'Ukraine. Le ministère a recensé 104 violations de l'espace aérien de 2022 à fin octobre 2026, dont 67 en 2026 ; l'espace moldave a été violé 19 fois en octobre et six drones ont explosé au sol."},es:{nom:"Un dron entra en Moldavia desde la región de Odesa durante un ataque masivo ruso y, a continuación, sale del país.",pays:"Moldavia",lieu:"Camenca, Transnistria; Vărăncău, raión de Soroca",desc:"El 4 de noviembre a las 4:23 h, según el Ministerio de Defensa de Moldavia, un dron entró en territorio moldavo desde la región de Odesa en dirección a Camenca, en la margen izquierda del Dniéster, y luego salió a las 4:25 cerca de Vărăncău hacia la región de Vinnytsia. El incidente tuvo lugar durante un ataque masivo ruso contra Ucrania. El ministerio ha registrado 104 violaciones del espacio aéreo desde 2022 hasta finales de octubre de 2026, de las cuales 67 se produjeron en 2026; el espacio aéreo moldavo fue violado 19 veces en octubre y seis drones explotaron en tierra."},it:{nom:"Un drone entra in Moldavia dalla regione di Odessa durante un massiccio attacco russo, per poi uscirne nuovamente",pays:"Moldavia",lieu:"Camenca, Transnistria; Vărăncău, distretto di Soroca",desc:"Il 4 novembre alle ore 4:23, secondo il Ministero della Difesa moldavo, un drone è entrato nel territorio moldavo dalla regione di Odessa in direzione di Camenca, sulla riva sinistra del Dniestr, per poi uscire alle 4:25 nei pressi di Vărăncău verso la regione di Vinnytsia. L’incidente è avvenuto durante un massiccio attacco russo contro l’Ucraina. Il ministero ha registrato 104 violazioni dello spazio aereo dal 2022 alla fine di ottobre 2026, di cui 67 nel 2026; lo spazio aereo moldavo è stato violato 19 volte nel mese di ottobre e sei droni sono esplosi al suolo."}}},{id:"EVEN4910",p:6,cat:4,seuil:"Attribué",passe:!1,date:"2026-11-05",entree:"2026-11-05",src:"https://www.gov.pl/web/sluzby-specjalne/abw-uderza-w-grupe-dzialajaca-na-rzecz-rosyjskiego-wywiadu",txt:{fr:{nom:"Six interpellés en Pologne, dont quatre inculpés d'espionnage, pour des livraisons à la Russie",pays:"Pologne",lieu:"Voïvodies de Varmie-Mazurie, de Poméranie et de Grande-Pologne",desc:"Le 5 novembre 2026, le ministre coordonnateur des services spéciaux, Tomasz Siemoniak, annonce que l'ABW a interpellé six personnes, cinq Polonais de 25 à 52 ans et une Russe de 37 ans, soupçonnées d'appartenir à un groupe criminel organisé agissant contre la Pologne. Les interpellations ont lieu entre le 21 octobre et le 2 novembre ; 21 sites sont perquisitionnés. Selon le parquet, le groupe a opéré de juin 2023 à décembre 2025 en Pologne, en Lituanie et en Russie : il achetait des composants de munitions, dont des douilles et des projectiles, et les acheminait vers l'oblast de Kaliningrad dans des véhicules équipés de caches ; une partie des chargements a été interceptée par les gardes-frontières polonais. La valeur des composants dépasse 2 millions de zlotys. Selon l'ABW, ces livraisons pouvaient renforcer l'industrie d'armement russe. Les six suspects sont poursuivis pour participation à un groupe organisé exportant ces biens malgré l'interdiction ; quatre d'entre eux, dont la Russe, sont aussi inculpés d'espionnage au profit du renseignement russe, contre rémunération, et placés en détention provisoire pour trois mois ; les deux autres font l'objet de mesures préventives."},es:{nom:"Seis detenidos en Polonia, cuatro de ellos acusados de espionaje, por envíos a Rusia",pays:"Polonia",lieu:"Voivodatos de Varmia-Masuria, Pomerania y Gran Polonia",desc:"El 5 de noviembre de 2026, el ministro coordinador de los servicios especiales, Tomasz Siemoniak, anuncia que la ABW ha detenido a seis personas —cinco polacos de entre 25 y 52 años y una rusa de 37 años— sospechosas de pertenecer a un grupo delictivo organizado que actúa contra Polonia. Las detenciones tuvieron lugar entre el 21 de octubre y el 2 de noviembre; se registraron 21 locales. Según la fiscalía, el grupo operó desde junio de 2023 hasta diciembre de 2025 en Polonia, Lituania y Rusia: adquiría componentes de munición, entre ellos casquillos y proyectiles, y los transportaba a la región de Kaliningrado en vehículos equipados con compartimentos ocultos; parte de los cargamentos fue interceptada por los guardias fronterizos polacos. El valor de los componentes supera los 2 millones de zlotys. Según la ABW, estos envíos podían reforzar la industria armamentística rusa. Los seis sospechosos están siendo procesados por participar en un grupo organizado que exportaba estos bienes a pesar de la prohibición; cuatro de ellos, entre ellos la ciudadana rusa, también están acusados de espionaje en beneficio de los servicios de inteligencia rusos, a cambio de una remuneración, y se les ha impuesto prisión preventiva durante tres meses; los otros dos están sujetos a medidas cautelares."},it:{nom:"Sei persone fermate in Polonia, di cui quattro accusate di spionaggio, per forniture alla Russia",pays:"Polonia",lieu:"Voivodati di Varmia-Masuria, Pomerania e Grande Polonia",desc:"Il 5 novembre 2026, il ministro coordinatore dei servizi speciali, Tomasz Siemoniak, annuncia che l’ABW ha arrestato sei persone, cinque polacchi di età compresa tra i 25 e i 52 anni e una russa di 37 anni, sospettate di appartenere a un gruppo criminale organizzato che agisce contro la Polonia. Gli arresti sono avvenuti tra il 21 ottobre e il 2 novembre; sono stati perquisiti 21 luoghi. Secondo la procura, il gruppo ha operato da giugno 2023 a dicembre 2025 in Polonia, Lituania e Russia: acquistava componenti di munizioni, tra cui bossoli e proiettili, e li trasportava verso l’oblast di Kaliningrad in veicoli dotati di nascondigli; una parte dei carichi è stata intercettata dalle guardie di frontiera polacche. Il valore dei componenti supera i 2 milioni di zloty. Secondo l’ABW, tali consegne avrebbero potuto rafforzare l’industria degli armamenti russa. I sei indagati sono accusati di partecipazione a un gruppo organizzato che esportava tali beni nonostante il divieto; quattro di loro, tra cui la cittadina russa, sono inoltre accusati di spionaggio a favore dei servizi segreti russi, a titolo oneroso, e sono stati posti in custodia cautelare per tre mesi; gli altri due sono soggetti a misure preventive."}}},{id:"EVEN4920",p:6,cat:0,seuil:"Non déterminé",passe:!1,date:"2026-11-05",entree:"2026-11-05",src:"https://ipn.md/drona-depistata-intr-o-padure-de-langa-gordinesti-raionul-rezina",txt:{fr:{nom:"Un objet semblable à un drone découvert dans une forêt près de Gordinești, en Moldavie",pays:"Moldavie",lieu:"Près de Gordinești, raion de Rezina",desc:"Dans l'après-midi du 5 novembre, un objet semblable à un drone a été découvert dans une zone boisée près du village de Gordinești (raion de Rezina), en Moldavie. Selon l'Inspectorat général de la police, des experts de la section technico-explosive se sont rendus sur place pour déterminer sa nature et sa provenance. Selon TV8, l'appareil était de type « Gerbera », généralement utilisé pour la reconnaissance, et la police n'y a pas trouvé d'explosifs ; aucune source n'a nommé son exploitant. La date de la chute n'a pas été déterminée : le 5 novembre est celle de la découverte."},es:{nom:"Se ha hallado un objeto similar a un dron en un bosque cerca de Gordinești, en Moldavia",pays:"Moldavia",lieu:"Cerca de Gordinești, raión de Rezina",desc:"En la tarde del 5 de noviembre, se descubrió un objeto similar a un dron en una zona boscosa cerca del pueblo de Gordinești (distrito de Rezina), en Moldavia. Según la Inspección General de la Policía, expertos de la sección técnico-explosiva se desplazaron al lugar para determinar su naturaleza y procedencia. Según TV8, el aparato era del tipo «Gerbera», utilizado habitualmente para tareas de reconocimiento, y la policía no encontró explosivos en él; ninguna fuente ha identificado a su operador. No se ha determinado la fecha de la caída: el 5 de noviembre es la fecha del hallazgo."},it:{nom:"Un oggetto simile a un drone rinvenuto in un bosco nei pressi di Gordinești, in Moldavia",pays:"Moldavia",lieu:"Nei pressi di Gordinești, distretto di Rezina",desc:"Nel pomeriggio del 5 novembre, un oggetto simile a un drone è stato rinvenuto in una zona boschiva nei pressi del villaggio di Gordinești (raion di Rezina), in Moldavia. Secondo l’Ispettorato generale di polizia, alcuni esperti della sezione tecnico-esplosivi si sono recati sul posto per determinarne la natura e la provenienza. Secondo TV8, il velivolo era del tipo «Gerbera», solitamente utilizzato per la ricognizione, e la polizia non vi ha trovato esplosivi; nessuna fonte ha indicato chi ne fosse il gestore. La data della caduta non è stata determinata: il 5 novembre è la data del ritrovamento."}}},{id:"EVEN5016",p:6,cat:3,seuil:"Attribué",passe:!0,date:"2024-05-12",entree:"2026-11-06",src:"https://www.gov.pl/web/prokuratura-krajowa/akt-oskarzenia-w-sprawie-podpalen-obiektow-wielkopowierzchniowych-na-rzecz-wywiadu-federacji-rosyjskiej",txt:{fr:{nom:"L'incendie du centre commercial Marywilska 44 à Varsovie",pays:"Pologne",lieu:"Varsovie",desc:"Le 12 mai 2024, le centre commercial Marywilska 44 a brûlé à Varsovie. Dans le communiqué du 2 avril 2026 annonçant l'acte d'accusation déposé le 25 mars, le parquet national polonais a écrit que l'incendie était l'œuvre de membres d'un groupe criminel organisé agissant sur ordre du renseignement de la Russie ; il n'a pas identifié les auteurs directs et poursuivait l'enquête. Selon Reuters (2 avril 2026), le porte-parole du parquet national a indiqué que ni le commanditaire direct ni l'auteur direct de l'incendie n'avaient été identifiés. Le procès ouvert le 12 octobre 2026 à Varsovie visait quatre des cinq personnes mises en cause dans l'acte d'accusation ; la cinquième, Daniil B., poursuivi pour avoir filmé l'incendie de Marywilska 44, était détenu en Lituanie le 12 octobre, selon Notes from Poland."},es:{nom:"El incendio del centro comercial Marywilska 44 en Varsovia",pays:"Polonia",lieu:"Varsovia",desc:"El 12 de mayo de 2024, se incendió el centro comercial Marywilska 44 en Varsovia. En el comunicado del 2 de abril de 2026, en el que se anunciaba la acusación formal presentada el 25 de marzo, la Fiscalía Nacional polaca señaló que el incendio fue obra de miembros de un grupo delictivo organizado que actuaban bajo las órdenes de los servicios de inteligencia rusos; no identificó a los autores directos y continuaba con la investigación. Según Reuters (2 de abril de 2026), el portavoz de la Fiscalía Nacional indicó que no se había identificado ni al instigador directo ni al autor directo del incendio. El juicio, que se inició el 12 de octubre de 2026 en Varsovia, se centró en cuatro de las cinco personas imputadas en el auto de acusación; la quinta, Daniil B., procesado por haber grabado el incendio de Marywilska 44, se encontraba detenido en Lituania el 12 de octubre, según Notes from Poland."},it:{nom:"L'incendio del centro commerciale Marywilska 44 a Varsavia",pays:"Polonia",lieu:"Varsavia",desc:"Il 12 maggio 2024, il centro commerciale Marywilska 44 è stato distrutto da un incendio a Varsavia. Nel comunicato del 2 aprile 2026 che annunciava l’atto d’accusa depositato il 25 marzo, la Procura nazionale polacca ha scritto che l’incendio era opera di membri di un gruppo criminale organizzato che agiva su ordine dei servizi segreti russi; non ha identificato gli autori diretti e stava proseguendo le indagini. Secondo Reuters (2 aprile 2026), il portavoce della Procura nazionale ha dichiarato che né il mandante diretto né l’autore diretto dell’incendio erano stati identificati. Il processo, avviato il 12 ottobre 2026 a Varsavia, riguardava quattro delle cinque persone citate nell’atto d’accusa; la quinta, Daniil B., perseguito per aver filmato l’incendio di Marywilska 44, era detenuto in Lituania il 12 ottobre, secondo quanto riportato da Notes from Poland."}}},{id:"EVEN4912",p:6,cat:2,seuil:"Suspecté",passe:!0,date:"2024-07-28",entree:"2026-11-06",src:"https://www.diicot.ro/mass-media/6767-comunicat-de-presa-2-05-11-2026",txt:{fr:{nom:"Un Cubain vivant en Russie visé par un mandat d'arrêt préventif roumain pour repérage d'objectifs",pays:"Roumanie",lieu:"Județ d'Ilfov",desc:"Le 5 novembre 2026, le parquet antiterroriste roumain (DIICOT) a annoncé que la cour d'appel de Bucarest avait admis, le 2 novembre, sa demande d'arrestation préventive par défaut, pour 30 jours, visant Oemis Romagoza Durruthy, Cubain de 35 ans résidant en Russie, poursuivi pour instigation à la diversion. En juin-juillet 2024 et contre de l'argent, il aurait déterminé un Colombien à documenter en Roumanie un plan d'incendie ou d'explosion visant des objectifs d'importance particulière ; le Colombien, condamné définitivement le 22 septembre 2025, a effectué des repérages à partir du 28 juillet 2024 dans le județ d'Ilfov. Selon le DIICOT, les États-Unis ont confirmé son appartenance aux services russes, sans service précis ; le DIICOT n'a pas dit que ces services avaient commandé ce plan."},es:{nom:"Un cubano residente en Rusia, objeto de una orden de detención preventiva rumana por localización de objetivos",pays:"Rumanía",lieu:"Condado de Ilfov",desc:"El 5 de noviembre de 2026, la Fiscalía Antiterrorista rumana (DIICOT) anunció que el Tribunal de Apelación de Bucarest había admitido, el 2 de noviembre, su solicitud de prisión preventiva en rebeldía, por un plazo de 30 días, contra Oemis Romagoza Durruthy, un cubano de 35 años residente en Rusia, procesado por incitación a cometer actos de distracción. Entre junio y julio de 2024, a cambio de dinero, habría inducido a un colombiano a documentar en Rumanía un plan de incendio o explosión dirigido contra objetivos de especial importancia; el colombiano, condenado en firme el 22 de septiembre de 2025, llevó a cabo reconocimientos a partir del 28 de julio de 2024 en el județ de Ilfov. Según la DIICOT, Estados Unidos ha confirmado su pertenencia a los servicios rusos, aunque sin especificar a cuál; la DIICOT no ha afirmado que dichos servicios hubieran ordenado dicho plan."},it:{nom:"Un cubano residente in Russia è oggetto di un mandato di arresto preventivo rumeno per individuazione di obiettivi",pays:"Romania",lieu:"Distretto di Ilfov",desc:"Il 5 novembre 2026, la Procura antiterrorismo rumena (DIICOT) ha annunciato che la Corte d’appello di Bucarest aveva accolto, il 2 novembre, la sua richiesta di arresto preventivo in contumacia, per 30 giorni, nei confronti di Oemis Romagoza Durruthy, cubano di 35 anni residente in Russia, perseguito per istigazione a commettere atti di diversione. Tra giugno e luglio 2024, in cambio di denaro, avrebbe indotto un colombiano a documentare in Romania un piano di incendio o di esplosione mirato a obiettivi di particolare importanza; il colombiano, condannato in via definitiva il 22 settembre 2025, ha effettuato ricognizioni a partire dal 28 luglio 2024 nella contea di Ilfov. Secondo il DIICOT, gli Stati Uniti hanno confermato la sua appartenenza ai servizi segreti russi, senza specificarne quale; il DIICOT non ha affermato che tali servizi avessero ordinato tale piano."}}},{id:"EVEN4974",p:6,cat:5,seuil:"Suspecté",passe:!1,date:"2026-11-02",entree:"2026-11-06",src:"https://www.euronews.com/2026/11/05/airbus-plane-from-dublin-to-rome-diverted-to-france-after-bomb-alert",txt:{fr:{nom:"Une vague d'alertes à la bombe visant plus de vingt vols commerciaux en Europe du 2 au 6 novembre",pays:"Hongrie / Italie / Pologne / Espagne / Bulgarie / France / Tchéquie / Royaume-Uni / Danemark / Irlande / Finlande / Roumanie / Autriche / Belgique / Portugal",lieu:"Plusieurs villes",desc:"Du 2 au 6 novembre, des messages annonçant une bombe visent plus de vingt vols commerciaux dans au moins quatorze pays européens (au moins 50 vols selon le Sunday Times). Le 5 novembre, un Aer Lingus Dublin-Rome est intercepté par des chasseurs français et escorté jusqu'à Évreux ; d'autres avions sont escortés par des chasseurs italiens, bulgares et hongrois. Aucun explosif n'a été trouvé. Un e-mail reçu à Rome attribuait la fausse alerte à la bombe aux « Luchadores del Estado Masculino », groupe d'ultradroite russe interdit en Russie ; le dirigeant de Male State a nié tout lien. Le 6 novembre, le Premier ministre irlandais Micheál Martin a jugé ces menaces coordonnées et a évoqué une analyse d'ensemble selon laquelle la hausse des attaques hybrides a une « dimension russe », tout en jugeant trop tôt pour l'établir ; le 7 novembre, le ministre d'État Thomas Byrne déclare : « Nous savons que la Russie est impliquée dans ce type d'activité », et la ministre de la Défense Helen McEntee dit que la Russie ne peut pas être exclue. Selon le Sunday Times, une source du renseignement irlandais a conclu à un acteur étatique."},es:{nom:"Una oleada de alertas de bomba que afectó a más de veinte vuelos comerciales en Europa entre el 2 y el 6 de noviembre",pays:"Hungría / Italia / Polonia / España / Bulgaria / Francia / Chequia / Reino Unido / Dinamarca / Irlanda / Finlandia / Rumanía / Austria / Bélgica / Portugal",lieu:"Varias ciudades",desc:"Del 2 al 6 de noviembre, se reciben mensajes amenazantes con una bomba dirigidos a más de veinte vuelos comerciales en al menos catorce países europeos (al menos 50 vuelos según el Sunday Times). El 5 de noviembre, un vuelo de Aer Lingus de Dublín a Roma fue interceptado por cazas franceses y escoltado hasta Évreux; otros aviones fueron escoltados por cazas italianos, búlgaros y húngaros. No se encontró ningún explosivo. Un correo electrónico recibido en Roma atribuía la falsa alerta de bomba a los «Luchadores del Estado Masculino», un grupo de extrema derecha ruso prohibido en Rusia; el líder de Male State negó cualquier vínculo. El 6 de noviembre, el primer ministro irlandés, Micheál Martin, consideró que estas amenazas estaban coordinadas y se refirió a un análisis general según el cual el aumento de los ataques híbridos tiene una «dimensión rusa», aunque consideró que era demasiado pronto para afirmarlo; el 7 de noviembre, el ministro de Estado Thomas Byrne declaró: «Sabemos que Rusia está implicada en este tipo de actividades», y la ministra de Defensa, Helen McEntee, afirmó que no se puede descartar a Rusia. Según el Sunday Times, una fuente de los servicios de inteligencia irlandeses concluyó que se trataba de un actor estatal."},it:{nom:"Un’ondata di allarmi bomba che ha colpito oltre venti voli commerciali in Europa dal 2 al 6 novembre",pays:"Ungheria / Italia / Polonia / Spagna / Bulgaria / Francia / Cechia / Regno Unito / Danimarca / Irlanda / Finlandia / Romania / Austria / Belgio / Portogallo",lieu:"Diverse città",desc:"Dal 2 al 6 novembre, messaggi che annunciavano la presenza di una bomba hanno preso di mira più di venti voli commerciali in almeno quattordici paesi europei (almeno 50 voli secondo il Sunday Times). Il 5 novembre, un volo Aer Lingus da Dublino a Roma è stato intercettato da caccia francesi e scortato fino a Évreux; altri aerei sono stati scortati da caccia italiani, bulgari e ungheresi. Non è stato trovato alcun esplosivo. Un’e-mail ricevuta a Roma attribuiva il falso allarme bomba ai «Luchadores del Estado Masculino», un gruppo di estrema destra russo vietato in Russia; il leader di Male State ha negato qualsiasi collegamento. Il 6 novembre, il primo ministro irlandese Micheál Martin ha definito queste minacce «coordinate» e ha fatto riferimento a un’analisi d’insieme secondo cui l’aumento degli attacchi ibridi presenta una «dimensione russa», pur ritenendo che fosse troppo presto per stabilirlo; il 7 novembre, il ministro di Stato Thomas Byrne ha dichiarato: «Sappiamo che la Russia è coinvolta in questo tipo di attività», e la ministra della Difesa Helen McEntee ha affermato che la Russia non può essere esclusa. Secondo il Sunday Times, una fonte dei servizi segreti irlandesi ha concluso che si tratti di un attore statale."}}},{id:"EVEN4961",p:6,cat:4,seuil:"Non déterminé",passe:!1,date:"2026-11-04",entree:"2026-11-06",src:"https://www.sekoia.com/blog/poisoned-source-apt29-watering-holes-targets-mobile-devices-with-n-day-exploits",txt:{fr:{nom:"Un site bulgare lié au domaine militaire est compromis dans une campagne de cyberespionnage",pays:"Bulgarie",lieu:"Site non identifié",desc:"Le 4 novembre, la société française de cybersécurité Sekoia a publié un rapport sur une campagne de « watering hole » visant des utilisateurs d'iOS et d'Android, détectée à la mi-octobre, via des sites compromis ou clonés aux États-Unis, en Ukraine, en Tchéquie et en Bulgarie. En Bulgarie, les attaquants ont modifié une bibliothèque JavaScript d'un site « lié au domaine militaire », que Sekoia n'a pas nommé, pour fournir au visiteur un exploit ciblant des failles déjà corrigées. Sekoia a attribué la campagne à APT29 « avec une confiance modérée à élevée », groupe russe largement rattaché au SVR ; l'attribution reposait sur des recoupements techniques, non sur une désignation gouvernementale. Le CERT bulgare n'a publié aucune alerte. La date de la compromission n'a pas été déterminée."},es:{nom:"Una página web búlgara relacionada con el ámbito militar se ve comprometida en una campaña de ciberespionaje",pays:"Bulgaria",lieu:"Sitio web no identificado",desc:"El 4 de noviembre, la empresa francesa de ciberseguridad Sekoia publicó un informe sobre una campaña de «watering hole» dirigida a usuarios de iOS y Android, detectada a mediados de octubre, a través de sitios web comprometidos o clonados en Estados Unidos, Ucrania, la República Checa y Bulgaria. En Bulgaria, los atacantes modificaron una biblioteca JavaScript de un sitio web «vinculado al ámbito militar», cuyo nombre Sekoia no ha revelado, para proporcionar al visitante un exploit dirigido a vulnerabilidades ya corregidas. Sekoia atribuyó la campaña a APT29 «con un grado de confianza de moderado a alto», un grupo ruso ampliamente vinculado al SVR; la atribución se basó en pruebas técnicas cruzadas, no en una designación gubernamental. El CERT búlgaro no ha publicado ninguna alerta. No se ha determinado la fecha de la intrusión."},it:{nom:"Un sito bulgaro legato al settore militare è stato compromesso nel corso di una campagna di spionaggio informatico",pays:"Bulgaria",lieu:"Sito non identificato",desc:"Il 4 novembre, la società francese di sicurezza informatica Sekoia ha pubblicato un rapporto su una campagna «watering hole» rivolta agli utenti iOS e Android, rilevata a metà ottobre, tramite siti compromessi o clonati negli Stati Uniti, in Ucraina, nella Repubblica Ceca e in Bulgaria. In Bulgaria, gli autori dell’attacco hanno modificato una libreria JavaScript di un sito «legato al settore militare», che Sekoia non ha nominato, per fornire al visitatore un exploit mirato a vulnerabilità già corrette. Sekoia ha attribuito la campagna ad APT29 «con un grado di certezza da moderato ad alto», un gruppo russo ampiamente collegato all’SVR; l’attribuzione si basava su prove tecniche incrociate, non su una designazione governativa. Il CERT bulgaro non ha pubblicato alcun avviso. La data della compromissione non è stata determinata."}}},{id:"EVEN4998",p:6,cat:0,seuil:"Non déterminé",passe:!1,date:"2026-11-06",entree:"2026-11-06",src:"https://www.24chasa.bg/bulgaria/article/23876594",txt:{fr:{nom:"Un drone portant l'inscription « Shahed » retrouvé échoué sur une plage près de Shabla, en Bulgarie",pays:"Bulgarie",lieu:"Shabla, région de Dobrich",desc:"Le 6 novembre, un habitant a signalé un drone échoué sur la plage de Shabla, devant le polygone antiaérien, à environ 800 mètres du phare. Selon le maire Mariyan Zhechev, l'appareil, de 3 sur 4 mètres, portait l'inscription « Shahed » ; le secteur a été bouclé par la police. Le journal 24chasa l'a qualifié de drone Gerbera-2, version russe du Shahed iranien, et de « catégoriquement russe », sans attribuer cette identification à une autorité ; selon lui, il n'avait pas de charge explosive et l'équipe de la marine l'a détruit le 6 novembre. Des restes d'autres drones ont été envoyés à des partenaires pour expertise. Selon Politico, l'origine du drone et son éventuel lien avec les attaques contre des navires marchands n'ont pas été établis."},es:{nom:"Se ha hallado un dron con la inscripción «Shahed» varado en una playa cerca de Shabla, en Bulgaria.",pays:"Bulgaria",lieu:"Shabla, región de Dobrich",desc:"El 6 de noviembre, un vecino informó de la presencia de un dron varado en la playa de Shabla, frente al polígono antiaéreo, a unos 800 metros del faro. Según el alcalde Mariyan Zhechev, el aparato, de 3 por 4 metros, llevaba la inscripción «Shahed»; la policía acordonó la zona. El periódico 24chasa lo calificó de dron Gerbera-2, versión rusa del Shahed iraní, y de «rotundamente ruso», sin atribuir esta identificación a ninguna autoridad; según él, no llevaba carga explosiva y el equipo de la Armada lo destruyó el 6 de noviembre. Se han enviado restos de otros drones a socios para su análisis. Según Politico, no se ha determinado el origen del dron ni su posible relación con los ataques contra buques mercantes."},it:{nom:"Un drone con la scritta «Shahed» è stato ritrovato arenato su una spiaggia vicino a Shabla, in Bulgaria",pays:"Bulgaria",lieu:"Shabla, regione di Dobrich",desc:"Il 6 novembre, un residente ha segnalato un drone arenatosi sulla spiaggia di Shabla, di fronte al poligono antiaereo, a circa 800 metri dal faro. Secondo il sindaco Mariyan Zhechev, l’apparecchio, di 3 metri per 4, recava la scritta «Shahed»; l’area è stata isolata dalla polizia. Il quotidiano 24chasa lo ha definito un drone Gerbera-2, versione russa dello Shahed iraniano, e «categoricamente russo», senza attribuire tale identificazione ad alcuna autorità; secondo il quotidiano, il drone non conteneva cariche esplosive ed è stato distrutto dalla squadra della marina il 6 novembre. I resti di altri droni sono stati inviati a partner per essere sottoposti a perizia. Secondo Politico, l’origine del drone e il suo eventuale collegamento con gli attacchi contro le navi mercantili non sono stati accertati."}}},{id:"EVEN5120",p:7,cat:3,seuil:"Confirmé",passe:!0,date:"2024-03-20",entree:"2026-11-07",src:"https://www.itv.com/news/2026-10-02/architect-of-wagner-group-arson-attack-to-pay-victims-more-than-160000",txt:{fr:{nom:"Dylan Earl, organisateur d'un incendie d'entrepôt lié à l'aide à l'Ukraine, doit verser 164 301 £",pays:"Royaume-Uni",lieu:"Leyton, Londres",desc:"Le 20 mars 2024, un incendie a détruit des entrepôts à Leyton, dans l'est de Londres, causant environ un million de livres de dégâts ; le site stockait notamment de l'aide humanitaire et du matériel Starlink destinés à l'Ukraine. Six hommes ont été reconnus coupables d'une campagne planifiée de terrorisme et de sabotage au profit de l'État russe ; Dylan Earl, alors âgé de 22 ans, a été condamné en octobre 2025 à 17 ans de prison pour son rôle de premier plan. Le 2 octobre 2026, l'Old Bailey a rendu une ordonnance de confiscation : sur 698 816,18 £ de gains illicites retenus par l'accusation, 164 301,13 £ ont été saisis, dont 163 521 £ à verser à Meest UK Ltd ; à défaut de paiement sous trois mois, Earl encourait 18 mois de prison supplémentaires."},es:{nom:"Dylan Earl, responsable de un incendio en un almacén relacionado con la ayuda a Ucrania, deberá pagar 164 301 £.",pays:"Reino Unido",lieu:"Leyton, Londres",desc:"El 20 de marzo de 2024, un incendio destruyó unos almacenes en Leyton, al este de Londres, causando daños por valor de aproximadamente un millón de libras; en las instalaciones se almacenaban, entre otras cosas, ayuda humanitaria y material de Starlink destinado a Ucrania. Seis hombres fueron declarados culpables de una campaña planificada de terrorismo y sabotaje en beneficio del Estado ruso; Dylan Earl, que entonces tenía 22 años, fue condenado en octubre de 2025 a 17 años de prisión por su papel destacado. El 2 de octubre de 2026, el Old Bailey dictó una orden de decomiso: de las 698 816,18 £ de ganancias ilícitas retenidas por la acusación, se incautaron 164 301,13 £, de las cuales 163 521 £ debían abonarse a Meest UK Ltd; en caso de no pagar en un plazo de tres meses, Earl se enfrentaba a 18 meses adicionales de prisión."},it:{nom:"Dylan Earl, responsabile di un incendio in un magazzino legato agli aiuti all’Ucraina, dovrà pagare 164.301 sterline",pays:"Regno Unito",lieu:"Leyton, Londra",desc:"Il 20 marzo 2024, un incendio ha distrutto alcuni magazzini a Leyton, nella zona est di Londra, causando danni per circa un milione di sterline; il sito ospitava, tra l’altro, aiuti umanitari e attrezzature Starlink destinate all’Ucraina. Sei uomini sono stati riconosciuti colpevoli di una campagna pianificata di terrorismo e sabotaggio a favore dello Stato russo; Dylan Earl, all’epoca ventiduenne, è stato condannato nell’ottobre 2025 a 17 anni di reclusione per il suo ruolo di primo piano. Il 2 ottobre 2026, l’Old Bailey ha emesso un’ordinanza di confisca: sui 698.816,18 £ di proventi illeciti individuati dall’accusa, sono state sequestrate 164.301,13 sterline, di cui 163.521 sterline da versare alla Meest UK Ltd; in caso di mancato pagamento entro tre mesi, Earl avrebbe rischiato ulteriori 18 mesi di reclusione."}}},{id:"EVEN5119",p:7,cat:0,seuil:"Attribué",passe:!0,date:"2025-09-10",entree:"2026-11-07",src:"https://www.eurointegration.com.ua/eng/news/2026/10/8/7247199/",txt:{fr:{nom:"La Pologne clôt l'enquête sur les drones russes de septembre 2025 ; cartes SIM polonaises retrouvées",pays:"Pologne",lieu:"Voïvodie de Lublin",desc:"Dans la nuit du 9 au 10 septembre 2025, des drones russes sont entrés dans l'espace aérien polonais (une vingtaine à plus de trente selon les sources ; débris retrouvés dans 27 localités). Le 8 octobre 2026, le parquet de district de Lublin, par la voix de son porte-parole Marcin Kozak, a annoncé la clôture de l'enquête faute d'avoir pu identifier l'auteur direct ; l'origine russe des drones n'a pas été remise en cause. Des cartes SIM d'opérateurs polonais ont été trouvées dans certains drones ; le parquet n'a pas dit comment elles y sont arrivées, le volet de l'enquête relatif à ces cartes étant classifié. Un volet distinct a été clos sans infraction : l'action de l'armée polonaise a été jugée conforme aux procédures. La date exacte de la décision n'a pas été précisée."},es:{nom:"Polonia cierra la investigación sobre los drones rusos de septiembre de 2025; se han hallado tarjetas SIM polacas",pays:"Polonia",lieu:"Voivodato de Lublin",desc:"En la noche del 9 al 10 de septiembre de 2025, varios drones rusos penetraron en el espacio aéreo polaco (entre una veintena y más de treinta, según las fuentes; se encontraron restos en 27 localidades). El 8 de octubre de 2026, la fiscalía del distrito de Lublin, a través de su portavoz Marcin Kozak, anunció el archivo de la investigación al no haberse podido identificar al autor directo; no se ha cuestionado el origen ruso de los drones. En algunos drones se encontraron tarjetas SIM de operadores polacos; la fiscalía no ha explicado cómo llegaron allí, ya que el apartado de la investigación relativo a estas tarjetas es confidencial. Se ha archivado otra parte de la investigación sin que se haya constatado ninguna infracción: se ha considerado que la actuación del ejército polaco se ajustó a los procedimientos. No se ha precisado la fecha exacta de la decisión."},it:{nom:"La Polonia chiude l’indagine sui droni russi del settembre 2025; ritrovate schede SIM polacche",pays:"Polonia",lieu:"Voivodato di Lublino",desc:"Nella notte tra il 9 e il 10 settembre 2025, alcuni droni russi hanno violato lo spazio aereo polacco (da una ventina a oltre trenta secondo le fonti; detriti rinvenuti in 27 località). L’8 ottobre 2026, la procura distrettuale di Lublino, per bocca del suo portavoce Marcin Kozak, ha annunciato la chiusura delle indagini non essendo stato possibile identificare l’autore diretto; l’origine russa dei droni non è stata messa in discussione. In alcuni droni sono state rinvenute schede SIM di operatori polacchi; la procura non ha spiegato come vi siano finite, poiché il filone dell’indagine relativo a tali schede è riservato. Un filone separato è stato archiviato senza che venisse accertata alcuna infrazione: l’operato dell’esercito polacco è stato ritenuto conforme alle procedure. La data esatta della decisione non è stata precisata."}}},{id:"EVEN5027",p:7,cat:5,seuil:"Attribué",passe:!1,date:"2026-11-06",entree:"2026-11-07",src:"https://www.independent.ie/irish-news/we-will-go-after-this-taoiseach-vows-to-hunt-down-those-behind-bomb-threats-to-irish-independent-and-other-media-outlets/a/164175835.html",txt:{fr:{nom:"Des e-mails annonçant une explosion font évacuer RTÉ et d'autres médias irlandais",pays:"Irlande / Royaume-Uni / Bulgarie",lieu:"Plusieurs villes",desc:"Le 6 novembre au matin, des e-mails annonçant qu'une bombe exploserait dans les quarante-cinq minutes sont envoyés à plusieurs médias. RTÉ, l'Irish Independent, Newstalk et Today FM sont évacués ; des médias britanniques (dont Sky) et bulgares sont aussi visés. La police irlandaise a jugé les menaces fausses. Les e-mails étaient signés « Mikhail Andropov », qui a aussi revendiqué la série de fausses alertes à la bombe visant des vols ; cette revendication n'a pas été vérifiée. Le Premier ministre Micheál Martin a jugé ces menaces coordonnées avec celles visant des vols et a évoqué une analyse d'ensemble selon laquelle la hausse des attaques hybrides a une « dimension russe », tout en jugeant trop tôt pour l'établir ; le 7 novembre, la ministre de la Défense Helen McEntee dit que la Russie ne peut pas être exclue et le ministre d'État Thomas Byrne déclare : « Nous savons que la Russie est impliquée dans ce type d'activité ». Selon le Sunday Times, une source du renseignement irlandais a conclu à un acteur étatique et des sources de sécurité y ont vu une campagne du Kremlin."},es:{nom:"Unos correos electrónicos que anunciaban una explosión provocan la evacuación de la RTÉ y otros medios de comunicación irlandeses",pays:"Irlanda / Reino Unido / Bulgaria",lieu:"Varias ciudades",desc:"La mañana del 6 de noviembre se enviaron correos electrónicos a varios medios de comunicación en los que se anunciaba que una bomba explotaría en cuarenta y cinco minutos. Se evacuaron RTÉ, el Irish Independent, Newstalk y Today FM; también fueron objeto de las amenazas medios británicos (entre ellos Sky) y búlgaros. La policía irlandesa consideró que las amenazas eran falsas. Los correos electrónicos estaban firmados por «Mikhail Andropov», quien también reivindicó la serie de falsas alertas de bomba dirigidas a vuelos; esta reivindicación no ha sido verificada. El primer ministro Micheál Martin consideró que estas amenazas estaban coordinadas con las dirigidas contra vuelos y se refirió a un análisis general según el cual el aumento de los ataques híbridos tiene una «dimensión rusa», aunque consideró que era demasiado pronto para afirmarlo; el 7 de noviembre, la ministra de Defensa, Helen McEntee, afirmó que no se puede descartar a Rusia, y el ministro de Estado, Thomas Byrne, declaró: «Sabemos que Rusia está implicada en este tipo de actividades». Según el Sunday Times, una fuente de los servicios de inteligencia irlandeses concluyó que se trataba de un actor estatal y algunas fuentes de seguridad lo interpretaron como una campaña del Kremlin."},it:{nom:"Delle e-mail che annunciavano un'esplosione hanno causato l'evacuazione della RTÉ e di altri media irlandesi",pays:"Irlanda / Regno Unito / Bulgaria",lieu:"Diverse città",desc:"La mattina del 6 novembre, diverse testate giornalistiche ricevono e-mail che annunciano l’esplosione di una bomba entro quarantacinque minuti. RTÉ, l’Irish Independent, Newstalk e Today FM vengono evacuati; sono presi di mira anche media britannici (tra cui Sky) e bulgari. La polizia irlandese ha ritenuto che le minacce fossero false. Le e-mail erano firmate «Mikhail Andropov», lo stesso autore che ha rivendicato anche la serie di falsi allarmi bomba contro i voli; tale rivendicazione non è stata verificata. Il primo ministro Micheál Martin ha ritenuto che queste minacce fossero coordinate con quelle rivolte ai voli aerei e ha accennato a un’analisi d’insieme secondo cui l’aumento degli attacchi ibridi presenta una «dimensione russa», pur ritenendo che fosse troppo presto per stabilirlo; il 7 novembre, la ministra della Difesa Helen McEntee ha affermato che la Russia non può essere esclusa e il ministro di Stato Thomas Byrne ha dichiarato: «Sappiamo che la Russia è coinvolta in questo tipo di attività». Secondo il Sunday Times, una fonte dei servizi segreti irlandesi ha concluso che si trattasse di un attore statale e fonti della sicurezza hanno individuato in ciò una campagna del Cremlino."}}},{id:"EVEN5130",p:7,cat:5,seuil:"Attribué",passe:!1,date:"2026-11-07",entree:"2026-11-08",src:"https://kyivindependent.com/italys-foreign-minister-targeted-in-cyberattack-due-to-ukraine-stance-minister-says-2/",txt:{fr:{nom:"Une cyberattaque contre le ministre italien Tajani est liée par Meloni à des hackers prorusses",pays:"Italie",lieu:"Rome",desc:"Le 7 novembre, Antonio Tajani, ministre italien des Affaires étrangères, dénonce une attaque informatique : des cybercriminels diffusaient ses données sur le dark web depuis plusieurs jours et cherchaient à obtenir des informations sur lui et sa famille. Il a lié l'attaque au soutien de l'Italie à l'Ukraine. Selon Kyiv Independent, qui cite l'agence LaPresse, Giorgia Meloni a évoqué l'activité de « hackers prorusses » ; aucun groupe n'a été nommé. Le 9 novembre, le ministre de l'Intérieur Matteo Piantedosi évoque des informations selon lesquelles les données de plusieurs responsables, dont le ministre des Affaires étrangères, le procureur de Rome et le chef de la Police postale, auraient aussi été proposées à la vente sur le dark web."},es:{nom:"Meloni atribuye un ciberataque contra el ministro italiano Tajani a hackers prorrusos",pays:"Italia",lieu:"Roma",desc:"El 7 de noviembre, Antonio Tajani, ministro italiano de Asuntos Exteriores, denunció un ciberataque: unos ciberdelincuentes llevaban varios días difundiendo sus datos en la dark web y trataban de obtener información sobre él y su familia. Relacionó el ataque con el apoyo de Italia a Ucrania. Según el Kyiv Independent, que cita a la agencia LaPresse, Giorgia Meloni se refirió a la actividad de «hackers prorrusos»; no se ha nombrado a ningún grupo. El 9 de noviembre, el ministro del Interior, Matteo Piantedosi, se refirió a informaciones según las cuales los datos de varios responsables, entre ellos el ministro de Asuntos Exteriores, el fiscal de Roma y el jefe de la Policía Postal, también habrían sido puestos a la venta en la dark web."},it:{nom:"Meloni collega un attacco informatico contro il ministro italiano Tajani ad hacker filorussi",pays:"Italia",lieu:"Roma",desc:"Il 7 novembre, Antonio Tajani, ministro degli Affari esteri italiano, ha denunciato un attacco informatico: alcuni criminali informatici stavano diffondendo i suoi dati sul dark web da diversi giorni e cercavano di ottenere informazioni su di lui e sulla sua famiglia. Ha collegato l’attacco al sostegno dell’Italia all’Ucraina. Secondo il Kyiv Independent, che cita l’agenzia LaPresse, Giorgia Meloni ha fatto riferimento all’attività di «hacker filorussi»; nessun gruppo è stato nominato. Il 9 novembre, il ministro dell’Interno Matteo Piantedosi ha fatto riferimento a informazioni secondo cui anche i dati di diversi funzionari, tra cui il ministro degli Affari esteri, il procuratore di Roma e il capo della Polizia postale, sarebbero stati messi in vendita sul dark web."}}},{id:"EVENM001",p:7,cat:6,seuil:"Non déterminé",passe:!1,date:"2026-10-14",entree:"2026-11-09",src:"https://news.sky.com/story/threatening-emails-sent-to-hundreds-of-schools-in-northern-ireland-and-scotland-treated-as-hoaxes-police-say-13610920",txt:{fr:{nom:"Des alertes à la bombe visent des écoles en Irlande, au Royaume-Uni, en Hongrie et en Italie",pays:"Irlande / Royaume-Uni / Hongrie / Italie",lieu:"Plusieurs villes",desc:"Le 14 octobre 2026, plus de 150 écoles irlandaises reçoivent un e-mail annonçant une bombe. Le 19 octobre, un e-mail comparable vise jusqu'à 300 écoles d'Irlande du Nord, et des écoles d'Écosse, de Hongrie et d'Italie. Le 2 novembre, environ 270 écoles italiennes reçoivent des messages signés d'un « Corps des gardiens de la révolution islamique » d'affiliation non vérifiée. Le 11 novembre, des écoles d'Irlande du Nord, d'Écosse et d'Italie sont visées ; signé « Mikhail Andropov », le message est envoyé depuis le compte compromis d'une université taïwanaise, une piste qui, selon l'ANSA, « semblerait mener vers Moscou ». Le 19 novembre, le ministre de l'Intérieur Matteo Piantedosi indique au Parlement que les e-mails ont touché plus de 6 000 écoles le 11 novembre et près de 7 500 le 16 ; il parle d'« opérations hostiles » de déstabilisation et juge « encore prématuré » d'en attribuer la responsabilité « à la direction d'un ou plusieurs acteurs hostiles ». Selon lui, le parquet national antimafia et antiterroriste coordonne des poursuites contre X. Le Sunday Times (7 novembre) cite des sources de sécurité irlandaises reliant les alertes à la Russie, sans confirmation officielle."},es:{nom:"Se han producido alertas de bomba en colegios de Irlanda, el Reino Unido, Hungría e Italia",pays:"Irlanda / Reino Unido / Hungría / Italia",lieu:"Varias ciudades",desc:"El 14 de octubre de 2026, más de 150 colegios irlandeses reciben un correo electrónico en el que se anuncia la presencia de una bomba. El 19 de octubre, un correo electrónico similar se dirige a hasta 300 colegios de Irlanda del Norte, así como a colegios de Escocia, Hungría e Italia. El 2 de noviembre, unas 270 escuelas italianas reciben mensajes firmados por un «Cuerpo de Guardianes de la Revolución Islámica» de afiliación no verificada. El 11 de noviembre, se dirigen mensajes a escuelas de Irlanda del Norte, Escocia e Italia; firmado por «Mikhail Andropov», el mensaje se envió desde la cuenta comprometida de una universidad taiwanesa, una pista que, según la ANSA, «parecería conducir a Moscú». El 19 de noviembre, el ministro del Interior, Matteo Piantedosi, indicó ante el Parlamento que los correos electrónicos afectaron a más de 6 000 colegios el 11 de noviembre y a cerca de 7 500 el 16; habla de «operaciones hostiles» de desestabilización y considera «aún prematuro» atribuir la responsabilidad «a la dirección de uno o varios actores hostiles». Según él, la Fiscalía Nacional Antimafia y Antiterrorista coordina las actuaciones judiciales contra «X». El Sunday Times (7 de noviembre) cita fuentes de seguridad irlandesas que vinculan las alertas con Rusia, sin que haya confirmación oficial."},it:{nom:"Allarmi bomba colpiscono scuole in Irlanda, nel Regno Unito, in Ungheria e in Italia",pays:"Irlanda / Regno Unito / Ungheria / Italia",lieu:"Diverse città",desc:"Il 14 ottobre 2026, oltre 150 scuole irlandesi ricevono un’e-mail che annuncia la presenza di una bomba. Il 19 ottobre, un’e-mail simile prende di mira fino a 300 scuole dell’Irlanda del Nord, oltre a scuole in Scozia, Ungheria e Italia. Il 2 novembre, circa 270 scuole italiane ricevono messaggi firmati da un «Corpo delle Guardie della Rivoluzione Islamica» di affiliazione non verificata. L’11 novembre, vengono prese di mira scuole dell’Irlanda del Nord, della Scozia e dell’Italia; firmato «Mikhail Andropov», il messaggio è stato inviato dall’account compromesso di un’università taiwanese, una pista che, secondo l’ANSA, «sembrerebbe condurre a Mosca». Il 19 novembre, il ministro dell’Interno Matteo Piantedosi ha dichiarato in Parlamento che le e-mail hanno colpito oltre 6.000 scuole l’11 novembre e quasi 7.500 il 16; parla di «operazioni ostili» di destabilizzazione e ritiene «ancora prematuro» attribuirne la responsabilità «alla leadership di uno o più attori ostili». Secondo lui, la Procura nazionale antimafia e antiterrorismo sta coordinando un’indagine contro ignoti. Il Sunday Times (7 novembre) cita fonti della sicurezza irlandese che collegano gli allarmi alla Russia, senza alcuna conferma ufficiale."}}},{id:"EVEN5230",p:7,cat:5,seuil:"Non déterminé",passe:!1,date:"2026-11-07",entree:"2026-11-09",src:"https://dennikn.sk/minuta/5679152/",txt:{fr:{nom:"Une vague de désinformation déferle sur la Pologne après l'attentat de Cracovie",pays:"Pologne",lieu:"Cracovie",desc:"Après l'attentat du 7 novembre à Cracovie, où un tireur a tué six personnes, une vague de fausses informations a circulé en Pologne. Le 8 novembre, le vice-Premier ministre et ministre de la Numérisation Krzysztof Gawkowski a indiqué avoir signalé plus de 2 000 comptes aux plateformes, dont des bots publiant en plusieurs langues et des dizaines de comptes utilisant le russe ou renvoyant à la Russie. Les récits les plus diffusés ont dépassé 250 millions de vues en 24 heures ; l'agence PAP en a recensé cinq (absence de police, images retouchées par IA, faux frère de l'auteur, faux second tireur, faux soldat polonais). L'expert Michał Marek a relevé que certaines de ces informations ont aussi circulé dans l'espace informationnel russe et biélorusse. Aucun lien russe n'a été établi pour l'attentat lui-même, dont le motif n'a pas été déterminé."},es:{nom:"Una ola de desinformación se abate sobre Polonia tras el atentado de Cracovia",pays:"Polonia",lieu:"Cracovia",desc:"Tras el atentado del 7 de noviembre en Cracovia, en el que un tirador mató a seis personas, circuló por Polonia una oleada de noticias falsas. El 8 de noviembre, el viceprimer ministro y ministro de Digitalización, Krzysztof Gawkowski, indicó que había denunciado más de 2 000 cuentas a las plataformas, entre ellas bots que publicaban en varios idiomas y decenas de cuentas que utilizaban el ruso o hacían referencia a Rusia. Las noticias más difundidas superaron los 250 millones de visualizaciones en 24 horas; la agencia PAP identificó cinco de ellas (ausencia de la policía, imágenes retocadas con IA, un supuesto hermano del autor, un supuesto segundo tirador y un supuesto soldado polaco). El experto Michał Marek señaló que parte de esta información también circuló en el espacio informativo ruso y bielorruso. No se ha establecido ningún vínculo con Rusia en relación con el atentado en sí, cuyo motivo aún no se ha determinado."},it:{nom:"Un'ondata di disinformazione si abbatte sulla Polonia dopo l'attentato di Cracovia",pays:"Polonia",lieu:"Cracovia",desc:"Dopo l’attentato del 7 novembre a Cracovia, in cui un uomo armato ha ucciso sei persone, in Polonia si è diffusa un’ondata di notizie false. L’8 novembre, il vice primo ministro e ministro della Digitalizzazione Krzysztof Gawkowski ha dichiarato di aver segnalato alle piattaforme oltre 2.000 account, tra cui bot che pubblicavano in diverse lingue e decine di account che utilizzavano il russo o rimandavano alla Russia. Le notizie più diffuse hanno superato i 250 milioni di visualizzazioni in 24 ore; l’agenzia PAP ne ha individuate cinque (assenza della polizia, immagini ritoccate dall’intelligenza artificiale, falso fratello dell’autore, falso secondo tiratore, falso soldato polacco). L’esperto Michał Marek ha rilevato che alcune di queste informazioni sono circolate anche nello spazio informativo russo e bielorusso. Non è stato stabilito alcun collegamento con la Russia per quanto riguarda l’attentato stesso, il cui movente non è stato determinato."}}},{id:"EVEN5197",p:7,cat:0,seuil:"Non déterminé",passe:!1,date:"2026-11-08",entree:"2026-11-09",src:"https://www.24chasa.bg/bulgaria/article/23888104",txt:{fr:{nom:"Un drone est retrouvé sur les rochers près de Sinemorets, en Bulgarie",pays:"Bulgarie",lieu:"Sinemorets, région de Bourgas",desc:"Le 8 novembre, la BNT a signalé un drone sur les rochers près de Sinemorets, sur la côte bulgare de la mer Noire. L'appareil, relativement intact, avait une aile en partie cassée ; son type et son origine n'étaient pas établis et aucune réaction officielle n'avait été rapportée."},es:{nom:"Se encuentra un dron entre las rocas cerca de Sinemorets, en Bulgaria",pays:"Bulgaria",lieu:"Sinemorets, región de Burgas",desc:"El 8 de noviembre, la BNT informó de la presencia de un dron en los acantilados cercanos a Sinemorets, en la costa búlgara del mar Negro. El aparato, relativamente intacto, tenía un ala parcialmente rota; no se determinaron su tipo ni su origen, y no se ha informado de ninguna reacción oficial."},it:{nom:"Un drone è stato rinvenuto sugli scogli nei pressi di Sinemorets, in Bulgaria",pays:"Bulgaria",lieu:"Sinemorets, regione di Burgas",desc:"L'8 novembre, la BNT ha segnalato la presenza di un drone sugli scogli vicino a Sinemorets, sulla costa bulgara del Mar Nero. Il velivolo, relativamente intatto, presentava un'ala parzialmente spezzata; il suo tipo e la sua provenienza non sono stati accertati e non è stata riportata alcuna reazione ufficiale."}}},{id:"EVENM003",p:7,cat:3,seuil:"Attribué",passe:!0,date:"2024-07-20",entree:"2026-11-10",src:"https://www.politico.eu/article/russia-hybrid-war-europe-low-level-agents/",txt:{fr:{nom:"Des colis incendiaires de juillet 2024 : dix hommes jugés en Pologne et en Lituanie",pays:"Allemagne / Royaume-Uni / Pologne / Lituanie",lieu:"Plusieurs villes",desc:"En juillet 2024, quatre colis expédiés depuis Vilnius par DHL et DPD, deux vers le Royaume-Uni et deux vers la Pologne, contiennent des mécanismes d'auto-inflammation : l'un prend feu le 20 juillet à l'aéroport de Leipzig avant son chargement dans un avion-cargo, un autre dans un camion près de Varsovie, un troisième dans un entrepôt de Birmingham, le quatrième est intercepté. Le parquet national polonais a poursuivi cinq hommes (quatre Ukrainiens et un Russe) pour action au profit du renseignement russe, usage d'explosifs et tentative de provoquer une catastrophe aérienne, des faits qu'il juge de nature terroriste ; leur procès s'est ouvert à Varsovie le 13 mars 2026. À Vilnius, le procès de cinq autres hommes pour terrorisme en groupe organisé s'est ouvert le 17 avril 2026. Un procureur lituanien a indiqué que des officiers du GRU étaient en cours d'identification. Selon Politico, le service de sécurité lituanien (VSD) a jugé très probable l'implication de trois officiers du GRU, dont Denis Smolyaninov ; les dix hommes ont nié avoir travaillé sciemment pour le renseignement russe et le procès de Vilnius devait se poursuivre jusqu'en janvier."},es:{nom:"Paquetes incendiarios de julio de 2024: diez hombres juzgados en Polonia y Lituania",pays:"Alemania / Reino Unido / Polonia / Lituania",lieu:"Varias ciudades",desc:"En julio de 2024, cuatro paquetes enviados desde Vilna por DHL y DPD, dos con destino al Reino Unido y dos a Polonia, contienen mecanismos de autoignición: uno se incendió el 20 de julio en el aeropuerto de Leipzig antes de ser cargado en un avión de carga; otro, en un camión cerca de Varsovia; un tercero, en un almacén de Birmingham; y el cuarto fue interceptado. La Fiscalía Nacional polaca procesó a cinco hombres (cuatro ucranianos y un ruso) por actuar en beneficio de los servicios de inteligencia rusos, uso de explosivos e intento de provocar una catástrofe aérea, hechos que considera de carácter terrorista; su juicio se inició en Varsovia el 13 de marzo de 2026. En Vilna, el juicio contra otros cinco hombres por terrorismo en grupo organizado se inició el 17 de abril de 2026. Un fiscal lituano indicó que se estaba procediendo a la identificación de oficiales del GRU. Según Politico, el servicio de seguridad lituano (VSD) consideró muy probable la implicación de tres oficiales del GRU, entre ellos Denis Smolyaninov; los diez hombres negaron haber trabajado a sabiendas para los servicios de inteligencia rusos y se preveía que el juicio de Vilna se prolongara hasta enero."},it:{nom:"Pacchi incendiari del luglio 2024: dieci uomini processati in Polonia e in Lituania",pays:"Germania / Regno Unito / Polonia / Lituania",lieu:"Diverse città",desc:"Nel luglio 2024, quattro pacchi spediti da Vilnius tramite DHL e DPD, due diretti nel Regno Unito e due in Polonia, contengono meccanismi di autoaccensione: uno prende fuoco il 20 luglio all’aeroporto di Lipsia prima di essere caricato su un aereo cargo, un altro in un camion vicino a Varsavia, un terzo in un magazzino di Birmingham, mentre il quarto viene intercettato. La Procura nazionale polacca ha incriminato cinque uomini (quattro ucraini e un russo) per attività a favore dei servizi segreti russi, uso di esplosivi e tentato disastro aereo, fatti che ritiene di natura terroristica; il loro processo si è aperto a Varsavia il 13 marzo 2026. A Vilnius, il 17 aprile 2026 si è aperto il processo contro altri cinque uomini per terrorismo organizzato. Un procuratore lituano ha riferito che sono in corso le indagini per identificare alcuni ufficiali del GRU. Secondo Politico, il servizio di sicurezza lituano (VSD) ha ritenuto molto probabile il coinvolgimento di tre ufficiali del GRU, tra cui Denis Smolyaninov; i dieci uomini hanno negato di aver lavorato consapevolmente per i servizi segreti russi e il processo di Vilnius avrebbe dovuto protrarsi fino a gennaio."}}},{id:"EVENM002",p:7,cat:2,seuil:"Attribué",passe:!1,date:"2026-11-03",entree:"2026-11-10",src:"https://www.reuters.com/world/poland-arrests-two-ukrainians-over-alleged-russian-espionage-sabotage-2026-11-10/",txt:{fr:{nom:"Deux Ukrainiens arrêtés en Pologne, accusés d'espionnage et de sabotage pour des services russes",pays:"Pologne",lieu:"Mińsk Mazowiecki",desc:"Le 10 novembre, l'Agence de sécurité intérieure (ABW) et le ministre coordonnateur des services spéciaux Tomasz Siemoniak annoncent l'arrestation, le 3 novembre à Mińsk Mazowiecki, de deux Ukrainiens de 24 et 25 ans, soupçonnés d'avoir agi pour le compte des services spéciaux russes. Selon l'ABW, ils ont repéré et photographié des infrastructures critiques et des sites militaires, et ont été payés, notamment en cryptomonnaies. Le parquet national leur a reproché d'avoir incendié des véhicules dans une grande ville polonaise non nommée ; selon l'ABW, ils avaient auparavant remplacé les plaques de ces véhicules par des plaques ressemblant à celles de l'armée ukrainienne. Pour le parquet, ces actes visaient à alimenter un sentiment antiukrainien ; selon Tomasz Siemoniak, cette manœuvre pouvait aussi viser à orienter les soupçons vers l'Ukraine. Le parquet a ouvert une enquête le 4 novembre pour espionnage et sabotage. Les deux hommes ont été placés en détention provisoire pour trois mois et encouraient une peine allant de dix ans de prison à la perpétuité. L'ambassade de Russie à Varsovie n'avait pas répondu à la demande de commentaire de Reuters le 10 novembre."},es:{nom:"Dos ucranianos detenidos en Polonia, acusados de espionaje y sabotaje para los servicios rusos",pays:"Polonia",lieu:"Mińsk Mazowiecki",desc:"El 10 de noviembre, la Agencia de Seguridad Interna (ABW) y el ministro coordinador de los servicios especiales, Tomasz Siemoniak, anunciaron la detención, el 3 de noviembre en Mińsk Mazowiecki, de dos ucranianos de 24 y 25 años, sospechosos de haber actuado por cuenta de los servicios secretos rusos. Según la ABW, localizaron y fotografiaron infraestructuras críticas y instalaciones militares, y recibieron a cambio una remuneración, en particular en criptomonedas. La Fiscalía Nacional les imputa haber incendiado vehículos en una gran ciudad polaca no identificada; según la ABW, previamente habían sustituido las matrículas de dichos vehículos por otras similares a las del ejército ucraniano. Para la Fiscalía, estos actos tenían como objetivo avivar el sentimiento antiucraniano; según Tomasz Siemoniak, esta maniobra también podría haber tenido como fin desviar las sospechas hacia Ucrania. La Fiscalía abrió una investigación el 4 de noviembre por espionaje y sabotaje. Los dos hombres fueron puestos en prisión preventiva durante tres meses y se enfrentaban a una pena que oscilaba entre los diez años de cárcel y la cadena perpetua. La embajada de Rusia en Varsovia no había respondido a la solicitud de comentarios de Reuters el 10 de noviembre."},it:{nom:"Due ucraini arrestati in Polonia, accusati di spionaggio e sabotaggio per conto dei servizi russi",pays:"Polonia",lieu:"Mińsk Mazowiecki",desc:"Il 10 novembre, l’Agenzia per la sicurezza interna (ABW) e il ministro coordinatore dei servizi segreti Tomasz Siemoniak hanno annunciato l’arresto, avvenuto il 3 novembre a Mińsk Mazowiecki, di due ucraini di 24 e 25 anni, sospettati di aver agito per conto dei servizi segreti russi. Secondo l’ABW, i due avrebbero individuato e fotografato infrastrutture critiche e siti militari, ricevendo in cambio un compenso, in particolare in criptovalute. La Procura nazionale li ha accusati di aver dato fuoco a dei veicoli in una grande città polacca non specificata; secondo l’ABW, in precedenza avevano sostituito le targhe di tali veicoli con targhe simili a quelle dell’esercito ucraino. Secondo la procura, tali atti miravano ad alimentare un sentimento anti-ucraino; secondo Tomasz Siemoniak, questa manovra poteva anche avere lo scopo di indirizzare i sospetti verso l’Ucraina. La procura ha avviato un’indagine il 4 novembre per spionaggio e sabotaggio. I due uomini sono stati posti in custodia cautelare per tre mesi e rischiavano una pena che andava dai dieci anni di reclusione all’ergastolo. L’ambasciata russa a Varsavia non aveva risposto alla richiesta di commento da parte di Reuters il 10 novembre."}}},{id:"EVEN5372",p:7,cat:0,seuil:"Non déterminé",passe:!1,date:"2026-11-09",entree:"2026-11-10",src:"https://hotnews.ro/ro-alert-in-tulcea-dupa-detectarea-unei-tinte-aeriene-in-apropiere-de-frontierele-romaniei-avioane-de-vanatoare-ridicate-de-la-sol-2399348",txt:{fr:{nom:"Deux F-16 roumains décollent après la détection d'une cible aérienne au nord-est de Sulina",pays:"Roumanie",lieu:"Au nord-est de Sulina",desc:"Le 9 novembre, le ministère roumain de la Défense indique qu'une cible aérienne a été détectée à environ 30 kilomètres au nord-est de Sulina, dans l'espace aérien ukrainien. Deux F-16 roumains décollent de la base aérienne de Fetești en mission de police aérienne et un message RO-Alert est envoyé à 17h19 dans l'est du comté de Tulcea. Aucune pénétration de l'espace aérien roumain n'a été mentionnée ; aucune autorité n'a attribué la cible à un acteur."},es:{nom:"Dos F-16 rumanos despegan tras la detección de un objetivo aéreo al noreste de Sulina",pays:"Rumanía",lieu:"Al noreste de Sulina",desc:"El 9 de noviembre, el Ministerio de Defensa rumano informó de que se había detectado un objetivo aéreo a unos 30 kilómetros al noreste de Sulina, en el espacio aéreo ucraniano. Dos F-16 rumanos despegaron de la base aérea de Fetești en una misión de policía aérea y se envió un mensaje RO-Alert a las 17:19 h en el este del condado de Tulcea. No se ha mencionado ninguna incursión en el espacio aéreo rumano; ninguna autoridad ha atribuido el objetivo a ningún actor."},it:{nom:"Due F-16 rumeni decollano dopo l’individuazione di un bersaglio aereo a nord-est di Sulina",pays:"Romania",lieu:"A nord-est di Sulina",desc:"Il 9 novembre, il Ministero della Difesa rumeno comunica che è stato individuato un bersaglio aereo a circa 30 chilometri a nord-est di Sulina, nello spazio aereo ucraino. Due F-16 rumeni decollano dalla base aerea di Fetești per una missione di pattugliamento aereo e alle 17:19 viene inviato un messaggio RO-Alert nella parte orientale della contea di Tulcea. Non è stata segnalata alcuna violazione dello spazio aereo rumeno; nessuna autorità ha attribuito il bersaglio a un soggetto specifico."}}},{id:"EVENM004",p:7,cat:0,seuil:"Non déterminé",passe:!1,date:"2026-09-26",entree:"2026-11-11",src:"https://www.euronews.ro/articole/o-drona-a-patruns-in-spatiul-aerian-al-romaniei-in-zona-chilia-veche-mesaj-ro-ale",txt:{fr:{nom:"Une cible aérienne entre dans l'espace aérien roumain près de Chilia Veche et disparaît des radars près de Pardina",pays:"Roumanie",lieu:"Chilia Veche",desc:"Dans la nuit du 26 septembre, le ministère roumain de la Défense indique que son radar a détecté une cible aérienne près de Chilia Veche, à la frontière fluviale avec l'Ukraine. Selon le ministère, la cible entre dans l'espace aérien national et suit pendant quelques minutes un trajet presque parallèle au bras de Chilia, avant que le contact radar soit perdu près de Pardina. Un message RO-Alert est envoyé à 23h32 aux habitants du nord du comté de Tulcea ; deux F-18 espagnols de la police aérienne renforcée de l'OTAN et un hélicoptère roumain IAR-330 décollent. L'alerte prend fin à 0h48. Le ministère n'a précisé ni la nature ni l'origine de la cible."},es:{nom:"Un objetivo aéreo entra en el espacio aéreo rumano cerca de Chilia Veche y desaparece de los radares cerca de Pardina",pays:"Rumanía",lieu:"Chilia Veche",desc:"En la noche del 26 de septiembre, el Ministerio de Defensa rumano informó de que su radar había detectado un objetivo aéreo cerca de Chilia Veche, en la frontera fluvial con Ucrania. Según el ministerio, el objetivo entra en el espacio aéreo nacional y sigue durante unos minutos una trayectoria casi paralela al brazo de Chilia, antes de que se pierda el contacto por radar cerca de Pardina. A las 23:32 se envía un mensaje RO-Alert a los habitantes del norte del condado de Tulcea; despegan dos F-18 españoles de la policía aérea reforzada de la OTAN y un helicóptero rumano IAR-330. La alerta finaliza a las 0:48. El Ministerio no ha precisado ni la naturaleza ni el origen del objetivo."},it:{nom:"Un bersaglio aereo entra nello spazio aereo rumeno nei pressi di Chilia Veche e scompare dai radar nei pressi di Pardina",pays:"Romania",lieu:"Chilia Veche",desc:"Nella notte del 26 settembre, il Ministero della Difesa rumeno ha comunicato che il proprio radar ha individuato un bersaglio aereo nei pressi di
