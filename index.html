Chilia Veche, al confine fluviale con l’Ucraina. Secondo il ministero, il bersaglio entra nello spazio aereo nazionale e segue per alcuni minuti una traiettoria quasi parallela al braccio di Chilia, prima che il contatto radar venga perso nei pressi di Pardina. Alle 23:32 viene inviato un messaggio RO-Alert agli abitanti della parte settentrionale della contea di Tulcea; due F-18 spagnoli della polizia aerea rafforzata della NATO e un elicottero rumeno IAR-330 decollano. L’allerta termina alle 00:48. Il ministero non ha specificato né la natura né l’origine del bersaglio."}}},{id:"EVENM006",p:7,cat:0,seuil:"Non déterminé",passe:!1,date:"2026-09-26",entree:"2026-11-11",src:"https://www.eurointegration.com.ua/eng/news/2026/09/29/7246510/",txt:{fr:{nom:"Des fragments de drone découverts par la police aux frontières près de Volintiri, en Moldavie",pays:"Moldavie",lieu:"Volintiri, raion de Ștefan Vodă",desc:"Le 26 septembre 2026 au soir, la police aux frontières moldave, alertée par des habitants, intervient vers 20h25 dans un champ à la sortie du village de Volintiri, dans le raion de Ștefan Vodă, près de la frontière avec l'Ukraine, où des fragments d'un drone ont été découverts. La zone est sécurisée et des vérifications sont engagées ; la police aux frontières indique rester en contact avec les autorités ukrainiennes. Aucune information officielle n'a été donnée sur le type ni l'origine de l'appareil."},es:{nom:"La policía de fronteras ha hallado restos de un dron cerca de Volintiri, en Moldavia",pays:"Moldavia",lieu:"Volintiri, raión de Ștefan Vodă",desc:"La noche del 26 de septiembre de 2026, la policía de fronteras de Moldavia, alertada por los vecinos, interviene hacia las 20:25 h en un campo a las afueras del pueblo de Volintiri, en el raion de Ștefan Vodă, cerca de la frontera con Ucrania, donde se han hallado fragmentos de un dron. Se acordonó la zona y se iniciaron las comprobaciones; la policía de fronteras indicó que se mantenía en contacto con las autoridades ucranianas. No se facilitó ninguna información oficial sobre el tipo ni el origen del aparato."},it:{nom:"Frammenti di un drone rinvenuti dalla polizia di frontiera nei pressi di Volintiri, in Moldavia",pays:"Moldavia",lieu:"Volintiri, distretto di Ștefan Vodă",desc:"La sera del 26 settembre 2026, la polizia di frontiera moldava, allertata dai residenti, interviene verso le 20:25 in un campo alle porte del villaggio di Volintiri, nel raion di Ștefan Vodă, vicino al confine con l’Ucraina, dove sono stati rinvenuti frammenti di un drone. L’area viene messa in sicurezza e vengono avviate le verifiche; la polizia di frontiera dichiara di essere in contatto con le autorità ucraine. Non sono state fornite informazioni ufficiali sul tipo né sull’origine del velivolo."}}},{id:"EVENM005",p:7,cat:0,seuil:"Non déterminé",passe:!1,date:"2026-09-27",entree:"2026-11-11",src:"https://www.stiripesurse.ro/defence-ministry-drone-enters-romanian-airspace-mapn-team-heads-to-tulcea-to-investigate_3923698",txt:{fr:{nom:"Une cible aérienne entre en Roumanie par Ceatalchioi et longe la frontière une dizaine de minutes",pays:"Roumanie",lieu:"Ceatalchioi",desc:"Le 27 septembre au soir, le ministère roumain de la Défense indique avoir détecté une cible aérienne au nord de Chilia Veche, au-dessus du territoire ukrainien, près de la frontière. Deux F-16 roumains décollent de la base aérienne 86 de Borcea, et un message RO-Alert est envoyé à 20h35 pour le comté de Tulcea. Selon les données radar, la cible entre dans l'espace aérien roumain par la zone de Ceatalchioi et longe la frontière ; son signal disparaît après une dizaine de minutes près de Somova. L'alerte prend fin à 22h05. Le 28 septembre, le ministère annonce l'envoi d'une équipe spécialisée dans la zone. Il n'a pas précisé l'origine de la cible."},es:{nom:"Un objetivo aéreo entra en Rumanía por Ceatalchioi y recorre la frontera durante unos diez minutos.",pays:"Rumanía",lieu:"Ceatalchioi",desc:"La noche del 27 de septiembre, el Ministerio de Defensa rumano informó de que había detectado un objetivo aéreo al norte de Chilia Veche, sobre territorio ucraniano, cerca de la frontera. Dos F-16 rumanos despegan de la base aérea 86 de Borcea y, a las 20:35, se envía un mensaje RO-Alert al condado de Tulcea. Según los datos del radar, el objetivo entra en el espacio aéreo rumano por la zona de Ceatalchioi y bordea la frontera; su señal desaparece tras unos diez minutos cerca de Somova. La alerta finaliza a las 22:05. El 28 de septiembre, el Ministerio anunció el envío de un equipo especializado a la zona. No precisó el origen del objetivo."},it:{nom:"Un bersaglio aereo entra in Romania da Ceatalchioi e percorre il confine per una decina di minuti",pays:"Romania",lieu:"Ceatalchioi",desc:"La sera del 27 settembre, il Ministero della Difesa rumeno ha comunicato di aver individuato un bersaglio aereo a nord di Chilia Veche, sopra il territorio ucraino, vicino al confine. Due F-16 rumeni decollano dalla base aerea 86 di Borcea e alle 20:35 viene inviato un messaggio RO-Alert per la contea di Tulcea. Secondo i dati radar, il bersaglio entra nello spazio aereo rumeno dalla zona di Ceatalchioi e costeggia il confine; il suo segnale scompare dopo una decina di minuti nei pressi di Somova. L’allerta termina alle 22:05. Il 28 settembre, il ministero annuncia l’invio di una squadra specializzata nella zona. Non ha specificato l’origine del bersaglio."}}},{id:"EVEN5591",p:7,cat:4,seuil:"Attribué",passe:!1,date:"2026-11-10",entree:"2026-11-11",src:"https://apnews.com/article/us-soldier-espionage-britain-russia-f1a3d4abf8233d064e246e4de0ad21f4",txt:{fr:{nom:"Un militaire américain de 41 ans arrêté près de Gloucester, soupçonné d'espionnage lié à la Russie",pays:"Royaume-Uni",lieu:"Gloucester",desc:"Le 10 novembre 2026, la police métropolitaine de Londres annonce que les services antiterroristes britanniques, en lien avec les autorités américaines, l'armée américaine et le FBI, ont arrêté près de Gloucester un militaire américain de 41 ans, soupçonné d'infractions aux sections 1 et 3 du National Security Act 2023. Le communiqué indique : « Le pays auquel les allégations se rapportent est la Russie. » Deux lieux du Gloucestershire ont été perquisitionnés. Selon trois responsables anonymes (américain, de l'OTAN et britannique), il servait dans le Corps de réaction rapide allié de l'OTAN, à Imjin Barracks. Le directeur du FBI, Kash Patel, parle d'une « arrestation importante ». Le 11 novembre, le porte-parole du Kremlin, Dmitri Peskov, déclare que la Russie n'a « aucun lien avec cela ». Le 17 novembre 2026, la police métropolitaine annonce que le suspect, identifié par un responsable américain comme un lieutenant-colonel, a été placé en détention par l'armée américaine ; selon Laurence Taylor, chef de la police antiterroriste, l'enquête a été confiée aux autorités américaines, une décision prise « conformément aux protocoles internationaux existants »."},es:{nom:"Detienen cerca de Gloucester a un militar estadounidense de 41 años, sospechoso de espionaje vinculado a Rusia",pays:"Reino Unido",lieu:"Gloucester",desc:"El 10 de noviembre de 2026, la Policía Metropolitana de Londres anuncia que los servicios antiterroristas británicos, en colaboración con las autoridades estadounidenses, el ejército estadounidense y el FBI, han detenido cerca de Gloucester a un militar estadounidense de 41 años, sospechoso de infringir los artículos 1 y 3 de la Ley de Seguridad Nacional de 2023. El comunicado indica: «El país al que se refieren las acusaciones es Rusia». Se han registrado dos locales en Gloucestershire. Según tres responsables anónimos (uno estadounidense, otro de la OTAN y otro británico), prestaba servicio en el Cuerpo de Reacción Rápida Aliado de la OTAN, en Imjin Barracks. El director del FBI, Kash Patel, habla de una «detención importante». El 11 de noviembre, el portavoz del Kremlin, Dmitri Peskov, declaró que Rusia «no tiene nada que ver con esto». El 17 de noviembre de 2026, la Policía Metropolitana anuncia que el sospechoso, identificado por un responsable estadounidense como teniente coronel, ha sido detenido por el ejército estadounidense; según Laurence Taylor, jefe de la policía antiterrorista, la investigación se ha encomendado a las autoridades estadounidenses, una decisión tomada «de conformidad con los protocolos internacionales vigentes»."},it:{nom:"Arrestato nei pressi di Gloucester un militare statunitense di 41 anni, sospettato di spionaggio a favore della Russia",pays:"Regno Unito",lieu:"Gloucester",desc:"Il 10 novembre 2026, la polizia metropolitana di Londra annuncia che i servizi antiterrorismo britannici, in collaborazione con le autorità statunitensi, l’esercito americano e l’FBI, hanno arrestato nei pressi di Gloucester un militare americano di 41 anni, sospettato di violazioni delle sezioni 1 e 3 del National Security Act 2023. Il comunicato precisa: «Il Paese a cui si riferiscono le accuse è la Russia». Sono stati perquisiti due luoghi nel Gloucestershire. Secondo tre funzionari anonimi (uno statunitense, uno della NATO e uno britannico), l’uomo prestava servizio nel Corpo di reazione rapida alleato della NATO, presso la caserma di Imjin. Il direttore dell’FBI, Kash Patel, parla di un «arresto importante». L’11 novembre, il portavoce del Cremlino, Dmitri Peskov, ha dichiarato che la Russia non ha «alcun legame con questa vicenda». Il 17 novembre 2026, la polizia metropolitana annuncia che il sospettato, identificato da un funzionario statunitense come un tenente colonnello, è stato posto in stato di detenzione dall’esercito americano; secondo Laurence Taylor, capo della polizia antiterrorismo, l’indagine è stata affidata alle autorità statunitensi, una decisione presa «in conformità con i protocolli internazionali esistenti»."}}},{id:"EVEN5641",p:7,cat:0,seuil:"Non déterminé",passe:!1,date:"2026-11-11",entree:"2026-11-11",src:"https://www.reuters.com/world/latvia-lithuania-warn-threat-airspace-near-belarus-2026-11-10/",txt:{fr:{nom:"Plusieurs drones entrent dans l'espace aérien des États baltes dans la nuit du 10 au 11 novembre",pays:"Lituanie / Lettonie / Estonie",lieu:"Kaunas",desc:"Dans la nuit du 10 au 11 novembre, des alertes aériennes sont déclenchées en Lituanie, en Lettonie et en Estonie après l'entrée d'au moins quatre drones dans l'espace aérien des États baltes, selon Reuters, alors que l'Ukraine attaque le nord-ouest de la Russie. Selon le chef d'état-major lituanien Giedrius Premeneckas, cité par LRT, trois drones sont repérés côté biélorusse en direction de la Lettonie ; un quatrième, repéré vers 1h20, entre en Lituanie depuis la Biélorussie, pénètre brièvement en Pologne puis revient en Lituanie. Les chasseurs de l'OTAN ne l'abattent pas près de Kaunas, zone urbanisée ; deux tirs échouent ensuite, et un missile s'autodétruit (débris retrouvés à Biržai, selon le Premier ministre Mindaugas Sinkevičius). Selon le chef d'état-major, le drone passe en Lettonie, atteint l'Estonie puis le territoire russe ; il dit qu'on ne sait pas quel drone est entré et suppose un appareil perturbé lors de l'attaque ukrainienne. Reuters cite son propos : « aucune information confirmée sur le caractère ukrainien ou russe du drone ». Le Commandement opérationnel polonais n'a pas confirmé de violation de l'espace aérien polonais. Aucun blessé n'a été signalé."},es:{nom:"Varios drones penetran en el espacio aéreo de los países bálticos durante la noche del 10 al 11 de noviembre",pays:"Lituania / Letonia / Estonia",lieu:"Kaunas",desc:"Durante la noche del 10 al 11 de noviembre, se activaron alertas aéreas en Lituania, Letonia y Estonia tras la entrada de al menos cuatro drones en el espacio aéreo de los Estados bálticos, según Reuters, mientras Ucrania atacaba el noroeste de Rusia. Según el jefe del Estado Mayor lituano, Giedrius Premeneckas, citado por LRT, se avistaron tres drones procedentes de Bielorrusia en dirección a Letonia; un cuarto, avistado hacia la 1:20, entra en Lituania desde Bielorrusia, penetra brevemente en Polonia y luego regresa a Lituania. Los cazas de la OTAN no lo derriban cerca de Kaunas, una zona urbanizada; a continuación, fallan dos disparos y un misil se autodestruye (se han encontrado restos en Biržai, según el primer ministro Mindaugas Sinkevičius). Según el jefe del Estado Mayor, el dron sobrevuela Letonia, llega a Estonia y, a continuación, al territorio ruso; afirma que se desconoce qué dron ha entrado y supone que se trata de un aparato que quedó fuera de control durante el ataque ucraniano. Reuters cita sus palabras: «No hay información confirmada sobre si el dron era ucraniano o ruso». El Mando Operativo polaco no ha confirmado ninguna violación del espacio aéreo polaco. No se han registrado heridos."},it:{nom:"Diversi droni penetrano nello spazio aereo degli Stati baltici nella notte tra il 10 e l'11 novembre",pays:"Lituania / Lettonia / Estonia",lieu:"Kaunas",desc:"Nella notte tra il 10 e l’11 novembre, in Lituania, Lettonia ed Estonia sono stati attivati allarmi aerei dopo che almeno quattro droni sono entrati nello spazio aereo degli Stati baltici, secondo quanto riportato da Reuters, mentre l’Ucraina attaccava il nord-ovest della Russia. Secondo il capo di Stato Maggiore lituano Giedrius Premeneckas, citato da LRT, tre droni sono stati avvistati dal lato bielorusso in direzione della Lettonia; un quarto, avvistato verso l’1:20, entra in Lituania dalla Bielorussia, penetra brevemente in Polonia e poi ritorna in Lituania. I caccia della NATO non lo abbattono nei pressi di Kaunas, zona urbanizzata; seguono due tentativi falliti di abbattimento e un missile si autodistrugge (i detriti sono stati ritrovati a Biržai, secondo il primo ministro Mindaugas Sinkevičius). Secondo il capo di Stato Maggiore, il drone attraversa la Lettonia, raggiunge l’Estonia e poi il territorio russo; afferma che non si sa quale drone sia entrato e ipotizza che si tratti di un velivolo danneggiato durante l’attacco ucraino. Reuters riporta le sue parole: «non vi sono informazioni confermate sulla provenienza ucraina o russa del drone». Il Comando operativo polacco non ha confermato alcuna violazione dello spazio aereo polacco. Non sono stati segnalati feriti."}}},{id:"EVEN5742",p:7,cat:4,seuil:"Attribué",passe:!0,date:"2025-12-23",entree:"2026-11-12",src:"https://www.sri.ro/articole/comunicat-de-presa-11-11-2026.html",txt:{fr:{nom:"Une cyberattaque vise le serveur de messagerie d'une institution gouvernementale roumaine",pays:"Roumanie",lieu:"Site non identifié",desc:"Le 11 novembre 2026, le Service roumain de renseignement (SRI) publie des précisions sur la tentative de compromission, fin 2025, d'une institution gouvernementale roumaine par l'acteur cybernétique russe APT Turla, considéré comme faisant partie du Service fédéral de sécurité (FSB). Selon ESET, le serveur de messagerie de l'institution était compromis au moins depuis le 23 décembre 2025, et un programme qui y était installé recherchait les échanges avec des adresses institutionnelles de l'OTAN et de l'Union. Selon le SRI, son Centre national Cyberint a identifié l'attaque en décembre 2025 ; les attaquants ont exploité une série de vulnérabilités des systèmes d'exploitation Microsoft, l'attaque a été stoppée, aucune exfiltration de données sensibles n'a été identifiée et le service de messagerie a été réparé. Le SRI indique mener des mesures d'enquête visant d'autres opérations liées à « des campagnes cybernétiques mises en œuvre par la Fédération de Russie ». Ni le SRI ni ESET ne nomment l'institution visée."},es:{nom:"Un ciberataque tiene como objetivo el servidor de correo electrónico de una institución gubernamental rumana",pays:"Rumanía",lieu:"Sitio web no identificado",desc:"El 11 de noviembre de 2026, el Servicio de Inteligencia Rumano (SRI) publicó detalles sobre el intento de ataque, a finales de 2025, contra una institución gubernamental rumana por parte del actor cibernético ruso APT Turla, considerado parte del Servicio Federal de Seguridad (FSB). Según ESET, el servidor de correo electrónico de la institución llevaba comprometido al menos desde el 23 de diciembre de 2025, y un programa instalado en él buscaba comunicaciones con direcciones institucionales de la OTAN y de la Unión. Según el SRI, su Centro Nacional de Ciberinteligencia identificó el ataque en diciembre de 2025; los atacantes aprovecharon una serie de vulnerabilidades de los sistemas operativos de Microsoft, el ataque fue detenido, no se identificó ninguna filtración de datos sensibles y se reparó el servicio de correo electrónico. El SRI indica que está llevando a cabo medidas de investigación dirigidas a otras operaciones relacionadas con «campañas cibernéticas llevadas a cabo por la Federación de Rusia». Ni el SRI ni ESET nombran a la institución afectada."},it:{nom:"Un attacco informatico prende di mira il server di posta elettronica di un’istituzione governativa rumena",pays:"Romania",lieu:"Sito non identificato",desc:"L’11 novembre 2026, il Servizio di intelligence rumeno (SRI) ha pubblicato ulteriori dettagli sul tentativo, avvenuto alla fine del 2025, di compromettere un’istituzione governativa rumena da parte dell’attore cibernetico russo APT Turla, considerato parte del Servizio federale di sicurezza (FSB). Secondo ESET, il server di posta elettronica dell’istituzione era stato compromesso almeno dal 23 dicembre 2025 e un programma ivi installato monitorava le comunicazioni con indirizzi istituzionali della NATO e dell’Unione. Secondo l’SRI, il suo Centro nazionale Cyberint ha individuato l’attacco nel dicembre 2025; gli autori dell’attacco hanno sfruttato una serie di vulnerabilità dei sistemi operativi Microsoft; l’attacco è stato bloccato, non è stata rilevata alcuna esfiltrazione di dati sensibili e il servizio di posta elettronica è stato ripristinato. L’SRI riferisce di stare conducendo indagini su altre operazioni legate a «campagne informatiche messe in atto dalla Federazione Russa». Né l’SRI né ESET indicano il nome dell’istituzione presa di mira."}}},{id:"EVEN5722",p:7,cat:0,seuil:"Attribué",passe:!1,date:"2026-11-11",entree:"2026-11-12",src:"https://www.jurnal.md/ro/news/132ab25cf1958991/mae-condamna-incalcarea-spatiului-aerian-al-r-moldova-de-catre-doua-rachete-banderol-amenintare-directa-pentru-cetateni.html",txt:{fr:{nom:"Deux missiles de croisière Banderol violent l'espace aérien moldave le 11 novembre",pays:"Moldavie",lieu:"Tudora, raion de Ștefan Vodă ; Pervomaisc",desc:"Le 11 novembre 2026 au matin, deux missiles de croisière de type Banderol (S8000) pénètrent dans l'espace aérien moldave, selon le système national intégré de surveillance, pendant les attaques massives de la Russie contre l'Ukraine. Le premier franchit la frontière à 6h04 depuis la région d'Odessa en direction du village de Tudora, dans le raion de Ștefan Vodă, et ressort à 6h09 ; le second la franchit à 6h06 en direction de Pervomaisc, sur le segment transnistrien de la frontière, et ressort à 6h10. Le ministère moldave des Affaires étrangères condamne fermement cette violation : « Cet incident constitue une violation grave de la souveraineté de la République de Moldavie et une menace directe pour la sécurité et la sûreté des citoyens. » Il demande à la Russie de « cesser l'agression militaire et les actions qui mettent en danger la paix et la stabilité régionales »."},es:{nom:"Dos misiles de crucero «Banderol» violaron el espacio aéreo moldavo el 11 de noviembre",pays:"Moldavia",lieu:"Tudora, raión de Ștefan Vodă; Pervomaisc",desc:"La mañana del 11 de noviembre de 2026, dos misiles de crucero del tipo Banderol (S8000) penetran en el espacio aéreo moldavo, según el sistema nacional integrado de vigilancia, durante los ataques masivos de Rusia contra Ucrania. El primero cruza la frontera a las 6:04 desde la región de Odesa en dirección al pueblo de Tudora, en el raión de Ștefan Vodă, y sale de ella a las 6:09; el segundo la cruzó a las 6:06 h en dirección a Pervomaisc, en el tramo transnistrio de la frontera, y salió a las 6:10 h. El Ministerio de Asuntos Exteriores de Moldavia condena enérgicamente esta violación: «Este incidente constituye una grave violación de la soberanía de la República de Moldavia y una amenaza directa para la seguridad y la protección de los ciudadanos». Insta a Rusia a «cesar la agresión militar y las acciones que ponen en peligro la paz y la estabilidad regionales»."},it:{nom:"Due missili da crociera Banderol violano lo spazio aereo moldavo l'11 novembre",pays:"Moldavia",lieu:"Tudora, distretto di Ștefan Vodă; Pervomaisc",desc:"La mattina dell’11 novembre 2026, secondo il sistema nazionale integrato di sorveglianza, due missili da crociera di tipo Banderol (S8000) penetrano nello spazio aereo moldavo, durante i massicci attacchi della Russia contro l’Ucraina. Il primo attraversa il confine alle 6:04 dalla regione di Odessa in direzione del villaggio di Tudora, nel raion di Ștefan Vodă, e ne esce alle 6:09; il secondo la attraversa alle 6:06 in direzione di Pervomaisc, sul tratto transnistriano del confine, ed esce alle 6:10. Il Ministero degli Affari Esteri moldavo condanna fermamente questa violazione: «Questo incidente costituisce una grave violazione della sovranità della Repubblica di Moldavia e una minaccia diretta alla sicurezza e all’incolumità dei cittadini». Chiede alla Russia di «cessare l’aggressione militare e le azioni che mettono in pericolo la pace e la stabilità regionali»."}}},{id:"EVEN5751",p:7,cat:0,seuil:"Non déterminé",passe:!1,date:"2026-11-11",entree:"2026-11-12",src:"https://yle.fi/a/74-20256350",txt:{fr:{nom:"Un drone soupçonné d'avoir violé l'espace aérien finlandais dans l'est du golfe de Finlande",pays:"Finlande",lieu:"Est du golfe de Finlande",desc:"Le 11 novembre 2026, peu après 2h, un drone est soupçonné d'avoir violé l'espace aérien finlandais dans l'est du golfe de Finlande pendant environ cinq minutes avant d'en sortir, selon le ministère finlandais de la Défense. Les forces armées mettent en place des restrictions temporaires de la navigation aérienne (à 2h09) et maritime (à 2h15) dans l'est du golfe de Finlande, en raison de drones non identifiés, puis les lèvent peu avant 8h ; des F/A-18 Hornet assurent la surveillance de l'espace aérien au-dessus de la région de Lappeenranta pendant près de trois heures. Le ministre de la Défense, Antti Häkkänen, déclare : « Nous prenons ce qui s'est passé au sérieux. L'enquête sur les événements se poursuit. » Le ministère ne précise ni le type de l'appareil ni sa provenance ; la garde-frontière enquête. Dans la nuit, l'Ukraine avait lancé une attaque de drones contre le port pétrolier russe d'Ust-Luga ; le gouverneur de la région de Leningrad, Alexandre Drozdenko, affirme que la défense antiaérienne russe a abattu au moins 140 drones."},es:{nom:"Un dron sospechoso de haber violado el espacio aéreo finlandés en el este del golfo de Finlandia",pays:"Finlandia",lieu:"Al este del golfo de Finlandia",desc:"El 11 de noviembre de 2026, poco después de las 2:00, se sospecha que un dron violó el espacio aéreo finlandés en el este del golfo de Finlandia durante unos cinco minutos antes de salir de él, según el Ministerio de Defensa finlandés. Las Fuerzas Armadas establecen restricciones temporales a la navegación aérea (a las 2:09) y marítima (a las 2:15) en el este del golfo de Finlandia, debido a la presencia de drones no identificados, y las levantan poco antes de las 8:00; unos F/A-18 Hornet se encargaron de vigilar el espacio aéreo sobre la región de Lappeenranta durante casi tres horas. El ministro de Defensa, Antti Häkkänen, declaró: «Nos tomamos muy en serio lo ocurrido. La investigación sobre los hechos continúa». El Ministerio no especifica ni el tipo de aeronave ni su procedencia; la guardia fronteriza está investigando. Durante la noche, Ucrania había lanzado un ataque con drones contra el puerto petrolero ruso de Ust-Luga; el gobernador de la región de Leningrado, Alexandre Drozdenko, afirma que la defensa antiaérea rusa derribó al menos 140 drones."},it:{nom:"Un drone sospettato di aver violato lo spazio aereo finlandese nella parte orientale del Golfo di Finlandia",pays:"Finlandia",lieu:"A est del Golfo di Finlandia",desc:"L'11 novembre 2026, poco dopo le 2:00, secondo il Ministero della Difesa finlandese, un drone avrebbe violato lo spazio aereo finlandese nella parte orientale del Golfo di Finlandia per circa cinque minuti prima di uscirne. Le forze armate hanno imposto restrizioni temporanee al traffico aereo (alle 2:09) e marittimo (alle 2:15) nella parte orientale del Golfo di Finlandia, a causa della presenza di droni non identificati, per poi revocarle poco prima delle 8:00; alcuni F/A-18 Hornet hanno sorvegliato lo spazio aereo sopra la regione di Lappeenranta per quasi tre ore. Il ministro della Difesa, Antti Häkkänen, ha dichiarato: «Prendiamo sul serio quanto accaduto. Le indagini sugli eventi proseguono». Il ministero non precisa né il tipo di velivolo né la sua provenienza; la guardia di frontiera sta indagando. Durante la notte, l’Ucraina aveva sferrato un attacco con droni contro il porto petrolifero russo di Ust-Luga; il governatore della regione di Leningrado, Alexandre Drozdenko, afferma che la difesa antiaerea russa ha abbattuto almeno 140 droni."}}},{id:"EVEN5781",p:7,cat:0,seuil:"Non déterminé",passe:!1,date:"2026-11-11",entree:"2026-11-12",src:"https://stirileprotv.ro/stiri/actualitate/drona-observata-ca-se-indreapta-spre-romania-ro-alert-in-tulcea-au-fost-ridicate-doua-f-16.html",txt:{fr:{nom:"Deux F-16 roumains décollent après la détection d'une cible aérienne à l'est de l'île des Serpents",pays:"Roumanie",lieu:"À l'est de l'île des Serpents",desc:"Le 11 novembre 2026 au soir, le système de surveillance radar du ministère roumain de la Défense détecte une cible aérienne à l'est de l'île des Serpents. Un message RO-Alert est envoyé à 21h32 aux habitants du nord du comté de Tulcea pour une « possible incursion de drones » ; deux F-16 roumains de la police aérienne décollent de la base aérienne 71 de Câmpia Turzii. Selon le ministère, aucune pénétration de l'espace aérien national n'a été signalée ; l'alerte prend fin à 22h17. Le ministère ne précise ni la nature ni l'origine de la cible."},es:{nom:"Dos F-16 rumanos despegan tras la detección de un objetivo aéreo al este de la Isla de las Serpientes",pays:"Rumanía",lieu:"Al este de la Isla de las Serpientes",desc:"La noche del 11 de noviembre de 2026, el sistema de vigilancia por radar del Ministerio de Defensa rumano detecta un objetivo aéreo al este de la isla de las Serpientes. A las 21:32 se envía un mensaje RO-Alert a los habitantes del norte del condado de Tulcea por una «posible incursión de drones»; dos F-16 rumanos de la policía aérea despegan de la base aérea 71 de Câmpia Turzii. Según el Ministerio, no se ha señalado ninguna intrusión en el espacio aéreo nacional; la alerta finaliza a las 22:17. El Ministerio no especifica ni la naturaleza ni el origen del objetivo."},it:{nom:"Due F-16 rumeni decollano dopo l’individuazione di un bersaglio aereo a est dell’Isola dei Serpenti",pays:"Romania",lieu:"A est dell’Isola dei Serpenti",desc:"La sera dell’11 novembre 2026, il sistema di sorveglianza radar del Ministero della Difesa rumeno rileva un bersaglio aereo a est dell’Isola dei Serpenti. Alle 21:32 viene inviato un messaggio RO-Alert agli abitanti della parte settentrionale della contea di Tulcea per una «possibile incursione di droni»; due F-16 rumeni della polizia aerea decollano dalla base aerea 71 di Câmpia Turzii. Secondo il ministero, non è stata segnalata alcuna violazione dello spazio aereo nazionale; l’allerta termina alle 22:17. Il ministero non precisa né la natura né l’origine del bersaglio."}}},{id:"EVEN5851",p:7,cat:2,seuil:"Attribué",passe:!0,date:"2025-11-15",entree:"2026-11-13",src:"https://www.gov.pl/web/prokuratura-krajowa/akt-oskarzenia-przeciwko-volodymyrowi-b-za-pomoc-w-aktach-dywersji-na-kolei",txt:{fr:{nom:"Un Ukrainien renvoyé devant la justice polonaise pour avoir aidé au sabotage de la ligne ferroviaire Varsovie-Lublin",pays:"Pologne",lieu:"Mika et Gołąb",desc:"Le 15 novembre 2025, deux Ukrainiens, Oleksandr K. et Yevhenii I., font exploser une charge posée sur la voie ferrée à Mika, dans le district de Garwolin, au passage d'un train de marchandises, selon le parquet national polonais. Entre le 1er octobre et le 16 novembre 2025, ils ont aussi fixé sur les rails à Gołąb, dans le district de Puławy, deux éléments métalliques pouvant faire dérailler des trains ; sur cette ligne, un train transportant 475 passagers a dû s'arrêter en urgence. Devant la Diète, le Premier ministre Donald Tusk a qualifié la hausse des sabotages de « terrorisme d'État » et accusé la Russie d'avoir orchestré ces attaques. Les deux hommes ont quitté la Pologne le 16 novembre 2025 et sont visés par des notices rouges d'Interpol. Le 28 octobre 2026, le parquet a renvoyé devant le tribunal régional de Varsovie un troisième Ukrainien, Volodymyr B., accusé d'avoir participé aux activités du renseignement russe contre la Pologne et aidé les deux auteurs, notamment en conduisant Yevhenii I. sur les lieux en septembre 2025 pour repérer l'emplacement des explosifs. Il encourt la réclusion à perpétuité. Le parquet a rendu l'acte d'accusation public le 12 novembre 2026."},es:{nom:"Un ucraniano, procesado ante la justicia polaca por haber colaborado en el sabotaje de la línea ferroviaria Varsovia-Lublin",pays:"Polonia",lieu:"Mika y Gołąb",desc:"El 15 de noviembre de 2025, dos ucranianos, Oleksandr K. y Yevhenii I., hicieron explotar un artefacto colocado en la vía férrea en Mika, en el distrito de Garwolin, al paso de un tren de mercancías, según la Fiscalía Nacional polaca. Entre el 1 de octubre y el 16 de noviembre de 2025, también colocaron en las vías de Gołąb, en el distrito de Puławy, dos elementos metálicos capaces de provocar el descarrilamiento de trenes; en esa línea, un tren que transportaba a 475 pasajeros tuvo que realizar una parada de emergencia. Ante la Dieta, el primer ministro Donald Tusk calificó el aumento de los sabotajes de «terrorismo de Estado» y acusó a Rusia de haber orquestado estos ataques. Los dos hombres abandonaron Polonia el 16 de noviembre de 2025 y son objeto de notificaciones rojas de Interpol. El 28 de octubre de 2026, la fiscalía remitió ante el tribunal regional de Varsovia a un tercer ucraniano, Volodymyr B., acusado de haber participado en las actividades de los servicios de inteligencia rusos contra Polonia y de haber ayudado a los dos autores, en particular llevando a Yevhenii I. al lugar de los hechos en septiembre de 2025 para localizar la ubicación de los explosivos. Se enfrenta a una pena de cadena perpetua. La Fiscalía hizo pública la acusación el 12 de noviembre de 2026."},it:{nom:"Un ucraino deferito alla giustizia polacca per aver contribuito al sabotaggio della linea ferroviaria Varsavia-Lublino",pays:"Polonia",lieu:"Mika e Gołąb",desc:"Il 15 novembre 2025, due ucraini, Oleksandr K. e Yevhenii I., fanno esplodere un ordigno posato sui binari a Mika, nel distretto di Garwolin, al passaggio di un treno merci, secondo la Procura nazionale polacca. Tra il 1° ottobre e il 16 novembre 2025, hanno inoltre fissato sui binari a Gołąb, nel distretto di Puławy, due elementi metallici in grado di provocare il deragliamento dei treni; su quella linea, un treno che trasportava 475 passeggeri ha dovuto effettuare una fermata di emergenza. Davanti alla Dieta, il primo ministro Donald Tusk ha definito l’aumento degli atti di sabotaggio «terrorismo di Stato» e ha accusato la Russia di aver orchestrato questi attacchi. I due uomini hanno lasciato la Polonia il 16 novembre 2025 e sono ricercati tramite segnalazioni rosse dell’Interpol. Il 28 ottobre 2026, la Procura ha rinviato a giudizio dinanzi al Tribunale regionale di Varsavia un terzo ucraino, Volodymyr B., accusato di aver partecipato alle attività dei servizi segreti russi contro la Polonia e di aver aiutato i due autori, in particolare accompagnando Yevhenii I. sul posto nel settembre 2025 per individuare la posizione degli esplosivi. Rischia l’ergastolo. La Procura ha reso pubblico l’atto d’accusa il 12 novembre 2026."}}},{id:"EVEN5953",p:7,cat:2,seuil:"Suspecté",passe:!1,date:"2026-10-31",entree:"2026-11-13",src:"https://www.spiegel.de/politik/massiver-cyberangriff-auf-drohnenhersteller-quantum-systems-a-354b0289-2281-4af6-a532-ee03b45d8b30",txt:{fr:{nom:"Une cyberattaque vise le fabricant allemand de drones militaires Quantum Systems",pays:"Allemagne",lieu:"Munich",desc:"Le 12 novembre 2026, le fabricant munichois de drones militaires Quantum Systems confirme avoir détecté fin octobre 2026 une « cyberattaque active menée par des acteurs hostiles ». Les attaquants ont déposé sur un serveur interne de mises à jour un logiciel malveillant présenté comme une mise à jour de Qbase, le logiciel de planification de missions du drone de reconnaissance Vector, utilisé par l'Ukraine et acheté par la Bundeswehr sous le nom de « Falke ». La fausse mise à jour a été envoyée à des serveurs de la Bundeswehr et d'autres clients, mais pas aux drones. La Bundeswehr a brièvement maintenu au sol la flotte de drones du fabricant. Le contre-espionnage militaire (MAD), l'Office fédéral de protection de la Constitution (BfV) et l'Office fédéral de la sécurité des technologies de l'information (BSI) sont saisis. Le 13 novembre 2026, une source proche du dossier indique que les premiers éléments désignent la Russie et que les services de renseignement enquêtent. Aucune autorité n'a désigné publiquement de responsable."},es:{nom:"Un ciberataque tiene como objetivo al fabricante alemán de drones militares Quantum Systems",pays:"Alemania",lieu:"Múnich",desc:"El 12 de noviembre de 2026, el fabricante de drones militares Quantum Systems, con sede en Múnich, confirma haber detectado a finales de octubre de 2026 un «ciberataque activo perpetrado por actores hostiles». Los atacantes introdujeron en un servidor interno de actualizaciones un software malicioso presentado como una actualización de Qbase, el software de planificación de misiones del dron de reconocimiento Vector, utilizado por Ucrania y adquirido por la Bundeswehr bajo el nombre de «Falke». La falsa actualización se envió a servidores de la Bundeswehr y de otros clientes, pero no a los drones. La Bundeswehr mantuvo en tierra durante un breve periodo de tiempo la flota de drones del fabricante. Se ha informado del asunto al Servicio de Contrainteligencia Militar (MAD), a la Oficina Federal para la Protección de la Constitución (BfV) y a la Oficina Federal de Seguridad de las Tecnologías de la Información (BSI). El 13 de noviembre de 2026, una fuente cercana al caso indica que los primeros indicios apuntan a Rusia y que los servicios de inteligencia están investigando. Ninguna autoridad ha señalado públicamente a ningún responsable."},it:{nom:"Un attacco informatico prende di mira il produttore tedesco di droni militari Quantum Systems",pays:"Germania",lieu:"Monaco di Baviera",desc:"Il 12 novembre 2026, Quantum Systems, produttore di droni militari con sede a Monaco di Baviera, conferma di aver rilevato alla fine di ottobre 2026 un «attacco informatico in corso condotto da attori ostili». Gli aggressori hanno inserito su un server interno dedicato agli aggiornamenti un software dannoso presentato come un aggiornamento di Qbase, il software di pianificazione delle missioni del drone da ricognizione Vector, utilizzato dall’Ucraina e acquistato dalla Bundeswehr con il nome di «Falke». Il falso aggiornamento è stato inviato ai server della Bundeswehr e di altri clienti, ma non ai droni. La Bundeswehr ha temporaneamente tenuto a terra la flotta di droni del produttore. Sono stati coinvolti il servizio di controspionaggio militare (MAD), l’Ufficio federale per la protezione della Costituzione (BfV) e l’Ufficio federale per la sicurezza delle tecnologie dell’informazione (BSI). Il 13 novembre 2026, una fonte vicina al caso ha indicato che le prime prove puntano alla Russia e che i servizi di intelligence stanno indagando. Nessuna autorità ha pubblicamente individuato un responsabile."}}},{id:"EVENM008",p:7,cat:5,seuil:"Suspecté",passe:!1,date:"2026-11-10",entree:"2026-11-13",src:"https://theins.press/en/news/299427",txt:{fr:{nom:"Une campagne du réseau de bots Matryoshka cible les élections législatives anticipées en Espagne",pays:"Espagne",lieu:"Espagne",desc:"Le 11 novembre 2026, les chercheurs du projet AntiBot4Navalny, qui surveille l'activité des bots prorusses, signalent une nouvelle campagne du réseau Matryoshka avant les élections législatives anticipées espagnoles du 29 novembre 2026. Les bots diffusent de fausses vidéos imitant des reportages d'Euronews, de Reuters, de l'AFP, de France 24 et d'El País, ainsi que de fausses unes de Libération, de La Croix et du Nouvel Économiste datées des 10 et 11 novembre. Ces contenus affirment que l'aide à l'Ukraine et les sanctions contre la Russie plongent l'Europe dans la crise et que les élections ne changeront rien, et prônent la levée des sanctions, la sortie de l'Espagne de l'Union ou l'indépendance de la Catalogne ; des propos y sont attribués aux économistes Jordi Galí et Xavier Sala-i-Martin et à l'essayiste Raphaël Enthoven. Selon des documents internes de l'Agence de design social (ASD), qui travaillait pour l'administration présidentielle russe, la fabrication de faux reportages au nom de médias occidentaux remonte à 2022. Aucune autorité n'a attribué cette campagne."},es:{nom:"Una campaña de la red de bots Matryoshka tiene como objetivo las elecciones generales anticipadas en España",pays:"España",lieu:"España",desc:"El 11 de noviembre de 2026, los investigadores del proyecto AntiBot4Navalny, que supervisa la actividad de los bots prorrusos, alertan de una nueva campaña de la red Matryoshka antes de las elecciones legislativas anticipadas españolas del 29 de noviembre de 2026. Los bots difunden vídeos falsos que imitan reportajes de Euronews, Reuters, AFP, France 24 y El País, así como portadas falsas de Libération, La Croix y Le Nouvel Économiste con fecha del 10 y el 11 de noviembre. Estos contenidos afirman que la ayuda a Ucrania y las sanciones contra Rusia sumen a Europa en una crisis y que las elecciones no cambiarán nada, y abogan por el levantamiento de las sanciones, la salida de España de la Unión o la independencia de Cataluña; en ellos se atribuyen declaraciones a los economistas Jordi Galí y Xavier Sala-i-Martin, así como al ensayista Raphaël Enthoven. Según documentos internos de la Agencia de Diseño Social (ASD), que trabajaba para la administración presidencial rusa, la fabricación de noticias falsas en nombre de medios de comunicación occidentales se remonta a 2022. Ninguna autoridad ha atribuido esta campaña a nadie."},it:{nom:"Una campagna della rete di bot Matryoshka prende di mira le elezioni legislative anticipate in Spagna",pays:"Spagna",lieu:"Spagna",desc:"L’11 novembre 2026, i ricercatori del progetto AntiBot4Navalny, che monitora l’attività dei bot filorussi, segnalano una nuova campagna della rete Matryoshka in vista delle elezioni legislative anticipate spagnole del 29 novembre 2026. I bot diffondono video falsi che imitano i servizi di Euronews, Reuters, AFP, France 24 ed El País, nonché false prime pagine di Libération, La Croix e Le Nouvel Économiste datate 10 e 11 novembre. Questi contenuti sostengono che gli aiuti all’Ucraina e le sanzioni contro la Russia stiano facendo sprofondare l’Europa in una crisi e che le elezioni non cambieranno nulla, e propugnano la revoca delle sanzioni, l’uscita della Spagna dall’Unione o l’indipendenza della Catalogna; in essi vengono attribuite alcune dichiarazioni agli economisti Jordi Galí e Xavier Sala-i-Martin e al saggista Raphaël Enthoven. Secondo documenti interni dell’Agenzia di design sociale (ASD), che lavorava per l’amministrazione presidenziale russa, la produzione di notizie false a nome dei media occidentali risale al 2022. Nessuna autorità ha attribuito la responsabilità di questa campagna."}}},{id:"EVEN5881",p:7,cat:4,seuil:"Attribué",passe:!1,date:"2026-11-12",entree:"2026-11-13",src:"https://www.jurnal.md/ro/news/b4d799357e976a75/video-un-barbat-a-fost-retinut-fiind-suspectat-de-spionaj-in-favoarea-federatiei-ruse.html",txt:{fr:{nom:"Un homme soupçonné d'espionnage pour les services russes placé en détention en Moldavie",pays:"Moldavie",lieu:"Site non identifié",desc:"Le 12 novembre 2026, le Service de renseignement et de sécurité (SIS) annonce que ses agents, en coopération avec le parquet chargé de la lutte contre la criminalité organisée et des affaires spéciales (PCCOCS), ont arrêté un homme soupçonné d'avoir recueilli des informations pour les services spéciaux russes. Selon les éléments de preuve cités, il a des liens avec des représentants des services spéciaux russes et des structures non constitutionnelles de la région transnistrienne. Il aurait été recruté pour recueillir des informations au sein d'institutions chargées de la sécurité nationale, avec pour mission de savoir ce que les autorités savaient de certaines opérations de représentants de services étrangers en Moldavie. Il est poursuivi pour collecte non autorisée d'informations et a été placé en détention provisoire à la demande des procureurs. La date et le lieu de l'arrestation n'ont pas été communiqués."},es:{nom:"Detienen en Moldavia a un hombre sospechoso de espiar para los servicios rusos",pays:"Moldavia",lieu:"Sitio web no identificado",desc:"El 12 de noviembre de 2026, el Servicio de Inteligencia y Seguridad (SIS) anuncia que sus agentes, en colaboración con la Fiscalía encargada de la lucha contra la delincuencia organizada y los asuntos especiales (PCCOCS), han detenido a un hombre sospechoso de haber recabado información para los servicios secretos rusos. Según las pruebas citadas, mantiene vínculos con representantes de los servicios secretos rusos y de estructuras no constitucionales de la región de Transnistria. Al parecer, fue reclutado para recabar información en instituciones encargadas de la seguridad nacional, con la misión de averiguar qué sabían las autoridades sobre determinadas operaciones de representantes de servicios extranjeros en Moldavia. Se le acusa de recopilación no autorizada de información y ha sido puesto en prisión preventiva a petición de la fiscalía. No se han facilitado la fecha ni el lugar de la detención."},it:{nom:"Un uomo sospettato di spionaggio per conto dei servizi russi è stato posto in stato di detenzione in Moldavia",pays:"Moldavia",lieu:"Sito non identificato",desc:"Il 12 novembre 2026, il Servizio di intelligence e sicurezza (SIS) annuncia che i propri agenti, in collaborazione con la Procura incaricata della lotta alla criminalità organizzata e degli affari speciali (PCCOCS), hanno arrestato un uomo sospettato di aver raccolto informazioni per i servizi segreti russi. Secondo le prove citate, l’uomo avrebbe legami con rappresentanti dei servizi segreti russi e con strutture non costituzionali della regione della Transnistria. Sarebbe stato reclutato per raccogliere informazioni all’interno delle istituzioni incaricate della sicurezza nazionale, con il compito di scoprire cosa sapessero le autorità in merito a determinate operazioni condotte da rappresentanti di servizi stranieri in Moldavia. È perseguito per raccolta non autorizzata di informazioni ed è stato posto in custodia cautelare su richiesta dei pubblici ministeri. La data e il luogo dell’arresto non sono stati resi noti."}}},{id:"EVEN5933",p:7,cat:0,seuil:"Non déterminé",passe:!1,date:"2026-11-12",entree:"2026-11-13",src:"https://kyivindependent.com/moldovan-police-find-drone-fragments-in-vineyard-near-ukrainian-border/",txt:{fr:{nom:"Des fragments de drone découverts près d'Antonești, en Moldavie",pays:"Moldavie",lieu:"Antonești",desc:"Le 12 novembre 2026, la police moldave annonce que des fragments de drone ont été découverts dans une vigne à la périphérie du village d'Antonești, dans le raion de Ștefan Vodă, à une dizaine de kilomètres de la région ukrainienne d'Odessa, après le signalement d'un habitant. La découverte intervient quelques heures après une attaque de drones russes contre Odessa et ses environs, vers midi, que le gouverneur de la région, Oleh Kiper, a qualifiée de « massive ». Selon la police, l'origine des fragments est en cours d'examen. Aucune autorité n'a désigné l'origine de l'appareil."},es:{nom:"Se han hallado fragmentos de un dron cerca de Antonești, en Moldavia",pays:"Moldavia",lieu:"Antonești",desc:"El 12 de noviembre de 2026, la policía moldava anuncia que se han hallado fragmentos de un dron en un viñedo a las afueras de la localidad de Antonești, en el raión de Ștefan Vodă, a unos diez kilómetros de la región ucraniana de Odesa, tras el aviso de un vecino. El hallazgo se produce pocas horas después de un ataque con drones rusos contra Odesa y sus alrededores, hacia el mediodía, que el gobernador de la región, Oleh Kiper, calificó de «masivo». Según la policía, se está investigando el origen de los fragmentos. Ninguna autoridad ha determinado la procedencia del aparato."},it:{nom:"Ritrovati frammenti di un drone nei pressi di Antonești, in Moldavia",pays:"Moldavia",lieu:"Antonești",desc:"Il 12 novembre 2026, la polizia moldava annuncia che sono stati rinvenuti frammenti di un drone in un vigneto alla periferia del villaggio di Antonești, nel raion di Ștefan Vodă, a una decina di chilometri dalla regione ucraina di Odessa, in seguito alla segnalazione di un abitante. Il ritrovamento avviene poche ore dopo un attacco di droni russi contro Odessa e i suoi dintorni, verso mezzogiorno, che il governatore della regione, Oleh Kiper, ha definito «massiccio». Secondo la polizia, l’origine dei frammenti è attualmente oggetto di indagine. Nessuna autorità ha indicato la provenienza del velivolo."}}},{id:"EVEN6098",p:8,cat:0,seuil:"Non déterminé",passe:!1,date:"2026-11-13",entree:"2026-11-14",src:"https://www.reuters.com/world/uk/us-military-responds-suspected-drone-activity-raf-lakenheath-base-uk-sky-news-2026-11-13/",txt:{fr:{nom:"Une activité de drone suspectée déclenche une alerte sur la base de RAF Lakenheath",pays:"Royaume-Uni",lieu:"Lakenheath",desc:"Le 13 novembre 2026 au soir, une alarme retentit sur la base de RAF Lakenheath, dans le Suffolk, qui accueille la 48e escadre de chasse de l'armée de l'air américaine. Un porte-parole de l'US Air Force déclare que les forces de sécurité ont répondu à une « activité de drone non autorisée suspectée » au-dessus de la base et qu'« aucun personnel, aucun appareil ni aucune infrastructure n'a été touché ». Le ministère britannique de la Défense indique que la situation est « résolue » et qu'il travaille avec les forces américaines pour « établir les faits ». Le nombre et le type des drones n'ont pas été communiqués. Dans la même semaine, l'armée américaine avait retiré des avions ravitailleurs de la base voisine de RAF Mildenhall, et le ministère américain de la Justice avait annoncé l'inculpation de trois hommes présentés comme des « agents iraniens » pour un projet d'attentat visant la base de RAF Fairford en septembre. Aucune autorité n'a désigné de responsable de l'activité de drone."},es:{nom:"Una actividad sospechosa de un dron desencadena una alerta en la base de la RAF en Lakenheath",pays:"Reino Unido",lieu:"Lakenheath",desc:"La noche del 13 de noviembre de 2026, suena una alarma en la base de la RAF de Lakenheath, en Suffolk, que alberga la 48.ª Escuadrilla de Caza de la Fuerza Aérea de los Estados Unidos. Un portavoz de la Fuerza Aérea de EE. UU. declara que las fuerzas de seguridad han respondido a una «sospecha de actividad no autorizada de drones» sobre la base y que «no se ha visto afectado ningún miembro del personal, ningún aparato ni ninguna infraestructura». El Ministerio de Defensa británico indica que la situación está «resuelta» y que está colaborando con las fuerzas estadounidenses para «esclarecer los hechos». No se ha facilitado el número ni el tipo de drones. Esa misma semana, el ejército estadounidense había retirado aviones cisterna de la base vecina de la RAF Mildenhall, y el Ministerio de Justicia de EE. UU. había anunciado la imputación de tres hombres presentados como «agentes iraníes» por un plan de atentado contra la base de la RAF Fairford en septiembre. Ninguna autoridad ha señalado a ningún responsable de la actividad con drones."},it:{nom:"Un'attività sospetta di un drone fa scattare un allarme alla base della RAF di Lakenheath",pays:"Regno Unito",lieu:"Lakenheath",desc:"La sera del 13 novembre 2026, suona un allarme alla base della RAF di Lakenheath, nel Suffolk, che ospita la 48ª squadriglia da caccia dell’aeronautica militare statunitense. Un portavoce dell’Aeronautica Militare degli Stati Uniti dichiara che le forze di sicurezza sono intervenute in seguito a una «sospetta attività non autorizzata di droni» sopra la base e che «nessun membro del personale, nessun velivolo né alcuna infrastruttura sono stati colpiti». Il Ministero della Difesa britannico ha indicato che la situazione è «risolta» e che sta collaborando con le forze statunitensi per «accertare i fatti». Il numero e il tipo dei droni non sono stati resi noti. Nella stessa settimana, l’esercito statunitense aveva ritirato alcuni aerei rifornitori dalla vicina base della RAF di Mildenhall, e il Dipartimento di Giustizia statunitense aveva annunciato l’incriminazione di tre uomini descritti come «agenti iraniani» per un piano di attentato contro la base della RAF di Fairford a settembre. Nessuna autorità ha indicato chi fosse responsabile dell’attività dei droni."}}},{id:"EVENM009",p:8,cat:6,seuil:"Non déterminé",passe:!1,date:"2026-11-10",entree:"2026-11-15",src:"https://www.elespanol.com/espana/20261112/guardia-civil-investiga-oleada-falsos-avisos-bomba-espana-infraestructuras-transportes/1003744455004_0.amp.html",txt:{fr:{nom:"Une vague de fausses alertes à la bombe et d'objets suspects mobilise les démineurs en Espagne",pays:"Espagne",lieu:"Madrid et plusieurs villes",desc:"Le 10 novembre 2026 au soir, la Police nationale boucle les abords de la direction générale de la Guardia Civil, rue Guzmán el Bueno à Madrid, après deux avis de bombe ; aucun explosif n'est trouvé. Le 11 novembre, les démineurs de la Police nationale font exploser une valise abandonnée place d'Espagne, et la Guardia Civil détruit à Guadarrama un sac à dos abandonné près d'un supermarché, sans explosif. Du 11 au 13 novembre, des bagages suspects et des avis de bombe mobilisent les forces de sécurité à Grenade, Séville, Murcie, Marbella, Saragosse, Cordoue, Mataró, Fuenlabrada, Arganda del Rey et Galapagar. Le 13 novembre, selon des sources policières, les services d'urgence de Madrid ont reçu 30 avis de bombe en un jour et demi ; les enquêteurs relèvent un même schéma dans certains, notamment ceux visant des vols de Ryanair, sans pouvoir encore les distinguer des avis nés de la psychose liée à l'engin artisanal qui a tué un policier à Oviedo. Le 15 novembre, des sources non identifiées indiquent que des services de renseignement européens enquêtent sur ces menaces. Aucune arrestation n'a été annoncée et aucune autorité n'a désigné de responsable."},es:{nom:"Una oleada de falsas alertas de bomba y objetos sospechosos moviliza a los artificieros en España",pays:"España",lieu:"Madrid y varias ciudades",desc:"La noche del 10 de noviembre de 2026, la Policía Nacional acordonó los alrededores de la Dirección General de la Guardia Civil, en la calle Guzmán el Bueno de Madrid, tras dos alertas de bomba; no se encontró ningún explosivo. El 11 de noviembre, los artificieros de la Policía Nacional hacen estallar una maleta abandonada en la Plaza de España, y la Guardia Civil destruye en Guadarrama una mochila abandonada cerca de un supermercado, sin explosivos. Entre el 11 y el 13 de noviembre, equipajes sospechosos y avisos de bomba movilizan a las fuerzas de seguridad en Granada, Sevilla, Murcia, Marbella, Zaragoza, Córdoba, Mataró, Fuenlabrada, Arganda del Rey y Galapagar. El 13 de noviembre, según fuentes policiales, los servicios de emergencia de Madrid recibieron 30 avisos de bomba en un día y medio; los investigadores detectan un mismo patrón en algunas de ellas, sobre todo en las dirigidas contra vuelos de Ryanair, sin poder distinguirlas aún de las alertas provocadas por la psicosis relacionada con el artefacto casero que mató a un policía en Oviedo. El 15 de noviembre, fuentes no identificadas indicaron que los servicios de inteligencia europeos están investigando estas amenazas. No se ha anunciado ninguna detención y ninguna autoridad ha señalado a ningún responsable."},it:{nom:"Un'ondata di falsi allarmi bomba e oggetti sospetti mobilita gli artificieri in Spagna",pays:"Spagna",lieu:"Madrid e diverse città",desc:"La sera del 10 novembre 2026, la Polizia nazionale isola l’area circostante la sede centrale della Guardia Civil, in via Guzmán el Bueno a Madrid, a seguito di due segnalazioni di bomba; non viene rinvenuto alcun esplosivo. L’11 novembre, gli artificieri della Polizia nazionale fanno esplodere una valigia abbandonata in Plaza de España, mentre la Guardia Civil distrugge a Guadarrama uno zaino abbandonato nei pressi di un supermercato, privo di esplosivo. Dall’11 al 13 novembre, bagagli sospetti e segnalazioni di bombe mobilitano le forze di sicurezza a Granada, Siviglia, Murcia, Marbella, Saragozza, Cordova, Mataró, Fuenlabrada, Arganda del Rey e Galapagar. Il 13 novembre, secondo fonti di polizia, i servizi di emergenza di Madrid hanno ricevuto 30 segnalazioni di bombe in un giorno e mezzo; gli investigatori rilevano uno schema ricorrente in alcune di esse, in particolare quelle che prendono di mira i voli della Ryanair, senza poterle ancora distinguere dalle segnalazioni scaturite dalla psicosi legata all’ordigno artigianale che ha ucciso un poliziotto a Oviedo. Il 15 novembre, fonti non identificate indicano che i servizi di intelligence europei stanno indagando su queste minacce. Non è stato annunciato alcun arresto e nessuna autorità ha individuato un responsabile."}}},{id:"EVEN6136",p:8,cat:0,seuil:"Non déterminé",passe:!1,date:"2026-11-13",entree:"2026-11-15",src:"https://adevarul.ro/stiri-interne/evenimente/drona-detectata-in-apropierea-insulei-serpilor-2571457.html",txt:{fr:{nom:"Des F-16 roumains décollent à deux reprises après la détection de drones près de l'île des Serpents",pays:"Roumanie",lieu:"Île des Serpents",desc:"Le 13 novembre 2026 au soir, deux F-16 roumains de la police aérienne sont mis en l'air pour surveiller un drone détecté près de l'île des Serpents ; un message RO-Alert est envoyé à 21h53 aux habitants du nord du comté de Tulcea. Le 14 novembre au matin, le système radar du ministère roumain de la Défense détecte une nouvelle cible aérienne près de l'île : deux F-16 décollent de la base aérienne 86 de Fetești et des messages RO-Alert sont envoyés à 4h45 aux habitants de l'est du comté, puis à 5h39 à ceux du nord. L'alerte prend fin à 5h52. Le ministère ne précise ni la nature ni l'origine des cibles."},es:{nom:"Varios F-16 rumanos despegan en dos ocasiones tras la detección de drones cerca de la Isla de las Serpientes",pays:"Rumanía",lieu:"Isla de las Serpientes",desc:"La noche del 13 de noviembre de 2026, dos F-16 rumanos de la policía aérea despegan para vigilar un dron detectado cerca de la isla de las Serpientes; a las 21:53 se envía un mensaje RO-Alert a los habitantes del norte del condado de Tulcea. La mañana del 14 de noviembre, el sistema de radar del Ministerio de Defensa rumano detecta un nuevo objetivo aéreo cerca de la isla: dos F-16 despegan de la base aérea 86 de Fetești y se envían mensajes RO-Alert a las 4:45 a los habitantes del este del condado y, posteriormente, a las 5:39, a los del norte. La alerta finaliza a las 5:52. El Ministerio no especifica ni la naturaleza ni el origen de los objetivos."},it:{nom:"Gli F-16 rumeni decollano due volte dopo l’avvistamento di droni nei pressi dell’Isola dei Serpenti",pays:"Romania",lieu:"Isola dei Serpenti",desc:"La sera del 13 novembre 2026, due F-16 rumeni della polizia aerea vengono fatti decollare per sorvegliare un drone individuato nei pressi dell’Isola dei Serpenti; alle 21:53 viene inviato un messaggio RO-Alert agli abitanti della parte settentrionale della contea di Tulcea. La mattina del 14 novembre, il sistema radar del Ministero della Difesa rumeno rileva un nuovo bersaglio aereo nei pressi dell’isola: due F-16 decollano dalla base aerea 86 di Fetești e alle 4:45 vengono inviati messaggi RO-Alert agli abitanti della parte orientale della contea, poi alle 5:39 a quelli della parte settentrionale. L’allerta termina alle 5:52. Il ministero non precisa né la natura né l’origine dei bersagli."}}},{id:"EVEN6141",p:8,cat:1,seuil:"Non déterminé",passe:!1,date:"2026-11-13",entree:"2026-11-15",src:"https://hotnews.ro/nava-lovita-de-o-drona-in-apele-romaniei-langa-sfantu-gheorghe-anuntul-ministerului-apararii-2404236",txt:{fr:{nom:"Un cargo faisant route vers l'Ukraine est touché par un drone dans les eaux territoriales roumaines",pays:"Roumanie",lieu:"Au nord-est de Sfântu Gheorghe",desc:"Le 13 novembre 2026 vers 21h40, le Larissa 1, cargo sous pavillon des Palaos qui faisait route vers la rade de Sulina avant de rejoindre l'Ukraine, est touché par un drone aérien dans les eaux territoriales roumaines, à près de 7 milles marins (environ 12,6 kilomètres) au nord-est de Sfântu Gheorghe, dans le comté de Tulcea. L'impact endommage une grue de chargement, sans provoquer d'incendie ; le commandant prévient aussitôt les autorités navales roumaines. Le 14 novembre, au port militaire de Constanța, le ministre roumain de la Défense, Ștefan-Radu Oprea, confirme l'incident, déclare : « Nous sommes informés en permanence. Il n'y a ni blessés ni pertes humaines » et indique qu'une enquête est en cours. Les autorités roumaines n'ont pas identifié l'origine du drone. Le 14 novembre au soir, deux autres navires sont touchés par des drones près de Sulina. Aucune autorité n'a désigné de responsable."},es:{nom:"Un buque de carga que se dirigía a Ucrania es alcanzado por un dron en aguas territoriales rumanas",pays:"Rumanía",lieu:"Al noreste de Sfântu Gheorghe",desc:"El 13 de noviembre de 2026, hacia las 21:40 horas, el Larissa 1, un buque de carga con pabellón de Palau que se dirigía a la rada de Sulina antes de llegar a Ucrania, fue alcanzado por un dron aéreo en aguas territoriales rumanas, a unas 7 millas náuticas (aproximadamente 12,6 kilómetros) al noreste de Sfântu Gheorghe, en el condado de Tulcea. El impacto dañó una grúa de carga, sin provocar ningún incendio; el capitán avisó inmediatamente a las autoridades navales rumanas. El 14 de noviembre, en el puerto militar de Constanza, el ministro de Defensa rumano, Ștefan-Radu Oprea, confirmó el incidente y declaró: «Estamos constantemente informados. No hay heridos ni víctimas mortales», e indicó que se está llevando a cabo una investigación. Las autoridades rumanas no han identificado el origen del dron. La noche del 14 de noviembre, otros dos buques fueron alcanzados por drones cerca de Sulina. Ninguna autoridad ha señalado a ningún responsable."},it:{nom:"Una nave da carico diretta in Ucraina viene colpita da un drone nelle acque territoriali rumene",pays:"Romania",lieu:"A nord-est di Sfântu Gheorghe",desc:"Il 13 novembre 2026, verso le 21:40, la Larissa 1, una nave da carico battente bandiera delle Isole Palau che si dirigeva verso la rada di Sulina prima di raggiungere l’Ucraina, è stata colpita da un drone nelle acque territoriali rumene, a circa 7 miglia nautiche (circa 12,6 chilometri) a nord-est di Sfântu Gheorghe, nella contea di Tulcea. L’impatto ha danneggiato una gru di carico, senza provocare incendi; il comandante ha immediatamente avvisato le autorità navali rumene. Il 14 novembre, presso il porto militare di Costanza, il ministro della Difesa rumeno, Ștefan-Radu Oprea, conferma l’incidente, dichiarando: «Siamo costantemente informati. Non ci sono feriti né vittime» e precisa che è in corso un’indagine. Le autorità rumene non hanno identificato l’origine del drone. La sera del 14 novembre, altre due navi sono state colpite da droni nei pressi di Sulina. Nessuna autorità ha individuato i responsabili."}}},{id:"EVENM010",p:8,cat:1,seuil:"Non déterminé",passe:!1,date:"2026-11-14",entree:"2026-11-15",src:"https://www.news.ro/social/update-mapn-tinta-aeriana-detectata-est-insula-serpilor-doua-nave-comerciale-lovite-drone-au-provocat-incendii-bord-victime-mesaje-alert-judetul-tulcea-drona-detectata-sud-est-sulina-1922402614002026112122988299",txt:{fr:{nom:"Trois navires commerciaux touchés par des drones au large de Sulina dans la nuit du 14 au 15 novembre",pays:"Roumanie",lieu:"Au large de Sulina",desc:"Le 14 novembre 2026 au soir, le système radar du ministère roumain de la Défense détecte une cible aérienne à l'est de l'île des Serpents. Deux F-16 décollent de la base aérienne 86 de Fetești et un message RO-Alert est envoyé à 20h51 aux habitants de l'est du comté de Tulcea. Selon le ministère, vers 21h10, le pétrolier-chimiquier Evia Petrol V, sous pavillon grec, est touché par un drone à environ 4 milles marins au sud-est du canal de Sulina, puis vers 21h45, le vraquier Marsol, à environ 5 milles marins, dans les eaux territoriales roumaines ; « dans les deux cas, les incendies ont été éteints par les équipages des navires. Aucune victime n'a été enregistrée ». Le 15 novembre 2026, le ministre de la Défense, Ștefan-Radu Oprea, indique qu'un troisième navire, le pétrolier Ali Najafov, a été touché. Le même jour, le Premier ministre, Luca Niculescu, déclare : « Ces incidents sont inacceptables et constituent une violation du droit international. Ils traduisent la dégradation de la situation sécuritaire causée par la guerre que la Russie mène contre l'Ukraine. » Les autorités roumaines n'ont pas identifié l'origine des drones."},es:{nom:"Tres buques mercantes fueron alcanzados por drones frente a las costas de Sulina durante la noche del 14 al 15 de noviembre",pays:"Rumanía",lieu:"Frente a las costas de Sulina",desc:"La noche del 14 de noviembre de 2026, el sistema de radar del Ministerio de Defensa rumano detecta un objetivo aéreo al este de la Isla de las Serpientes. Dos F-16 despegan de la base aérea 86 de Fetești y, a las 20:51, se envía un mensaje RO-Alert a los habitantes del este del condado de Tulcea. Según el ministerio, hacia las 21:10, el petrolero y buque de carga química Evia Petrol V, con pabellón griego, es alcanzado por un dron a unas 4 millas náuticas al sureste del canal de Sulina; posteriormente, hacia las 21:45, el granelero Marsol, a unas 5 millas marinas, en aguas territoriales rumanas; «en ambos casos, los incendios fueron extinguidos por las tripulaciones de los buques. No se registraron víctimas». El 15 de noviembre de 2026, el ministro de Defensa, Ștefan-Radu Oprea, indicó que un tercer buque, el petrolero Ali Najafov, había sido alcanzado. Ese mismo día, el primer ministro, Luca Niculescu, declaró: «Estos incidentes son inaceptables y constituyen una violación del derecho internacional. Reflejan el deterioro de la situación de seguridad provocado por la guerra que Rusia libra contra Ucrania». Las autoridades rumanas no han identificado el origen de los drones."},it:{nom:"Tre navi mercantili colpite da droni al largo di Sulina nella notte tra il 14 e il 15 novembre",pays:"Romania",lieu:"Al largo di Sulina",desc:"La sera del 14 novembre 2026, il sistema radar del Ministero della Difesa rumeno rileva un bersaglio aereo a est dell’Isola dei Serpenti. Due F-16 decollano dalla base aerea 86 di Fetești e alle 20:51 viene inviato un messaggio RO-Alert agli abitanti della parte orientale della contea di Tulcea. Secondo il ministero, verso le 21:10, la petroliera-chimichiera Evia Petrol V, battente bandiera greca, viene colpita da un drone a circa 4 miglia nautiche a sud-est del canale di Sulina, poi verso le 21:45, la nave portarinfuse Marsol, a circa 5 miglia marine, nelle acque territoriali rumene; «in entrambi i casi, gli incendi sono stati spenti dagli equipaggi delle navi. Non si sono registrate vittime». Il 15 novembre 2026, il ministro della Difesa, Ștefan-Radu Oprea, ha riferito che una terza nave, la petroliera Ali Najafov, è stata colpita. Lo stesso giorno, il primo ministro, Luca Niculescu, ha dichiarato: «Questi incidenti sono inaccettabili e costituiscono una violazione del diritto internazionale. Sono espressione del deterioramento della situazione di sicurezza causato dalla guerra che la Russia sta conducendo contro l’Ucraina». Le autorità rumene non hanno identificato l’origine dei droni."}}},{id:"EVEN6213",p:8,cat:6,seuil:"Non déterminé",passe:!1,date:"2026-11-09",entree:"2026-11-16",src:"https://www.nu.nl/binnenland/6416638/tientallen-vliegtuigen-verloren-gps-signaal-boven-nederland-mogelijk-sabotage.html",txt:{fr:{nom:"Un brouillage GPS perturbe des dizaines d'avions au-dessus de la mer du Nord, dont sept en approche de Schiphol",pays:"Pays-Bas",lieu:"Schiphol",desc:"Le 9 novembre 2026 vers 18h, pendant une vingtaine de minutes, des dizaines d'avions perdent le signal GPS au-dessus des Pays-Bas, de la Belgique, de l'est de l'Angleterre et du nord-ouest de l'Allemagne. Le 15 novembre, le ministère néerlandais des Infrastructures confirme que sept appareils à destination de Schiphol ont signalé une perturbation de leur GPS entre 18h15 et 18h30. Ils se posent sans incident grâce aux systèmes de secours et aux instructions des contrôleurs. Le contrôle aérien néerlandais (LVNL) juge « plausible » un brouillage délibéré ; l'Inspection des infrastructures numériques (RDI), saisie, a ouvert une enquête. Selon des analyses en sources ouvertes, l'émetteur se trouvait au niveau de la mer, à 150 à 200 kilomètres au nord de Texel. Six navires sous pavillon russe croisaient alors dans la zone ; selon des sites de suivi maritime, trois d'entre eux formaient un convoi de transport d'armes escorté par la marine russe et figurent, avec leur propriétaire, sur la liste des sanctions de l'Union. Aucune autorité n'a désigné de responsable. Il s'agit du deuxième épisode de ce type aux Pays-Bas en 2026, après celui du 23 juillet."},es:{nom:"Una interferencia en el GPS afecta a decenas de aviones sobre el mar del Norte, entre ellos siete que se aproximaban a Schiphol",pays:"Países Bajos",lieu:"Schiphol",desc:"El 9 de noviembre de 2026, hacia las 18:00 horas, durante unos veinte minutos, decenas de aviones pierden la señal del GPS sobre los Países Bajos, Bélgica, el este de Inglaterra y el noroeste de Alemania. El 15 de noviembre, el Ministerio de Infraestructuras neerlandés confirma que siete aviones con destino a Schiphol notificaron una perturbación en su GPS entre las 18:15 y las 18:30. Aterrizaron sin incidentes gracias a los sistemas de emergencia y a las instrucciones de los controladores. El control aéreo neerlandés (LVNL) considera «plausible» que se trate de una interferencia deliberada; la Inspección de Infraestructuras Digitales (RDI), a la que se ha remitido el caso, ha abierto una investigación. Según análisis de fuentes abiertas, el transmisor se encontraba a la altura del nivel del mar, entre 150 y 200 kilómetros al norte de Texel. En ese momento, seis buques con pabellón ruso navegaban por la zona; según sitios web de seguimiento marítimo, tres de ellos formaban un convoy de transporte de armas escoltado por la Armada rusa y figuran, junto con su propietario, en la lista de sanciones de la Unión. Ninguna autoridad ha señalado a ningún responsable. Se trata del segundo incidente de este tipo en los Países Bajos en 2026, tras el ocurrido el 23 de julio."},it:{nom:"Un disturbo del segnale GPS ha causato problemi a decine di aerei sopra il Mare del Nord, tra cui sette in fase di avvicinamento a Schiphol",pays:"Paesi Bassi",lieu:"Schiphol",desc:"Il 9 novembre 2026, verso le 18:00, per circa venti minuti, decine di aerei perdono il segnale GPS sopra i Paesi Bassi, il Belgio, l’Inghilterra orientale e la Germania nord-occidentale. Il 15 novembre, il Ministero delle Infrastrutture olandese conferma che sette velivoli diretti a Schiphol hanno segnalato un’interferenza al proprio GPS tra le 18:15 e le 18:30. Sono atterrati senza incidenti grazie ai sistemi di emergenza e alle istruzioni dei controllori di volo. Il controllo del traffico aereo olandese (LVNL) ritiene «plausibile» un'interferenza deliberata; l'Ispettorato delle infrastrutture digitali (RDI), adito in merito, ha avviato un'indagine. Secondo analisi basate su fonti aperte, il trasmettitore si trovava a livello del mare, tra i 150 e i 200 chilometri a nord di Texel. Sei navi battenti bandiera russa navigavano in quel momento nella zona; secondo i siti di monitoraggio marittimo, tre di esse formavano un convoglio per il trasporto di armi scortato dalla marina russa e figurano, insieme al loro proprietario, nell’elenco delle sanzioni dell’Unione. Nessuna autorità ha individuato i responsabili. Si tratta del secondo episodio di questo tipo nei Paesi Bassi nel 2026, dopo quello del 23 luglio."}}},{id:"EVEN6211",p:8,cat:5,seuil:"Attribué",passe:!1,date:"2026-11-14",entree:"2026-11-16",src:"https://www.wprost.pl/kraj/12502429/slava-upa-na-pomnikach-w-gdansku-poznaniu-i-warszawie-ambasada-ukrainy-reaguje.html",txt:{fr:{nom:"Vague d'inscriptions « Gloire à l'UPA » sur des monuments en Pologne, dont celui des Héros du ghetto à Varsovie",pays:"Pologne",lieu:"Varsovie, Gdańsk, Gdynia et Poznań",desc:"En novembre 2026, l'inscription « Gloire à l'UPA », en référence à l'Armée insurrectionnelle ukrainienne, apparaît sur des monuments de plusieurs villes polonaises : trois à Poznań, sept à Gdańsk et à Gdynia, dont celui des défenseurs de Westerplatte, puis, le 14 novembre 2026, deux à Varsovie, le monument aux Héros du ghetto et celui des soldats de la Première armée polonaise. Le 10 novembre, le média biélorusse MOST rapporte qu'un compte Telegram a proposé à l'un de ses journalistes 500 dollars pour peindre ce slogan à Poznań et cherchait des exécutants pour Varsovie, Wrocław et Lublin. Le 13 novembre, la police annonce l'interpellation à Gdańsk d'un Ukrainien de 17 ans, poursuivi pour sept dégradations et pour incitation à la haine nationale. Le 14 novembre 2026, l'ambassade d'Ukraine en Pologne y voit une manifestation de « la guerre hybride que la Russie tente de mener par tous les moyens dans les États européens, et en particulier en Pologne ». Le 15 novembre, le maire de Varsovie, Rafał Trzaskowski, évoque « une provocation planifiée » et indique que les services cherchent « les exécutants comme les commanditaires »."},es:{nom:"Oleada de pintadas con el lema «Gloria a la UPA» en monumentos de Polonia, entre ellos el de los Héroes del gueto de Varsovia",pays:"Polonia",lieu:"Varsovia, Gdańsk, Gdynia y Poznań",desc:"En noviembre de 2026, la inscripción «Gloria a la UPA», en referencia al Ejército Insurreccional Ucraniano, aparece en monumentos de varias ciudades polacas: tres en Poznań, siete en Gdańsk y en Gdynia, entre ellos el de los defensores de Westerplatte, y, posteriormente, el 14 de noviembre de 2026, dos en Varsovia: el monumento a los Héroes del gueto y el de los soldados del Primer Ejército polaco. El 10 de noviembre, el medio de comunicación bielorruso MOST informó de que una cuenta de Telegram había ofrecido a uno de sus periodistas 500 dólares por pintar ese lema en Poznań y buscaba personas que lo llevaran a cabo en Varsovia, Wrocław y Lublin. El 13 de noviembre, la policía anuncia la detención en Gdańsk de un ucraniano de 17 años, imputado por siete delitos de daños y por incitación al odio nacional. El 14 de noviembre de 2026, la embajada de Ucrania en Polonia considera que se trata de una manifestación de «la guerra híbrida que Rusia intenta llevar a cabo por todos los medios en los Estados europeos, y en particular en Polonia». El 15 de noviembre, el alcalde de Varsovia, Rafał Trzaskowski, se refirió a «una provocación planificada» e indicó que los servicios de seguridad buscan «tanto a los autores como a los instigadores»."},it:{nom:"Ondata di scritte «Gloria all’UPA» su monumenti in Polonia, tra cui quello degli Eroi del ghetto di Varsavia",pays:"Polonia",lieu:"Varsavia, Danzica, Gdynia e Poznań",desc:"Nel novembre 2026, la scritta «Gloria all’UPA», in riferimento all’Esercito insurrezionale ucraino, compare su monumenti di diverse città polacche: tre a Poznań, sette a Danzica e a Gdynia, tra cui quello dedicato ai difensori di Westerplatte, poi, il 14 novembre 2026, due a Varsavia: il monumento agli Eroi del ghetto e quello ai soldati della Prima Armata polacca. Il 10 novembre, il media bielorusso MOST riferisce che un account Telegram ha offerto a uno dei suoi giornalisti 500 dollari per dipingere questo slogan a Poznań e cercava persone disposte a farlo a Varsavia, Breslavia e Lublino. Il 13 novembre, la polizia annuncia l’arresto a Danzica di un diciassettenne ucraino, perseguito per sette atti di danneggiamento e per incitamento all’odio nazionale. Il 14 novembre 2026, l’ambasciata dell’Ucraina in Polonia vede in questo episodio una manifestazione della «guerra ibrida che la Russia sta cercando di condurre con ogni mezzo negli Stati europei, e in particolare in Polonia». Il 15 novembre, il sindaco di Varsavia, Rafał Trzaskowski, parla di «una provocazione pianificata» e precisa che le forze dell’ordine stanno cercando «sia gli esecutori che i mandanti»."}}},{id:"EVEN6272",p:8,cat:3,seuil:"Attribué",passe:!1,date:"2026-11-14",entree:"2026-11-16",src:"https://news.err.ee/1610196722/8-detained-after-gru-linked-arson-at-estonian-drone-company-threod-systems",txt:{fr:{nom:"Une tentative d'incendie criminel contre le fabricant de drones Threod Systems déjouée près de Tallinn",pays:"Estonie",lieu:"Viimsi",desc:"Le 14 novembre 2026 à 3h06, des individus tentent de pénétrer sur le site de Threod Systems, fabricant estonien de drones militaires, à Viimsi, au nord de Tallinn. Selon le directeur du Service de sécurité intérieure (Kapo), Margo Palloson, ils cherchent à briser les fenêtres et à verser des liquides inflammables pour incendier le bâtiment et provoquer une explosion. L'équipe de sécurité de l'entreprise les en empêche ; personne n'est blessé. La même nuit, une voiture que le groupe aurait utilisée, selon les enquêteurs, est incendiée à proximité. Huit résidents de Lettonie, dont quatre citoyens lettons, sont interpellés ; cinq sont placés en détention. Le Service de sécurité de l'État letton (VDD), qui avait alerté le Kapo, saisit le 14 novembre des explosifs et des munitions lors de perquisitions sur neuf sites en Lettonie. Le 15 novembre 2026, le Kapo confirme que la tentative a été commanditée par le GRU, le renseignement militaire russe ; l'enquête vise un acte contre la sécurité de l'Estonie commis pour un service de renseignement étranger. Le ministère des Affaires étrangères annonce la fermeture des points de passage routiers avec la Russie à partir du 1er décembre 2026."},es:{nom:"Frustrado un intento de incendio provocado contra el fabricante de drones Threod Systems cerca de Tallin",pays:"Estonia",lieu:"Viimsi",desc:"El 14 de noviembre de 2026, a las 3:06, varios individuos intentan entrar en las instalaciones de Threod Systems, fabricante estonio de drones militares, en Viimsi, al norte de Tallin. Según el director del Servicio de Seguridad Interna (Kapo), Margo Palloson, su intención era romper las ventanas y verter líquidos inflamables para incendiar el edificio y provocar una explosión. El equipo de seguridad de la empresa se lo impide; no hay heridos. Esa misma noche, un coche que, según los investigadores, habría utilizado el grupo, es incendiado en las inmediaciones. Se detiene a ocho residentes en Letonia, entre ellos cuatro ciudadanos letones; cinco de ellos quedan en prisión preventiva. El Servicio de Seguridad del Estado letón (VDD), que había alertado al Kapo, incautó el 14 de noviembre explosivos y munición durante registros realizados en nueve lugares de Letonia. El 15 de noviembre de 2026, el Kapo confirma que el intento fue ordenado por el GRU, el servicio de inteligencia militar ruso; la investigación se centra en un acto contra la seguridad de Estonia cometido para un servicio de inteligencia extranjero. El Ministerio de Asuntos Exteriores anuncia el cierre de los pasos fronterizos por carretera con Rusia a partir del 1 de diciembre de 2026."},it:{nom:"Sventato un tentativo di incendio doloso contro il produttore di droni Threod Systems nei pressi di Tallinn",pays:"Estonia",lieu:"Viimsi",desc:"Il 14 novembre 2026 alle ore 3:06, alcuni individui tentano di introdursi nella sede della Threod Systems, azienda estone produttrice di droni militari, a Viimsi, a nord di Tallinn. Secondo il direttore del Servizio di sicurezza interna (Kapo), Margo Palloson, il loro intento era quello di rompere le finestre e versare liquidi infiammabili per appiccare il fuoco all’edificio e provocare un’esplosione. La squadra di sicurezza dell’azienda li ha bloccati; nessuno è rimasto ferito. La stessa notte, nelle vicinanze è stata incendiata un’auto che, secondo gli investigatori, sarebbe stata utilizzata dal gruppo. Sono stati fermati otto residenti in Lettonia, tra cui quattro cittadini lettoni; cinque sono stati posti in stato di detenzione. Il Servizio di sicurezza dello Stato lettone (VDD), che aveva allertato il Kapo, il 14 novembre sequestra esplosivi e munizioni durante perquisizioni in nove siti in Lettonia. Il 15 novembre 2026, il Kapo conferma che il tentativo è stato orchestrato dal GRU, i servizi segreti militari russi; l’indagine verte su un atto contro la sicurezza dell’Estonia commesso per conto di un servizio di intelligence straniero. Il Ministero degli Affari Esteri annuncia la chiusura dei valichi stradali con la Russia a partire dal 1° dicembre 2026."}}},{id:"EVENM013",p:8,cat:5,seuil:"Confirmé",passe:!0,date:"2024-06-06",entree:"2026-11-17",src:"https://www.consilium.europa.eu/en/press/press-releases/2026/11/16/russia-s-fimi-and-malicious-cyber-activities-council-imposes-sanctions-on-30-individuals-and-two-entities/",txt:{fr:{nom:"Des campagnes de désinformation de la Social Design Agency visent l'Union, l'Allemagne et la France",pays:"Allemagne / France",lieu:"Allemagne / France",desc:"Le 16 novembre 2026, le Conseil de l'Union sanctionne la Social Design Agency (SDA), société moscovite de relations publiques et de technologies politiques qui mène, selon lui, des projets de manipulation de l'information et d'ingérence « à grande échelle », « financés, dirigés et supervisés par l'administration présidentielle russe ». Selon le Conseil, la SDA a orchestré des campagnes de désinformation visant les États membres, les institutions de l'Union et le soutien des Européens à l'Ukraine, notamment lors des élections européennes de 2024, ainsi que des « opérations dédiées » contre des États membres comme l'Allemagne et la France. Vingt-quatre personnes travaillant pour la SDA, qui ont contribué aux campagnes appelées « contre-campagne européenne » et « contre-campagne ukrainienne », sont également sanctionnées, de même que les propagandistes Vitaly Eliseev, Petr Marchenko, Yurii Podoliaka et Chay Bowes, de RT. Les personnes visées font l'objet d'un gel des avoirs et d'une interdiction d'entrer sur le territoire de l'Union. La SDA a déjà été liée au réseau de désinformation Doppelgänger."},es:{nom:"Las campañas de desinformación de la Social Design Agency tienen como objetivo a la Unión, Alemania y Francia",pays:"Alemania / Francia",lieu:"Alemania / Francia",desc:"El 16 de noviembre de 2026, el Consejo de la Unión impone sanciones a la Social Design Agency (SDA), una empresa moscovita dedicada a las relaciones públicas y las tecnologías políticas que, según el Consejo, lleva a cabo proyectos de manipulación de la
